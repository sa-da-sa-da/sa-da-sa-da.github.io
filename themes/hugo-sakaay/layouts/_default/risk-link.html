{{ define "main" }}
<div class="center-page">
  <div class="center-page-container" style="max-width:640px;padding-top:4rem">
    <div class="sidebar-card" style="text-align:center;padding:2.5rem 1.5rem">
      <div style="font-size:2.5rem">⚠️</div>
      <h1 style="margin:.5rem 0 1rem">即将离开本站</h1>
      <p style="color:var(--text-secondary);font-size:.9rem">
        你即将访问的链接不在白名单内，可能存在安全风险，请确认后继续。
      </p>
      <div class="risk-target" id="riskTarget"
           style="margin:1.25rem 0;padding:.75rem 1rem;border-radius:10px;background:var(--vp-c-bg-alt);
                  font-size:.85rem;word-break:break-all;color:var(--text-secondary)"></div>
      <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
        <a class="btn btn-brand" id="riskContinue" href="#">继续访问</a>
        <a class="btn" href="{{ "/" | relURL }}">返回首页</a>
      </div>
    </div>
    {{ with .Content }}<div class="vp-doc" style="margin-top:1rem">{{ . }}</div>{{ end }}
  </div>
</div>
<script>
  (function () {
    var target = new URLSearchParams(location.search).get('target') || '';
    var el = document.getElementById('riskTarget');
    var go = document.getElementById('riskContinue');
    if (el) el.textContent = target || '未提供目标地址';
    if (go && target) { go.href = target; go.rel = 'noopener noreferrer'; }
    else if (go) { go.style.display = 'none'; }
  })();
</script>
{{ end }}
