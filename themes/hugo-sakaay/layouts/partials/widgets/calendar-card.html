<div class="sidebar-card tk-calendar-card">
  <div class="card-title"><span class="title-icon">📅</span><span class="title-text">日历</span></div>
  <div class="tk-calendar-body">
    <div class="calendar-left">
      <div class="calendar-day" id="calendarDay">--</div>
      <div class="calendar-sub" id="calendarWeek"></div>
      <div class="calendar-sub" id="calendarDate"></div>
      <div class="calendar-sub" id="calendarLunar"></div>
      <div class="calendar-sub" id="calendarDayOfYear"></div>
    </div>
    <div class="calendar-mini">
      <div class="calendar-weekdays">
        <span>日</span><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span>
      </div>
      <div class="calendar-days" id="calendarDays"></div>
    </div>
  </div>
</div>
