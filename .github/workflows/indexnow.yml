name: 每周通知搜索引擎重抓

# 每周一 UTC 03:00（北京时间 11:00）把线上 sitemap 的全部 URL 提交给 IndexNow。
# 作用：持续提醒 Bing / Yandex 抓取，让 SEO 报告的下一次快照用的是新数据。
# 也可在 Actions 页手动触发（发版后想立刻催一次时用）。
on:
  schedule:
    - cron: '0 3 * * 1'
  workflow_dispatch:

jobs:
  submit:
    runs-on: ubuntu-latest
    steps:
      - name: 拉取仓库
        uses: actions/checkout@v4

      - name: 准备 Node（脚本只依赖内置模块）
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: 提交线上 sitemap 的全部 URL
        run: node scripts/indexnow.mjs --sitemap-url https://www.sakaay.com/sitemap.xml --batch 50
