<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>创意课堂随机点名器</title>
<style>
/* ===== Global Reset & Theme ===== */
:root{
  --bg:#060a1d;--bg2:#0e1333;--bg3:#161d48;
  --tx:#eae8f4;--tx2:#7d7a96;--tx3:#4a4770;
  --ac:#7c6aff;--ac2:#b0a4ff;--gold:#ffd700;--gold2:#ffed4a;
  --rare:#00c8ff;--elite:#2ecc71;--legend:#ff6b35;--epic:#e84393;
  --comm:#6b7280;--border:#252d60;--danger:#ff6b6b;
  --cw:136px;--ch:190px;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{width:100%;height:100%;overflow:hidden}
body{font-family:-apple-system,'PingFang SC','Microsoft YaHei',sans-serif;background:var(--bg);color:var(--tx);user-select:none;-webkit-user-select:none}

/* ===== Page System ===== */
.page{display:none;position:absolute;inset:0;z-index:1;overflow:hidden}
.page.active{display:flex;flex-direction:column}

/* ===== Home Page ===== */
.home-bg{position:absolute;inset:0;z-index:0}
.home-content{position:relative;z-index:1;display:flex;flex-direction:column;align-items:center;height:100%;padding:20px 20px 40px;gap:20px;overflow-y:auto;scroll-behavior:smooth}
.home-title{font-size:clamp(28px,6vw,52px);font-weight:900;letter-spacing:4px;background:linear-gradient(135deg,var(--ac2),var(--gold),var(--epic),var(--ac2));background-size:300% 300%;-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;animation:titleShift 6s ease infinite;text-align:center;line-height:1.3;margin-top:24px}
@keyframes titleShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.home-sub{font-size:clamp(13px,2.5vw,16px);color:var(--tx2);text-align:center;max-width:500px;line-height:1.6}
.home-class-bar{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:600px}
.home-chip{padding:6px 16px;border-radius:20px;font-size:13px;font-weight:600;background:var(--bg3);border:1px solid var(--border);color:var(--tx2);cursor:pointer;transition:.2s}
.home-chip:hover{border-color:var(--ac);color:var(--tx)}
.home-chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.home-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:14px;max-width:800px;width:100%;padding:0 10px}
.mode-card{position:relative;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px 12px;border-radius:18px;background:linear-gradient(145deg,var(--bg2),var(--bg3));border:2px solid var(--border);cursor:pointer;transition:all .3s;overflow:hidden;text-align:center;min-height:130px}
.mode-card:hover{transform:translateY(-6px) scale(1.03);border-color:var(--ac);box-shadow:0 12px 40px rgba(124,106,255,.25)}
.mode-card:active{transform:scale(.97)}
.mode-card .mc-icon{font-size:36px;margin-bottom:8px;transition:transform .3s}
.mode-card:hover .mc-icon{transform:scale(1.15) rotate(-5deg)}
.mode-card .mc-name{font-size:15px;font-weight:700;color:var(--tx);margin-bottom:4px}
.mode-card .mc-desc{font-size:11px;color:var(--tx2);line-height:1.4}
.mode-card .mc-glow{position:absolute;inset:0;opacity:0;transition:opacity .3s;pointer-events:none;border-radius:16px}
.mode-card:hover .mc-glow{opacity:1}
.home-mgmt{display:flex;gap:10px;margin-top:8px}
.home-mgmt button{padding:8px 20px;border-radius:14px;font-size:13px;font-weight:600;cursor:pointer;transition:.2s;border:1px solid var(--border);background:var(--bg3);color:var(--tx2)}
.home-mgmt button:hover{border-color:var(--ac2);color:var(--ac2)}
.home-mgmt .mgmt-primary{background:linear-gradient(135deg,var(--ac),#8b6cf6);border:none;color:#fff;box-shadow:0 4px 16px rgba(124,106,255,.3)}
.home-mgmt .mgmt-primary:hover{transform:translateY(-2px);box-shadow:0 6px 24px rgba(124,106,255,.5)}
.home-session{margin-top:16px;background:rgba(255,255,255,.04);border:1px solid var(--border);border-radius:16px;padding:0;overflow:hidden;max-height:320px;display:flex;flex-direction:column}
.hs-head{display:flex;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--border)}
.hs-title{font-size:14px;font-weight:700;color:var(--tx)}
.hs-clear{font-size:11px;padding:4px 12px;border-radius:8px;border:1px solid var(--border);background:transparent;color:var(--tx2);cursor:pointer;transition:.2s}
.hs-clear:hover{border-color:#e74c3c;color:#e74c3c}
.hs-body{flex:1;overflow-y:auto;padding:8px 12px}
.hs-empty{text-align:center;padding:20px;color:var(--tx2);font-size:13px}
.hs-item{display:flex;align-items:center;gap:8px;padding:8px 10px;border-radius:10px;margin-bottom:4px;background:rgba(255,255,255,.03);transition:.2s}
.hs-item:hover{background:rgba(255,255,255,.07)}
.hs-ava{width:32px;height:32px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:#fff;flex-shrink:0}
.hs-info{flex:1;min-width:0}
.hs-nm{font-size:13px;font-weight:600;color:var(--tx)}
.hs-meta{font-size:11px;color:var(--tx2);margin-top:1px}
.hs-rating{font-size:11px;padding:2px 8px;border-radius:6px;font-weight:600;flex-shrink:0}
.hs-rating.ex{background:rgba(255,215,0,.15);color:#ffd700}
.hs-rating.good{background:rgba(46,204,113,.15);color:#2ecc71}
.hs-rating.try{background:rgba(52,152,219,.15);color:#3498db}
.hs-rating.none{background:rgba(255,255,255,.06);color:var(--tx2)}
.hs-reward{font-size:11px;padding:3px 10px;border-radius:8px;border:1px solid rgba(255,215,0,.3);background:rgba(255,215,0,.08);color:#ffd700;cursor:pointer;transition:.2s;flex-shrink:0}
.hs-reward:hover{background:rgba(255,215,0,.2);border-color:rgba(255,215,0,.5)}
.hs-reward.given{border-color:rgba(255,215,0,.6);background:rgba(255,215,0,.2);pointer-events:none}

/* ===== Back Button (shared across mode pages) ===== */
.back-btn{display:flex;align-items:center;gap:6px;padding:6px 14px;border-radius:14px;font-size:13px;font-weight:600;background:rgba(255,255,255,.06);border:1px solid var(--border);color:var(--tx2);cursor:pointer;transition:.2s;flex-shrink:0}
.back-btn:hover{border-color:var(--ac);color:var(--ac)}

/* ===== Class Management Modal ===== */
.modal-bg{display:none;position:fixed;inset:0;z-index:200;background:rgba(0,0,0,.7);align-items:center;justify-content:center;backdrop-filter:blur(6px)}
.modal-bg.active{display:flex}
.modal{width:92%;max-width:520px;max-height:82vh;background:var(--bg2);border:1px solid var(--border);border-radius:16px;overflow:hidden;display:flex;flex-direction:column}
.modal-head{display:flex;align-items:center;justify-content:space-between;padding:14px 18px;border-bottom:1px solid var(--border)}
.modal-head h2{font-size:17px;font-weight:700}
.modal-close{width:30px;height:30px;border-radius:50%;background:0;border:1px solid var(--border);color:var(--tx2);font-size:15px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.modal-close:hover{border-color:var(--danger);color:var(--danger)}
.modal-body{padding:18px;overflow-y:auto;flex:1}
.class-list{display:flex;flex-direction:column;gap:8px}
.class-item{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-radius:10px;background:var(--bg3);border:1px solid var(--border);cursor:pointer;transition:.2s}
.class-item:hover{border-color:var(--ac)}
.class-item.on{border-color:var(--ac);background:rgba(124,106,255,.1)}
.class-item .ci-name{font-size:14px;font-weight:600}
.class-item .ci-count{font-size:11px;color:var(--tx2);margin-left:8px}
.class-item .ci-actions{display:flex;gap:6px}
.class-item .ci-actions button{padding:3px 8px;border-radius:6px;font-size:11px;background:0;border:1px solid var(--border);color:var(--tx2);cursor:pointer;transition:.15s}
.class-item .ci-actions button:hover{border-color:var(--ac2);color:var(--ac2)}
.class-item .ci-actions .del-btn:hover{border-color:var(--danger);color:var(--danger)}
.add-form{margin-top:16px;padding-top:16px;border-top:1px solid var(--border)}
.add-form h3{font-size:13px;color:var(--tx2);margin-bottom:10px}
.form-group{margin-bottom:10px}
.form-group label{display:block;font-size:12px;color:var(--tx2);margin-bottom:4px}
.form-input{width:100%;padding:9px 12px;background:var(--bg);border:1px solid var(--border);border-radius:8px;color:var(--tx);font-size:13px;font-family:inherit}
.form-input:focus{outline:0;border-color:var(--ac)}
textarea.form-input{min-height:90px;resize:vertical}
.form-btn{padding:8px 20px;border-radius:8px;background:var(--ac);border:0;color:#fff;font-size:13px;cursor:pointer;transition:.2s}
.form-btn:hover{background:#6b5ae0}

/* ===== Mode Page Top Bar ===== */
.mode-top{position:relative;z-index:10;display:flex;align-items:center;padding:8px 12px;height:48px;gap:10px}
.mode-top .mode-title{font-size:17px;font-weight:800;white-space:nowrap;letter-spacing:1px}
.mode-top .mode-chips{display:flex;gap:6px;flex:1;justify-content:center;overflow:hidden}
.mode-top .chip{padding:4px 12px;border-radius:16px;font-size:12px;font-weight:500;background:var(--bg3);border:1px solid var(--border);color:var(--tx2);cursor:pointer;transition:.2s;white-space:nowrap}
.mode-top .chip:hover{border-color:var(--ac);color:var(--tx)}.mode-top .chip.on{background:var(--ac);border-color:var(--ac);color:#fff}
.mode-top .mode-btns{display:flex;gap:6px}
.mode-top .ibtn{width:32px;height:32px;border-radius:50%;background:0;border:1px solid var(--border);color:var(--tx2);font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:.2s}
.mode-top .ibtn:hover{border-color:var(--ac2);color:var(--ac2)}

/* ===== Mode Page Bottom Bar ===== */
.mode-bbar{position:relative;z-index:10;display:flex;align-items:center;justify-content:center;gap:12px;padding:10px 16px;min-height:56px}
.mode-bbar .chk{display:flex;align-items:center;gap:5px;font-size:12px;color:var(--tx2)}
.mode-bbar .chk input{width:14px;height:14px;accent-color:var(--ac)}
.mode-bbar .sbtn{padding:6px 14px;border-radius:14px;font-size:12px;background:var(--bg3);border:1px solid var(--border);color:var(--tx2);cursor:pointer;transition:.2s}
.mode-bbar .sbtn:hover{border-color:var(--ac2);color:var(--ac2)}
.mode-bbar .action-btn{padding:10px 32px;border-radius:24px;font-size:16px;font-weight:700;letter-spacing:2px;border:none;color:#fff;cursor:pointer;transition:.3s}
.mode-bbar .action-btn:disabled{opacity:.35;cursor:not-allowed;transform:none!important;box-shadow:none!important}

/* ===== Status Pill ===== */
.status-pill{position:fixed;top:54px;right:12px;z-index:15;padding:4px 10px;border-radius:8px;background:var(--bg3);border:1px solid var(--border);font-size:11px;color:var(--tx2);cursor:pointer;transition:.2s;display:flex;align-items:center;gap:5px}
.status-dot{width:5px;height:5px;border-radius:50%;background:var(--elite)}

/* ===== Level Up Toast ===== */
.lvl-toast{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%) scale(0);z-index:60;padding:16px 32px;border-radius:16px;background:rgba(6,10,29,.95);border:2px solid var(--gold);box-shadow:0 0 40px rgba(255,215,0,.3);text-align:center;transition:transform .4s cubic-bezier(.34,1.56,.64,1);pointer-events:none}
.lvl-toast.show{transform:translate(-50%,-50%) scale(1)}
.lvl-toast h3{font-size:20px;color:var(--gold);margin-bottom:4px}
.lvl-toast p{font-size:13px;color:var(--tx2)}

/* ===== Confetti Canvas (shared) ===== */
#globalConfetti{position:fixed;inset:0;z-index:300;pointer-events:none}

/* ===== Rating (shared) ===== */
.rate-area{display:flex;flex-direction:column;align-items:center;gap:10px;opacity:0;transform:translateY(8px);transition:.4s}
.rate-area.show{opacity:1;transform:translateY(0)}
.rate-label{font-size:13px;color:var(--tx2)}
.rate-btns{display:flex;gap:10px}
.rbtn{padding:10px 20px;border-radius:20px;font-size:14px;font-weight:700;border:2px solid;cursor:pointer;transition:.25s;background:transparent;display:flex;align-items:center;gap:6px}
.rbtn:hover{transform:translateY(-2px)}.rbtn:active{transform:scale(.95)}
.rbtn-ex{border-color:var(--gold);color:var(--gold)}.rbtn-ex:hover{background:rgba(255,215,0,.1);box-shadow:0 4px 16px rgba(255,215,0,.2)}
.rbtn-good{border-color:var(--elite);color:var(--elite)}.rbtn-good:hover{background:rgba(46,204,113,.1);box-shadow:0 4px 16px rgba(46,204,113,.2)}
.rbtn-try{border-color:var(--rare);color:var(--rare)}.rbtn-try:hover{background:rgba(0,200,255,.1);box-shadow:0 4px 16px rgba(0,200,255,.2)}
.rate-result{font-size:14px;font-weight:600;opacity:0;transition:.3s;color:var(--tx)}
.rate-result.show{opacity:1}
.lvlup{color:var(--gold);animation:pulse .6s ease 2}
@keyframes pulse{0%,100%{transform:scale(1)}50%{transform:scale(1.15)}}
.cont-btn{padding:10px 28px;border-radius:22px;font-size:14px;font-weight:600;border:none;color:#fff;cursor:pointer;transition:.25s;box-shadow:0 3px 16px rgba(124,106,255,.3);opacity:0;transition:opacity .3s;background:linear-gradient(135deg,var(--ac),#8b6cf6)}
.cont-btn.show{opacity:1}.cont-btn:hover{transform:translateY(-2px)}

/* ===== Responsive ===== */
@media(max-width:768px){
  .home-grid{grid-template-columns:repeat(2,1fr);gap:10px}
  .mode-card{min-height:110px;padding:18px 8px}
  .mode-card .mc-icon{font-size:28px}
  .mode-card .mc-name{font-size:13px}
}
@media(max-width:400px){
  .home-grid{grid-template-columns:1fr 1fr;gap:8px}
}
</style>

<!-- ==================== MODE 1: 命运卡牌 CSS ==================== -->
<style id="css-fate">
/* ===== Fate Card Back ===== */
.cback{width:100%;height:100%;border-radius:10px;position:relative;overflow:hidden;background:linear-gradient(150deg,#120e3a 0%,#1e1560 40%,#120e3a 100%);border:2px solid rgba(124,106,255,.5);box-shadow:0 2px 16px rgba(124,106,255,.15),inset 0 0 30px rgba(124,106,255,.06)}
.cback::before{content:'';position:absolute;inset:5px;border-radius:6px;border:1px solid rgba(124,106,255,.2);background:radial-gradient(circle at 50% 50%,rgba(124,106,255,.08) 0%,transparent 60%),repeating-conic-gradient(rgba(124,106,255,.03) 0% 25%,transparent 0% 50%) 0 0/10px 10px}
.cback-sym{position:absolute;top:50%;left:50%;transform:translate(-50%,-50%);font-size:30px;color:rgba(124,106,255,.45);text-shadow:0 0 12px rgba(124,106,255,.3);z-index:2;pointer-events:none}
.cback-gem{position:absolute;width:10px;height:10px;z-index:2;pointer-events:none}
.cback-gem::before,.cback-gem::after{content:'';position:absolute;background:rgba(124,106,255,.35)}
.cback-gem::before{width:100%;height:2px;top:4px}.cback-gem::after{width:2px;height:100%;left:4px}
.cback-gem.tl{top:10px;left:10px}.cback-gem.tr{top:10px;right:10px}.cback-gem.bl{bottom:10px;left:10px}.cback-gem.br{bottom:10px;right:10px}
.cback-shim{position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(105deg,transparent 38%,rgba(255,255,255,.03) 44%,rgba(255,255,255,.07) 50%,rgba(255,255,255,.03) 56%,transparent 62%);background-size:250% 100%;animation:shim 5s infinite linear}
.cback,.cback *{pointer-events:none}
@keyframes shim{0%{background-position:250% 0}100%{background-position:-250% 0}}
.cback-glow{position:absolute;inset:-2px;border-radius:12px;z-index:-1;background:conic-gradient(from 0deg,rgba(124,106,255,.15),transparent,rgba(124,106,255,.15),transparent,rgba(124,106,255,.15),transparent);animation:glowSpin 8s linear infinite;filter:blur(4px);pointer-events:none}
@keyframes glowSpin{to{transform:rotate(360deg)}}
.cback.t-elite{border-color:rgba(46,204,113,.5);box-shadow:0 2px 16px rgba(46,204,113,.15),inset 0 0 30px rgba(46,204,113,.06)}
.cback.t-elite::before{border-color:rgba(46,204,113,.2)}
.cback.t-elite .cback-sym{color:rgba(46,204,113,.5);text-shadow:0 0 12px rgba(46,204,113,.3)}
.cback.t-rare{border-color:rgba(0,200,255,.5);box-shadow:0 2px 16px rgba(0,200,255,.2),inset 0 0 30px rgba(0,200,255,.06)}
.cback.t-rare::before{border-color:rgba(0,200,255,.25)}
.cback.t-rare .cback-sym{color:rgba(0,200,255,.5);text-shadow:0 0 14px rgba(0,200,255,.35)}
.cback.t-legend{border-color:rgba(255,107,53,.6);box-shadow:0 2px 20px rgba(255,107,53,.25),inset 0 0 30px rgba(255,107,53,.08)}
.cback.t-legend .cback-sym{color:rgba(255,107,53,.55);text-shadow:0 0 16px rgba(255,107,53,.4);font-size:34px}
.cback.t-epic{border-color:rgba(232,67,147,.6);box-shadow:0 2px 24px rgba(232,67,147,.25),inset 0 0 30px rgba(232,67,147,.08)}
.cback.t-epic .cback-sym{color:rgba(232,67,147,.6);text-shadow:0 0 18px rgba(232,67,147,.45);font-size:36px}

/* ===== Fate Card Front ===== */
.cfront{width:100%;height:100%;border-radius:10px;position:relative;overflow:hidden;background:linear-gradient(180deg,#161e52 0%,#0c1235 100%);display:flex;flex-direction:column;align-items:center;padding:8px 6px;backface-visibility:hidden}
.cfront.t-comm{border:2px solid var(--comm)}.cfront.t-elite{border:2px solid var(--elite);box-shadow:0 0 12px rgba(46,204,113,.25)}
.cfront.t-rare{border:2px solid var(--rare);box-shadow:0 0 16px rgba(0,200,255,.3)}
.cfront.t-legend{border:2px solid var(--legend);box-shadow:0 0 20px rgba(255,107,53,.35)}
.cfront.t-epic{border:2px solid var(--epic);box-shadow:0 0 24px rgba(232,67,147,.35)}
.cf-tag{position:absolute;top:5px;right:5px;font-size:8px;padding:1px 6px;border-radius:8px;font-weight:700}
.cf-tag.comm{background:rgba(107,114,128,.25);color:#9ca3af}.cf-tag.elite{background:rgba(46,204,113,.15);color:var(--elite)}
.cf-tag.rare{background:rgba(0,200,255,.15);color:var(--rare)}.cf-tag.legend{background:rgba(255,107,53,.15);color:var(--legend)}.cf-tag.epic{background:rgba(232,67,147,.15);color:var(--epic)}
.cf-ava{width:56px;height:56px;border-radius:50%;overflow:hidden;border:2px solid var(--ac2);margin-bottom:4px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.cf-ava img,.cf-ava div{width:100%;height:100%;display:block;object-fit:cover}
.cf-name{font-size:14px;font-weight:700;margin-bottom:2px;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;color:#fff}
.cf-stars{font-size:10px;letter-spacing:1px;margin-bottom:3px}.cf-stars .on{color:var(--gold)}.cf-stars .off{color:var(--border)}
.cf-attrs{width:100%;display:flex;flex-direction:column;gap:2px}
.cf-attr{display:flex;align-items:center;gap:3px;font-size:8px}
.cf-al{color:var(--tx2);min-width:22px}.cf-ab{flex:1;height:4px;background:rgba(0,0,0,.3);border-radius:2px;overflow:hidden}
.cf-af{height:100%;border-radius:2px;width:0;transition:width .6s ease .4s}
.cf-af.w{background:linear-gradient(90deg,#7c6aff,#b0a4ff)}.cf-af.c{background:linear-gradient(90deg,#ff6b35,#ff9f43)}.cf-af.r{background:linear-gradient(90deg,#00b894,#55efc4)}
.cf-av{color:var(--tx2);min-width:18px;text-align:right;font-size:8px}

/* ===== Fate: Card Wrapper ===== */
.card-w{width:var(--cw);height:var(--ch);position:relative;flex-shrink:0}

/* ===== Fate: Fan Layout ===== */
.fan{position:relative;width:100%;max-width:880px;height:260px;display:flex;align-items:flex-end;justify-content:center}
.fan .card-w{position:absolute;transform-origin:center bottom;transition:transform .5s cubic-bezier(.34,1.56,.64,1),filter .3s;cursor:default}
.fan .card-w:hover{filter:brightness(1.15) drop-shadow(0 0 12px rgba(124,106,255,.3))}

/* ===== Fate: Grid Layout ===== */
.grid-wrap{width:100%;max-width:900px;max-height:100%;overflow-y:auto;overflow-x:hidden;padding:8px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-content:flex-start}
.grid-wrap::-webkit-scrollbar{width:4px}.grid-wrap::-webkit-scrollbar-thumb{background:var(--border);border-radius:2px}
.grid-card{cursor:pointer;transition:transform .3s cubic-bezier(.34,1.56,.64,1),box-shadow .3s;position:relative}
.grid-card:hover{transform:translateY(-6px);z-index:2}
.grid-card.selected .cback{border-color:var(--gold)!important;box-shadow:0 0 24px rgba(255,215,0,.4)!important}
.grid-card.picked{opacity:.35;pointer-events:none;filter:grayscale(.5)}

/* ===== Fate: Shuffle FX ===== */
.shuf-area{position:relative;width:100%;max-width:700px;height:280px;display:flex;align-items:center;justify-content:center}

/* ===== Fate: Reveal Overlay ===== */

.shelf-area{position:relative;z-index:1;flex:1;overflow-y:auto;overflow-x:hidden;padding:20px 30px 40px;display:flex;flex-direction:column;align-items:center;gap:0}
.shelf-area::-webkit-scrollbar{width:6px}.shelf-area::-webkit-scrollbar-thumb{background:rgba(255,255,255,.1);border-radius:3px}
.shelf-row{width:100%;max-width:720px;position:relative;margin-bottom:0}
.box-row{display:flex;flex-wrap:wrap;justify-content:center;gap:8px;padding:12px 16px 4px;position:relative;z-index:2}
.shelf-board{width:104%;margin-left:-2%;height:18px;background:linear-gradient(180deg,#a68962,#8b6f4e);border-radius:3px;position:relative;z-index:3;box-shadow:0 4px 12px rgba(0,0,0,.4),0 2px 4px rgba(0,0,0,.3),inset 0 2px 4px rgba(255,255,255,.1)}
.shelf-board::after{content:'';position:absolute;bottom:-6px;left:2%;right:2%;height:6px;background:linear-gradient(180deg,rgba(0,0,0,.2),transparent);border-radius:0 0 4px 4px}
.blind-box{width:72px;height:72px;perspective:300px;cursor:default;position:relative;transition:transform .3s,filter .3s}
.blind-box.selectable{cursor:pointer}
.blind-box.selectable:hover{transform:translateY(-6px);filter:brightness(1.2)}
.blind-box.picked{opacity:.25;pointer-events:none}
.box-body{width:100%;height:100%;position:relative;transform-style:preserve-3d}
.box-front{position:absolute;inset:0;background:linear-gradient(135deg,#3a3a5c,#2a2a48);border-radius:6px;border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;overflow:hidden;backface-visibility:hidden}
.box-front .logo{font-size:22px;opacity:.6}
.box-front .q-mark{position:absolute;font-size:28px;font-weight:900;color:rgba(255,255,255,.12);top:50%;left:50%;transform:translate(-50%,-50%)}
.seal-strip{position:absolute;top:50%;left:-1px;right:-1px;height:10px;transform:translateY(-50%);display:flex;z-index:3;overflow:hidden}
.seal-left,.seal-right{flex:1;height:100%;background:#ffd700;display:flex;align-items:center;justify-content:center;transition:all 1.2s cubic-bezier(.25,.46,.45,.94)}
.seal-left{border-radius:2px 0 0 2px;border-right:1px dashed rgba(0,0,0,.2)}
.seal-right{border-radius:0 2px 2px 0;border-left:1px dashed rgba(0,0,0,.2)}
.seal-strip .seal-icon{font-size:7px;color:rgba(0,0,0,.3)}
.seal-torn .seal-left{transform:translateX(-30px) rotateZ(-20deg);opacity:0}
.seal-torn .seal-right{transform:translateX(30px) rotateZ(20deg);opacity:0}
.blind-box.highlight .box-front{box-shadow:0 0 20px rgba(255,107,157,.6),0 0 40px rgba(255,107,157,.3)}
.blind-box.highlight{transform:scale(1.1)}
@keyframes boxFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-2px)}}
.blind-box:not(.picked):not(.highlight){animation:boxFloat 3s ease-in-out infinite}
.blind-box:nth-child(2n){animation-delay:.5s}
.blind-box:nth-child(3n){animation-delay:1s}
.box-lid{position:absolute;top:-4px;left:-2px;right:-2px;height:16px;background:linear-gradient(135deg,#4a4a6c,#3a3a5c);border-radius:5px 5px 2px 2px;border:1px solid rgba(255,255,255,.1);z-index:2;transform-origin:top center;box-shadow:0 -2px 4px rgba(0,0,0,.2)}
.blindbox-mode-chip{padding:6px 16px;border-radius:16px;border:1px solid rgba(255,255,255,.12);background:transparent;color:rgba(255,255,255,.4);font-size:13px;cursor:pointer;transition:all .2s}
.blindbox-mode-chip.on{border-color:#ff6b9d;color:#ff6b9d;background:rgba(255,107,157,.1)}
.open-overlay{position:fixed;inset:0;z-index:190;display:flex;align-items:center;justify-content:center;pointer-events:none}
.open-box{position:relative;width:140px;height:140px;transition:all .5s}
.open-box .box-front{position:absolute;inset:0;background:linear-gradient(135deg,#3a3a5c,#2a2a48);border-radius:12px;border:1px solid rgba(255,255,255,.1);display:flex;align-items:center;justify-content:center;overflow:hidden}
.open-box .q-mark{font-size:54px;font-weight:900;color:rgba(255,255,255,.1)}
.open-box .box-lid{position:absolute;top:-8px;left:-4px;right:-4px;height:28px;background:linear-gradient(135deg,#4a4a6c,#3a3a5c);border-radius:8px 8px 3px 3px;border:1px solid rgba(255,255,255,.1);z-index:2;transform-origin:top center;box-shadow:0 -3px 6px rgba(0,0,0,.3)}
.open-box .seal-strip{position:absolute;top:50%;left:-2px;right:-2px;height:16px;transform:translateY(-50%);display:flex;z-index:3;overflow:hidden}
.open-box .seal-left,.open-box .seal-right{flex:1;height:100%;background:#ffd700;display:flex;align-items:center;justify-content:center}
.open-box .seal-left{border-radius:3px 0 0 3px;border-right:1px dashed rgba(0,0,0,.2)}
.open-box .seal-right{border-radius:0 3px 3px 0;border-left:1px dashed rgba(0,0,0,.2)}
.open-box .seal-icon{font-size:10px;color:rgba(0,0,0,.3)}
.lid-fly{position:fixed;z-index:191;pointer-events:none;transition:all 1.2s cubic-bezier(.25,.46,.45,.94)}
.light-burst{position:fixed;z-index:188;pointer-events:none;border-radius:50%;transform:translate(-50%,-50%)}
.scan-highlight{box-shadow:0 0 25px rgba(255,107,157,.8),0 0 50px rgba(255,107,157,.4)!important;transform:scale(1.08)!important}
.shelf-shake{animation:shelfShake .4s ease-in-out}
@keyframes shelfShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-3px)}50%{transform:translateX(3px)}75%{transform:translateX(-2px)}}
@keyframes boxShake{0%,100%{transform:translate(0,0) rotate(0)}10%{transform:translate(-3px,-1px) rotate(-1deg)}20%{transform:translate(3px,1px) rotate(1deg)}30%{transform:translate(-2px,2px) rotate(-.5deg)}40%{transform:translate(2px,-1px) rotate(.5deg)}50%{transform:translate(-3px,1px) rotate(-1deg)}60%{transform:translate(3px,-1px) rotate(1deg)}70%{transform:translate(-1px,2px) rotate(-.5deg)}80%{transform:translate(1px,-2px) rotate(.5deg)}90%{transform:translate(-2px,1px) rotate(0)}}
.open-box.shaking{animation:boxShake .6s ease-in-out}
@keyframes glowCharge{0%{box-shadow:0 0 5px rgba(255,215,0,.2)}50%{box-shadow:0 0 30px rgba(255,215,0,.6),0 0 60px rgba(255,107,157,.3)}100%{box-shadow:0 0 50px rgba(255,215,0,.8),0 0 100px rgba(255,107,157,.5),0 0 150px rgba(196,77,255,.3)}}
.open-box.charging .box-front{animation:glowCharge 1.2s ease-in-out forwards}
</style>
</head>

<script>
/* ================================================================
   创意课堂随机点名器 · 整合版
   五种模式：命运卡牌 | 深海寻宝 | 魔法转盘 | 扭蛋机 | 盲盒开箱
   共享数据层 cp_v4
   ================================================================ */

/* ===== Shared Data Layer ===== */
const SK='cp_v4';
let D=ld(),cid=D.cid||null,actx=null;

function ld(){
  try{
    ['cp_v3','cp_data_v2'].forEach(old=>{
      const v=localStorage.getItem(old);
      if(v){try{const d=JSON.parse(v);if(d&&d.classes&&d.classes.length){localStorage.setItem(SK,v);localStorage.removeItem(old)}}catch(e){localStorage.removeItem(old)}}
    });
    const r=localStorage.getItem(SK);if(r)return JSON.parse(r);
  }catch(e){}
  return{classes:[],cid:null};
}
function sv(){D.cid=cid;try{localStorage.setItem(SK,JSON.stringify(D))}catch(e){}}
function cc(){return D.classes.find(c=>c.id===cid)||null}

/* ===== Shared Demo ===== */
function ensureDemo(){
  if(D.classes.length)return;
  const ss=['陈思远','林雨萱','张浩然','王子涵','刘梓轩','赵心怡','黄梦琪','周天翔','吴语彤','郑雅琪','孙浩宇','杨诗涵','朱子墨','何思琪','马骏逸','胡雨桐','郭乐瑶','高文博','罗语嫣','梁晨曦','谢子豪','韩紫萱','唐瑞霖','冯诗雅','董子瑜','彭若曦','曹一鸣','邓雨泽','许嘉欣','叶明轩'];
  const preRated={'陈思远':{ex:1,good:1,try:0,picks:3},'林雨萱':{ex:2,good:0,try:0,picks:4},'张浩然':{ex:0,good:1,try:1,picks:2},'王子涵':{ex:3,good:0,try:0,picks:5},'刘梓轩':{ex:0,good:0,try:0,picks:1}};
  D.classes.push({id:'demo1',name:'七(1)班',students:ss,ratings:preRated});
  cid='demo1';sv();
}

/* ===== Shared Level System ===== */
function getLevel(xp){
  if(xp>=15)return{tier:'epic',name:'史诗',color:'#e84393'};
  if(xp>=8)return{tier:'legend',name:'传说',color:'#ff6b35'};
  if(xp>=4)return{tier:'rare',name:'稀有',color:'#00c8ff'};
  if(xp>=2)return{tier:'elite',name:'精锐',color:'#2ecc71'};
  return{tier:'comm',name:'普通',color:'#6b7280'};
}
function getStudentStats(name,cls){
  const r=(cls.ratings&&cls.ratings[name])||{ex:0,good:0,try:0,picks:0};
  const xp=r.ex*3+r.good*1;const lv=getLevel(xp);
  const wis=Math.min(100,20+r.ex*15+r.good*5);
  const cou=Math.min(100,20+r.picks*8);
  const cre=Math.min(100,20+r.ex*10+r.good*3+r.try*4);
  const total=wis+cou+cre;
  const stars=total>240?5:total>190?4:total>140?3:total>90?2:1;
  return{wis,cou,cre,stars,xp,lv,...r};
}
function starsH(n){return Array.from({length:5},(_,i)=>`<span class="${i<n?'on':'off'}">★</span>`).join('')}

/* ===== Shared Avatar (纯 HTML/CSS，不依赖 SVG data URI) ===== */
function avaSVG(nm,sz){
  let h=0;for(let i=0;i<nm.length;i++){h=((h<<5)-h)+nm.charCodeAt(i);h|=0}
  const a=Math.abs(h);let ini;
  if(/[\u4e00-\u9fff]/.test(nm)){ini=nm.length>=2?nm.slice(-2):nm}
  else{ini=nm.slice(0,2).toUpperCase()}
  const fs=Math.round(sz*.28);
  return`<div style="width:100%;height:100%;border-radius:50%;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,hsl(${a%360},50%,40%),hsl(${(a>>8)%360},50%,52%));font-size:${fs}px;font-weight:700;color:#fff;line-height:1">${ini}</div>`;
}

/* ===== Shared Audio ===== */
function initA(){if(!actx)actx=new(window.AudioContext||window.webkitAudioContext)();if(actx.state==='suspended')actx.resume()}
function tn(f,d,t,v){if(!actx)return;const o=actx.createOscillator(),g=actx.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=v||.08;g.gain.exponentialRampToValueAtTime(.001,actx.currentTime+d);o.connect(g);g.connect(actx.destination);o.start();o.stop(actx.currentTime+d)}

/* ===== Shared Confetti ===== */
function spawnConfetti(cvEl){
  const cv=cvEl||document.getElementById('globalConfetti');
  cv.width=innerWidth;cv.height=innerHeight;
  const cx=cv.getContext('2d'),ps=[];
  const cols=['#ffd700','#ff6b35','#7c6aff','#00c8ff','#ff6b6b','#55efc4','#e84393'];
  for(let i=0;i<100;i++)ps.push({x:cv.width/2,y:cv.height/2,vx:(Math.random()-.5)*14,vy:(Math.random()-.5)*14-3,sz:Math.random()*8+3,c:cols[i%cols.length],life:1,dec:.008+Math.random()*.012,rot:Math.random()*360,rv:(Math.random()-.5)*10});
  function go(){
    ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.18;p.life-=p.dec;p.rot+=p.rv;p.vx*=.99});
    cx.clearRect(0,0,cv.width,cv.height);
    ps.forEach(p=>{if(p.life<=0)return;cx.save();cx.globalAlpha=p.life;cx.translate(p.x,p.y);cx.rotate(p.rot*Math.PI/180);cx.fillStyle=p.c;cx.fillRect(-p.sz/2,-p.sz*.3,p.sz,p.sz*.6);cx.restore()});
    if(ps.some(p=>p.life>0))requestAnimationFrame(go);else cx.clearRect(0,0,cv.width,cv.height);
  }
  go();
}

/* ===== Navigation ===== */
let currentPage='home';
function showPage(id){

}
function goMode(mode){
  ensureDemo();if(!cid&&D.classes.length){cid=D.classes[0].id;sv()}
  initMode(mode);showPage(mode);
}

/* ===== Class Management Modal ===== */
function openClassModal(){renderClassList();document.getElementById('classModal').classList.add('active')}
function closeClassModal(){document.getElementById('classModal').classList.remove('active')}
function renderClassList(){
  const el=document.getElementById('classListEl');
  if(!D.classes.length){el.innerHTML='<div style="text-align:center;padding:14px;color:var(--tx2);font-size:12px">暂无班级，请添加</div>';return}
  el.innerHTML=D.classes.map(c=>`
    <div class="class-item ${c.id===cid?'on':''}" onclick="swCls('${c.id}')">
      <div><span class="ci-name">${c.name}</span><span class="ci-count">${c.students.length}人</span></div>
      <div class="ci-actions">
        <button onclick="event.stopPropagation();expCls('${c.id}')">导出</button>
        <button class="del-btn" onclick="event.stopPropagation();delCls('${c.id}')">删除</button>
      </div>
    </div>`).join('');
}
function swCls(id){cid=id;drawn={};sv();renderHomeClassBar();renderClassList();closeClassModal()}
function addClass(){
  const nm=document.getElementById('newClassName').value.trim();
  const raw=document.getElementById('newClassStudents').value.trim();
  const file=document.getElementById('importFile').files[0];
  if(file){
    const r=new FileReader();
    r.onload=e=>{try{const j=JSON.parse(e.target.result);const ss=j.students||j;const arr=Array.isArray(ss)?ss:[];
      if(!arr.length){alert('无有效名单');return}
      const cls={id:'c'+Date.now(),name:j.name||nm||'导入班级',students:arr.map(s=>typeof s==='string'?s.trim():(s.name||'')).filter(Boolean),ratings:{}};
      D.classes.push(cls);cid=cls.id;drawn={};sv();
      document.getElementById('newClassName').value='';document.getElementById('newClassStudents').value='';document.getElementById('importFile').value='';
      renderHomeClassBar();renderClassList();
    }catch(err){alert('JSON解析失败')}};r.readAsText(file);return;
  }
  if(!nm){alert('请输入班级名称');return}if(!raw){alert('请输入学生名单');return}
  const ss=raw.split(/[\n,，;；]+/).map(s=>s.trim()).filter(Boolean);
  if(!ss.length){alert('请输入至少一个学生');return}
  const cls={id:'c'+Date.now(),name:nm,students:ss,ratings:{}};
  D.classes.push(cls);cid=cls.id;drawn={};sv();
  document.getElementById('newClassName').value='';document.getElementById('newClassStudents').value='';
  renderHomeClassBar();renderClassList();
}
function delCls(id){if(!confirm('确定删除？'))return;D.classes=D.classes.filter(c=>c.id!==id);if(cid===id){cid=D.classes.length?D.classes[0].id:null;drawn={}}sv();renderHomeClassBar();renderClassList()}
function expCls(id){
  const c=D.classes.find(x=>x.id===id);if(!c)return;
  const b=new Blob([JSON.stringify(c,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(b);const a=document.createElement('a');a.href=u;a.download=c.name+'.json';a.click();URL.revokeObjectURL(u);
}

/* ===== Home Class Bar ===== */
function renderHomeClassBar(){
  const el=document.getElementById('homeClassBar');
  el.innerHTML=D.classes.map(c=>`<button class="home-chip ${c.id===cid?'on':''}" onclick="cid='${c.id}';drawn={};sv();renderHomeClassBar()">${c.name}</button>`).join('');

/* ===== Per-mode drawn tracking ===== */
let drawn={}; // {modeKey: [names]}

function getDrawn(key){return drawn[key]||[]}
function addDrawn(key,name){if(!drawn[key])drawn[key]=[];drawn[key].push(name);addSessionLog(key,name)}
let sessionLog=[];
const modeIcons={fate:'✦',ocean:'🌊',wheel:'🌀',gacha:'🥚',blindbox:'🎁'};
const modeNames={fate:'命运卡牌',ocean:'深海寻宝',wheel:'魔法转盘',gacha:'扭蛋机',blindbox:'盲盒开箱'};
function addSessionLog(mode,name){
  const c=cc();const st=c?getStudentStats(name,c):{lv:{name:'学徒',tier:'comm'},stars:0};
  const now=new Date();const ts=now.getHours().toString().padStart(2,'0')+':'+now.getMinutes().toString().padStart(2,'0');
  sessionLog.push({mode,name,time:ts,tier:st.lv.tier,lvName:st.lv.name,rating:null,rewarded:false});
  renderSession();
}
function rateSessionItem(idx,type){
  if(idx<0||idx>=sessionLog.length)return;
  const entry=sessionLog[idx];if(entry.rating)return;entry.rating=type;
  const c=cc();if(!c)return;const nm=entry.name;
  if(!c.ratings)c.ratings={};if(!c.ratings[nm])c.ratings[nm]={ex:0,good:0,try:0,picks:0};
  if(type==='ex')c.ratings[nm].ex++;else if(type==='good')c.ratings[nm].good++;else c.ratings[nm].try++;
  sv();renderSession();
}
function rewardSessionItem(idx){
  if(idx<0||idx>=sessionLog.length)return;
  const entry=sessionLog[idx];if(entry.rewarded)return;entry.rewarded=true;
  const c=cc();if(!c)return;const nm=entry.name;
  if(!c.ratings)c.ratings={};if(!c.ratings[nm])c.ratings[nm]={ex:0,good:0,try:0,picks:0};
  c.ratings[nm].ex+=2;sv();
  initA();tn(880,.2,'sine',.08);setTimeout(()=>tn(1100,.2,'sine',.07),100);setTimeout(()=>tn(1320,.2,'sine',.06),200);
  renderSession();
}
function clearSession(){sessionLog=[];renderSession()}
function syncSessionRating(mode,name,rating){
  for(let i=sessionLog.length-1;i>=0;i--){
    if(sessionLog[i].mode===mode&&sessionLog[i].name===name&&!sessionLog[i].rating){
      sessionLog[i].rating=rating;renderSession();return;
    }
  }
}
function renderSession(){
  const body=document.getElementById('hsBody');
  if(!sessionLog.length){body.innerHTML='<div class="hs-empty">暂无点名记录</div>';return}
  let h='';const tierColors={comm:'hsl(200,15%,45%)',elite:'hsl(140,55%,45%)',rare:'hsl(200,70%,55%)',legend:'hsl(25,90%,55%)',epic:'hsl(320,70%,55%)'};
  for(let i=sessionLog.length-1;i>=0;i--){
    const e=sessionLog[i];
    let h2=0;for(let j=0;j<e.name.length;j++){h2=((h2<<5)-h2)+e.name.charCodeAt(j);h2|=0}
    const hue=Math.abs(h2)%360;
    const ini=/[\u4e00-\u9fff]/.test(e.name)?e.name.slice(-2):e.name.slice(0,2);

function initOcean(){
  const cvs=document.getElementById('oceanC');const ctx=cvs.getContext('2d');let W,H,particles=[],rays=[];
  function rsz(){W=cvs.width=innerWidth;H=cvs.height=innerHeight}
  function mkB(y){return{x:Math.random()*W,y:y||H+Math.random()*50,r:Math.random()*6+2,speed:Math.random()*1.5+.5,wobble:Math.random()*Math.PI*2,wobbleSpeed:Math.random()*.02+.01,op:Math.random()*.4+.1}}
  rsz();for(let i=0;i<50;i++)particles.push(mkB(Math.random()*H));for(let i=0;i<6;i++)rays.push({x:Math.random()*W,w:Math.random()*80+40,op:Math.random()*.04+.01,speed:Math.random()*.3+.1,angle:Math.random()*.1-.05});
  function draw(){if(currentPage!=='ocean')return;const grad=ctx.createLinearGradient(0,0,0,H);grad.addColorStop(0,'#041428');grad.addColorStop(0.3,'#031a35');grad.addColorStop(1,'#010a18');ctx.fillStyle=grad;ctx.fillRect(0,0,W,H);
    rays.forEach(r=>{r.angle+=.0005;r.x+=r.speed*.3;if(r.x>W+100)r.x=-100;ctx.save();ctx.translate(r.x,0);ctx.rotate(r.angle);const rg=ctx.createLinearGradient(0,0,0,H*.7);rg.addColorStop(0,`rgba(0,180,255,${r.op})`);rg.addColorStop(1,'transparent');ctx.fillStyle=rg;ctx.fillRect(-r.w/2,0,r.w,H*.7);ctx.restore()});
    particles.forEach(p=>{p.wobble+=p.wobbleSpeed;p.x+=Math.sin(p.wobble)*.5;p.y-=p.speed;if(p.y<-20){p.y=H+20;p.x=Math.random()*W}ctx.beginPath();ctx.arc(p.x,p.y,p.r,0,Math.PI*2);ctx.fillStyle=`rgba(150,220,255,${p.op})`;ctx.fill()});
    oceanRAF=requestAnimationFrame(draw)}
  addEventListener('resize',()=>{rsz()});draw();
}

function togGachaHist(){document.getElementById('gachaHpan').classList.toggle('open');gachaRenderHist()}
function gachaRenderHist(){const c=cc();const el=document.getElementById('gachaHls');if(!c){el.innerHTML='<div style="padding:10px;color:var(--tx2);font-size:11px">暂无班级</div>';return}const dr=getDrawn('gacha');let h='';c.students.forEach(nm=>{const pk=dr.includes(nm);const st=getStudentStats(nm,c);h+=`<div class="hi ${pk?'pk':'pd'}"><span class="hi-d"></span>${nm}${pk?' ✓':''}${st.lv.tier!=='comm'?' ['+st.lv.name+']':''}</div>`});el.innerHTML=h}

/* ================================================================
   MODE 5: 盲盒开箱
   ================================================================ */
let blindboxBusy=false,blindboxRated=false,blindboxRevealedName='',blindboxMode='random';
const BOX_ICONS=['❓','✨','🌟','💫','⭐','🔮','💎','🎯'];

function initBlindbox(){}
function blindboxRenderCbar(){const el=document.getElementById('blindboxCbar');el.innerHTML=D.classes.map(c=>`<button class="chip ${c.id===cid?'on':''}" onclick="blindboxSwCls('${c.id}')">${c.name}</button>`).join('')}
function blindboxSwCls(id){cid=id;resetDrawn('blindbox');sv();blindboxRenderCbar();blindboxBuildShelves();blindboxUpdateCounter()}
function blindboxUpdateCounter(){const c=cc();if(!c)return;const dr=getDrawn('blindbox')}
function blindboxBuildShelves(){
  const c=cc();if(!c)return;const area=document.getElementById('shelfArea');area.innerHTML='';const students=c.students;const dr=getDrawn('blindbox');const perRow=8;
  for(let r=0;r<students.length;r+=perRow){const rowStudents=students.slice(r,r+perRow);const rowDiv=document.createElement('div');rowDiv.className='shelf-row';const boxRow=document.createElement('div');boxRow.className='box-row';
    rowStudents.forEach((name,ci)=>{const idx=r+ci;const box=document.createElement('div');box.className='blind-box'+(dr.includes(name)?' picked':'')+(blindboxMode==='select'&&!dr.includes(name)?' selectable':'');box.dataset.name=name;box.dataset.idx=idx;const icon=BOX_ICONS[idx%BOX_ICONS.length];
      box.innerHTML=`<div class="box-body"><div class="box-front"><span class="q-mark">?</span><span class="logo">${icon}</span></div><div class="seal-strip"><div class="seal-left"><span class="seal-icon">✦</span></div><div class="seal-right"><span class="seal-icon">✦</span></div></div><div class="box-lid"></div></div>`;
      if(blindboxMode==='select'&&!dr.includes(name))box.onclick=()=>blindboxSelectBox(idx);boxRow.appendChild(box)});
    const board=document.createElement('div');board.className='shelf-board';rowDiv.appendChild(boxRow);rowDiv.appendChild(board);area.appendChild(rowDiv)}
}
function blindboxSetMode(m){blindboxMode=m;document.querySelectorAll('#page-blindbox .blindbox-mode-chip').forEach(el=>{const isOn=el.dataset.mode===m;el.classList.toggle('on',isOn);el.style.borderColor=isOn?'#ff6b9d':'';el.style.color=isOn?'#ff6b9d':''});
  const btn=document.getElementById('blindboxDrawBtn');if(m==='select')btn.style.display='none';else btn.style.display='';blindboxBuildShelves()}
function blindboxDraw(){
  if(blindboxBusy||blindboxMode!=='random')return;const c=cc();if(!c)return;const dr=getDrawn('blindbox');const nr=document.getElementById('blindboxNoRep').checked;const avail=nr?c.students.filter(s=>!dr.includes(s)):[...c.students];if(!avail.length){blindboxResetDr();return}
  blindboxBusy=true;initA();const btn=document.getElementById('blindboxDrawBtn');if(btn)btn.disabled=true;
  const picked=avail[Math.floor(Math.random()*avail.length)];const targetIdx=c.students.indexOf(picked);
  document.getElementById('shelfArea').classList.add('shelf-shake');setTimeout(()=>document.getElementById('shelfArea').classList.remove('shelf-shake'),400);
  const allBoxes=Array.from(document.querySelectorAll('#shelfArea .blind-box:not(.picked)'));const scanLen=Math.min(14,Math.max(10,allBoxes.length));const scanPath=[];for(let i=0;i<scanLen-1;i++)scanPath.push(Math.floor(Math.random()*allBoxes.length));
  const targetBox=document.querySelector(`#shelfArea .blind-box[data-idx="${targetIdx}"]`);const targetInAll=allBoxes.indexOf(targetBox);scanPath.push(targetInAll>=0?targetInAll:0);
  setTimeout(()=>{scanPath.forEach((bi,i)=>{const delay=60+i*100+Math.pow(i,1.2)*15;setTimeout(()=>{allBoxes.forEach(b=>b.classList.remove('scan-highlight'));if(allBoxes[bi])allBoxes[bi].classList.add('scan-highlight');tn(500+i*30,.04,'sine',.03)},delay)});
    const totalDelay=60+(scanLen-1)*100+Math.pow(scanLen-1,1.2)*15+200;
    setTimeout(()=>{allBoxes.forEach(b=>b.classList.remove('scan-highlight'));if(targetBox){targetBox.classList.add('scan-highlight');targetBox.style.transform='scale(1.15)'}tn(800,.3,'sine',.08)},totalDelay);
    setTimeout(()=>blindboxPerformOpen(targetBox,picked,targetIdx),totalDelay+600)},500)
}
function blindboxSelectBox(idx){if(blindboxBusy)return;const c=cc();if(!c)return;const name=c.students[idx];const dr=getDrawn('blindbox');if(dr.includes(name))return;blindboxBusy=true;initA();const box=document.querySelector(`#shelfArea .blind-box[data-idx="${idx}"]`);if(!box){blindboxBusy=false;return}box.classList.add('scan-highlight');tn(600,.15,'sine',.06);setTimeout(()=>{box.classList.remove('scan-highlight');blindboxPerformOpen(box,name,idx)},400)}
function blindboxPerformOpen(boxEl,name,idx){
  const c=cc();let boxRect={left:0,top:0,width:72,height:72};if(boxEl)boxRect=boxEl.getBoundingClientRect();const cx=innerWidth/2;const cy=innerHeight/2;
  const openBox=document.createElement('div');openBox.className='open-box';openBox.innerHTML=`<div class="box-front"><span class="q-mark">?</span><span class="logo">${BOX_ICONS[idx%BOX_ICONS.length]}</span></div><div class="seal-strip"><div class="seal-left"><span class="seal-icon">✦</span></div><div class="seal-right"><span class="seal-icon">✦</span></div></div><div class="box-lid"></div>`;
  openBox.style.cssText=`position:fixed;left:${boxRect.left+boxRect.width/2-70}px;top:${boxRect.top+boxRect.height/2-70}px;z-index:190;transition:all .5s cubic-bezier(.34,1.56,.64,1);pointer-events:none`;
  if(boxEl)boxEl.style.opacity='0';document.body.appendChild(openBox);
  setTimeout(()=>{openBox.style.left=(cx-70)+'px';openBox.style.top=(cy-70)+'px'},50);
  setTimeout(()=>{openBox.classList.add('shaking');for(let i=0;i<6;i++)setTimeout(()=>tn(150+Math.random()*200,.06,'square',.05),i*80);setTimeout(()=>{openBox.classList.remove('shaking');openBox.classList.add('charging');tn(200,.6,'sine',.06);setTimeout(()=>tn(300,.5,'sine',.05),200);setTimeout(()=>tn(450,.5,'sine',.06),400);setTimeout(()=>tn(600,.6,'sine',.07),600)},600)},600);
  setTimeout(()=>{tn(150,.3,'sawtooth',.1);setTimeout(()=>tn(300,.2,'sawtooth',.08),100);setTimeout(()=>tn(500,.15,'sawtooth',.06),200);openBox.querySelector('.seal-strip').classList.add('seal-torn')},1800);
  setTimeout(()=>{openBox.classList.remove('charging');const lid=openBox.querySelector('.box-lid');lid.style.transform='rotateX(-160deg) translateY(-10px)';lid.style.transition='transform 1.5s cubic-bezier(.25,.46,.45,.94)';tn(200,.4,'sine',.12);setTimeout(()=>tn(400,.3,'sine',.1),150);setTimeout(()=>tn(600,.3,'sine',.08),300);setTimeout(()=>tn(900,.4,'sine',.1),450);
    setTimeout(()=>{const lidRect=lid.getBoundingClientRect();const lidFly=document.createElement('div');lidFly.className='lid-fly';lidFly.innerHTML=lid.outerHTML;lidFly.style.left=lidRect.left+'px';lidFly.style.top=lidRect.top+'px';lidFly.style.width=lidRect.width+'px';lidFly.style.height=lidRect.height+'px';lid.style.visibility='hidden';document.body.appendChild(lidFly);setTimeout(()=>{lidFly.style.transform='translateY(-200px) rotateX(720deg) rotateZ(30deg)';lidFly.style.opacity='0'},30);setTimeout(()=>lidFly.remove(),1500)},800)},3000);
  setTimeout(()=>{const colors=['rgba(255,107,157,.4)','rgba(196,77,255,.4)','rgba(255,215,0,.4)','rgba(0,212,255,.4)'];const col=colors[idx%colors.length];const burst=document.createElement('div');burst.className='light-burst';burst.style.left=cx+'px';burst.style.top=cy+'px';burst.style.width='0';burst.style.height='0';burst.style.background=`radial-gradient(circle,${col},transparent 60%)`;document.body.appendChild(burst);setTimeout(()=>{burst.style.transition='all .6s ease-out';burst.style.width='600px';burst.style.height='600px';burst.style.opacity='0'},20);setTimeout(()=>burst.remove(),800);
    const flash=document.createElement('div');flash.style.cssText='position:fixed;inset:0;background:rgba(255,255,255,.2);z-index:188;pointer-events:none;transition:opacity .4s';document.body.appendChild(flash);setTimeout(()=>{flash.style.opacity='0'},50);setTimeout(()=>flash.remove(),500);
    tn(880,.25,'sine',.1);setTimeout(()=>tn(1100,.2,'sine',.08),120);setTimeout(()=>tn(1320,.3,'sine',.1),240);setTimeout(()=>{openBox.style.opacity='0';openBox.style.transition='opacity .3s'},200);setTimeout(()=>openBox.remove(),800)},4500);
  setTimeout(()=>{addDrawn('blindbox',name);if(!c.ratings)c.ratings={};if(!c.ratings[name])c.ratings[name]={ex:0,good:0,try:0,picks:0};c.ratings[name].picks++;sv();blindboxShowReveal(name)},5500)
}
function blindboxShowReveal(name){blindboxRevealedName=name;blindboxRated=false;const c=cc();const info=c.ratings&&c.ratings[name]?c.ratings[name]:null;let hash=0;for(let i=0;i<name.length;i++)hash=((hash<<5)-hash)+name.charCodeAt(i);const hue=Math.abs(hash)%360;
  document.getElementById('blindboxAvatarW').innerHTML=`<div style="width:80px;height:80px;border-radius:50%;background:linear-gradient(135deg,hsl(${hue},70%,45%),hsl(${hue},70%,60%));display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;color:#fff;border:3px solid var(--ac2);box-shadow:0 0 16px rgba(124,106,255,.3)">${name.length>=2?name.slice(-2):name[0]}</div>`;
  document.getElementById('blindboxRevName').textContent=name;
  if(info){const xp=info.ex*3+info.good*1;const lv=getLevel(xp);document.getElementById('blindboxRevLv').textContent=lv.name+' Lv.'+(xp>=15?5:xp>=8?4:xp>=4?3:xp>=2?2:xp>=1?1:0);document.getElementById('blindboxRevXp').textContent='XP: '+xp}else{document.getElementById('blindboxRevLv').textContent='普通 Lv.0';document.getElementById('blindboxRevXp').textContent='XP: 0'}
  document.getElementById('blindboxRateRes').textContent='';document.getElementById('blindboxRateRow').classList.remove('show');document.getElementById('blindboxContBtn').classList.remove('show');
  document.getElementById('blindboxRevealOv').classList.add('active');setTimeout(()=>{document.getElementById('blindboxRevealCard').classList.add('show');document.getElementById('blindboxRateRow').classList.add('show');tn(660,.15,'sine',.08);setTimeout(()=>tn(880,.15,'sine',.07),80)},200);
  setTimeout(()=>{spawnConfetti();[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tn(f,.3,'sine',.09),i*80))},500)
}
function blindboxRate(type){if(blindboxRated)return;blindboxRated=true;const c=cc();if(!c)return;const nm=blindboxRevealedName;if(!c.ratings)c.ratings={};if(!c.ratings[nm])c.ratings[nm]={ex:0,good:0,try:0,picks:0};const oldXP=c.ratings[nm].ex*3+c.ratings[nm].good*1;const oldLv=getLevel(oldXP);if(type==='ex')c.ratings[nm].ex++;else if(type==='good')c.ratings[nm].good++;else c.ratings[nm].try++;const newXP=c.ratings[nm].ex*3+c.ratings[nm].good*1;const newLv=getLevel(newXP);sv();const rr=document.getElementById('blindboxRateRes');let msg=`+${type==='ex'?3:type==='good'?1:0} XP`;if(newLv.tier!==oldLv.tier){msg+=` · 升级为 ${newLv.name}！`;document.getElementById('blindboxLvlupName').textContent=newLv.name;document.getElementById('blindboxLvlupOv').classList.add('active');spawnConfetti();[523,659,784,1047].forEach((f,i)=>setTimeout(()=>tn(f,.3,'sine',.09),i*80))}rr.textContent=msg;if(type==='ex'){tn(880,.15,'sine',.06);setTimeout(()=>tn(1100,.15,'sine',.05),100)}else if(type==='good')tn(660,.15,'sine',.06);else tn(330,.2,'sawtooth',.04);document.getElementById('blindboxContBtn').classList.add('show');blindboxRenderHist();syncSessionRating('blindbox',nm,type)}
function blindboxContinue(){document.getElementById('blindboxRevealOv').classList.remove('active');document.getElementById('blindboxRevealCard').classList.remove('show');blindboxBusy=false;blindboxRated=false;const btn=document.getElementById('blindboxDrawBtn');if(btn)btn.disabled=false;blindboxBuildShelves()}
function blindboxResetDr(){resetDrawn('blindbox');blindboxBusy=false;blindboxRated=false;const btn=document.getElementById('blindboxDrawBtn');if(btn)btn.disabled=false;blindboxBuildShelves()}
function togBlindboxHist(){document.getElementById('blindboxHpan').classList.toggle('open');blindboxRenderHist()}
function blindboxRenderHist(){const c=cc();const el=document.getElementById('blindboxHls');if(!c){el.innerHTML='<div style="padding:10px;color:var(--tx2);font-size:11px">暂无班级</div>';return}const dr=getDrawn('blindbox');let h='';c.students.forEach(nm=>{const pk=dr.includes(nm);const st=getStudentStats(nm,c);h+=`<div class="hi ${pk?'pk':'pd'}"><span class="hi-d"></span>${nm}${pk?' ✓':''}${st.lv.tier!=='comm'?' ['+st.lv.name+']':''}</div>`});el.innerHTML=h}

/* ===== Init ===== */
ensureDemo();if(!cid&&D.classes.length){cid=D.classes[0].id;sv()}
renderHomeClassBar();initHomeBG();renderSession();
document.addEventListener('keydown',e=>{if(e.code==='Space'&&!fateBusy&&currentPage==='fate'&&fateMode===1&&document.activeElement.tagName!=='INPUT'&&document.activeElement.tagName!=='TEXTAREA'){e.preventDefault();fateDoAction()}if(e.code==='Space'&&!wheelBusy&&!wheelSpinning&&currentPage==='wheel'){e.preventDefault();wheelSpin()}});
addEventListener('resize',()=>{if(currentPage==='wheel'&&modeInited['wheel'])wheelResizeWheel();if(currentPage==='ocean'){const cvs=document.getElementById('oceanC');if(cvs){cvs.width=innerWidth;cvs.height=innerHeight}}});
</script>
