@keyframes fadeIn{from{ opacity: 0; transform: translateY(8px); }to{ opacity: 1; transform: translateY(0); }}

.lab-wrap{
  display: flex;
  width: 100%;

  overflow: hidden;
}

  color: #ffe6ab;

  background: rgba(95,182,224,0.18);

  color: #7fcfee;

.mol-tab.reaction.active{
  background: rgba(201,162,75,0.20);

}

<div id="lab-root"></div>
<script type="module">
import { MoleculeLab as SentenceLab } from './sentence-lab.js';
const root = document.getElementById('lab-root');
const lab = new SentenceLab(root);
lab.onExit = () => {
  if (window.parent !== window) window.parent.postMessage({ type: 'lab-exit' }, '*');
  else history.back();
};
lab.start();
