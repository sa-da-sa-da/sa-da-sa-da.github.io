<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拼音描红纸生成器 · 四线三格声母韵母 A4 打印 | 当以读书通世事</title>
<link rel="canonical" href="https://www.sakaay.com/lab/AI/miaohong.html">
<meta name="description" content="拼音描红纸生成器：标准四线三格，一键生成声母表、韵母表、整体认读音节描红纸，支持汉字自动注音、首音节示范与纯描红模式，A4 直接打印。支持分类生成与字格大小、每行字数调节，适合小学拼音启蒙、单元复习、课后练习与家庭辅导。">
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro/dist/index.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#20293a;--muted:#6d7788;--line:#e3e7ee;
  --brand:#3b5bdb;--brand-l:#eef1fd;--bg:#f4f6fb;--card:#fff;
}
body{font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.app{display:flex;gap:18px;padding:18px;max-width:1360px;margin:0 auto;align-items:flex-start}
/* ===== 控制面板 ===== */
.panel{width:326px;flex:0 0 326px;background:var(--card);border-radius:14px;padding:18px;box-shadow:0 4px 20px rgba(30,45,80,.07);position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto}
.panel h2{font-size:16px;font-weight:700;margin-bottom:4px}
.panel .sub{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.6}
.field{margin-bottom:15px}
.field label{display:block;font-size:13px;font-weight:600;color:#3b465c;margin-bottom:7px}
textarea{width:100%;min-height:92px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;line-height:1.7;font-family:inherit;outline:none;color:var(--ink);background:#fbfcfe;transition:border-color .2s}
textarea:focus{border-color:var(--brand)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:62px;padding:8px 6px;border:1px solid var(--line);background:#fbfcfe;border-radius:9px;font-size:13px;color:#5c6880;cursor:pointer;transition:all .18s;font-family:inherit}
.seg button:hover{border-color:#c3cef0}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.chip{display:flex;gap:6px;flex-wrap:wrap}
.chip button{padding:7px 11px;border:1px solid #d6ddf6;background:var(--brand-l);border-radius:8px;font-size:12.5px;color:#3b5bdb;cursor:pointer;font-family:inherit;transition:all .18s}
.chip button:hover{background:#e2e8fb}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:#3b465c;cursor:pointer;padding:5px 0}
.check input{width:16px;height:16px;accent-color:var(--brand);cursor:pointer}
input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:14px;font-family:inherit;outline:none;color:var(--ink);background:#fbfcfe}
input[type=text]:focus{border-color:var(--brand)}
.actions{display:flex;gap:8px;margin-top:4px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .18s}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:#2f4bc4}
.btn.ghost{background:#eff2f8;color:#5c6880}
.tip{margin-top:12px;font-size:12px;color:var(--muted);line-height:1.7;background:var(--brand-l);border-radius:9px;padding:9px 11px}
.tip.warn{background:#fff4e6;color:#9a6420}
/* ===== 预览 ===== */
.preview{flex:1;min-width:0;display:flex;justify-content:center;overflow:auto;padding-bottom:36px}
.stage{width:210mm;height:297mm;transform-origin:top center}
/* ===== 纸面 ===== */
.paper{width:210mm;height:297mm;background:#fff;padding:12mm 15mm 10mm;box-shadow:0 8px 30px rgba(30,45,80,.16);border-radius:1mm;display:flex;flex-direction:column;overflow:hidden}
.sheet-head{display:flex;align-items:flex-end;justify-content:space-between;height:13mm;flex:0 0 13mm;border-bottom:.35mm solid #c6cddd;margin-bottom:4mm;padding-bottom:2mm;font-size:3.8mm;color:#28303f}
.sheet-head .t{font-weight:700}
.sheet-head .meta{font-size:3.4mm;color:#444;letter-spacing:.2mm}
.syl-wrap{display:flex;flex-wrap:wrap;align-content:flex-start;flex:1;overflow:hidden}
.syl{display:flex;margin-right:calc(var(--cw) * .7)}
/* 四线三格：只有横线，无竖线 */
.pcell{width:var(--cw);height:calc(var(--cw) * 1.35);position:relative;border-top:.3mm solid #96a3b5;border-bottom:.3mm solid #96a3b5}
.pcell::before,.pcell::after{content:'';position:absolute;left:0;right:0;height:0;border-top:.25mm dashed #c2cbd9}
.pcell::before{top:33.333%}
.pcell::after{top:66.666%}
.lt{position:absolute;left:0;width:100%;text-align:center;line-height:1;font-family:"Comic Sans MS","Arial Rounded MT Bold",Arial,Helvetica,sans-serif;color:#161c28}
/* 中格字母 */
.lt.mid{font-size:calc(var(--cw) * .77);top:calc(var(--cw) * .207)}
/* 上格字母：b d f h k l t j */
.lt.up{font-size:calc(var(--cw) * 1.08);top:calc(var(--cw) * -.072)}
/* 中下格字母：g p q y */
.lt.dn{font-size:calc(var(--cw) * .92);top:calc(var(--cw) * .072)}
.lt.trace{color:#c3cbd6}
/* ===== 打印 ===== */
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .panel{display:none !important}
  .app{display:block;padding:0;margin:0;max-width:none}
  .preview{display:block;padding:0;overflow:visible}
  .stage{width:auto;height:auto;transform:none !important;margin:0 !important}
  .paper{box-shadow:none;border-radius:0;margin:0}
}
@media (max-width:900px){
  .app{flex-direction:column;padding:12px}
  .panel{width:100%;flex:none;position:static;max-height:none}
  .preview{width:100%}
}
</style>
</head>
<body>
<h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">拼音描红纸生成器 · 四线三格声母韵母</h1>
<div class="app">
  <aside class="panel">
    <h2>拼音描红纸生成器</h2>
    <p class="sub">标准四线三格，字母自动占格。练声母、韵母、整体认读音节都合适。</p>

    <div class="field">
      <label>拼音内容（空格分隔音节）</label>
      <textarea id="txt" placeholder="例：b p m f d t n l"></textarea>
    </div>

    <div class="field">
      <label class="check"><input type="checkbox" id="chkAuto"> 输入的是汉字，自动转拼音</label>
    </div>

    <div class="field">
      <label>一键填充</label>
      <div class="chip">
        <button data-fill="sm">声母表</button>
        <button data-fill="ym">韵母表</button>
        <button data-fill="zt">整体认读</button>
        <button data-fill="clear">清空</button>
      </div>
    </div>

    <div class="field">
      <label>格子大小</label>
      <div class="seg" id="segSize">
        <button data-v="12">小</button>
        <button data-v="15">中</button>
        <button data-v="18">大</button>
      </div>
    </div>

    <div class="field">
      <label>描红模式</label>
      <div class="seg" id="segMode">
        <button data-v="sample">首音节示范</button>
        <button data-v="trace">全部描红</button>
        <button data-v="blank">空白练习</button>
      </div>
    </div>

    <div class="field">
      <label>页头标题</label>
      <input type="text" id="txtTitle" placeholder="如：声母描红练习">
    </div>

    <div class="actions">
      <button class="btn primary" id="btnPrint">打印描红纸</button>
      <button class="btn ghost" id="btnReset">恢复默认</button>
    </div>

    <div class="tip" id="tip">每个音节按字母占格：上格字母（b d f h k l t j）、中格字母、中下格字母（g p q y）自动归位。</div>
  </aside>

  <main class="preview">
    <div class="stage" id="stage">
      <div class="paper" id="paper"></div>
    </div>
  </main>
</div>

<script>
(function(){
  'use strict';

  var KEY = 'pymh_state_v1';
  var DEF = {
    text: 'b p m f d t n l',
    size: 15,
    mode: 'sample',
    auto: false,
    title: '拼音描红练习'
  };
  var state = Object.assign({}, DEF);
  try {
    var saved = localStorage.getItem(KEY);
    if (saved) state = Object.assign(state, JSON.parse(saved));
  } catch (e) {}

  // 三套标准表
  var TABLES = {
    sm: 'b p m f d t n l g k h j q x zh ch sh r z c s y w',
    ym: 'a o e i u ü ai ei ui ao ou iu ie üe er an en in un ün ang eng ing ong',
    zt: 'zhi chi shi ri zi ci si yi wu yu ye yue yuan yin yun ying'
  };

  var paper = document.getElementById('paper');
  var stage = document.getElementById('stage');
  var elText = document.getElementById('txt');
  var elTitle = document.getElementById('txtTitle');
  var chkAuto = document.getElementById('chkAuto');
  var tip = document.getElementById('tip');
  var MM = 96 / 25.4;

  // 字母占格分类
  var UP_SET = 'bdfhkltj';
  var DN_SET = 'gpqy';

  function letterType(ch) {
    var c = ch.toLowerCase();
    if (/[A-Z]/.test(ch)) return 'up';
    if (UP_SET.indexOf(c) > -1) return 'up';
    if (DN_SET.indexOf(c) > -1) return 'dn';
    return 'mid';
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // 解析成音节数组
  function parseSyllables() {
    var src = state.text || '';
    if (state.auto) {
      try {
        if (window.pinyinPro) {
          var arr = window.pinyinPro.pinyin(src, { toneType: 'none', type: 'array' });
          return arr.filter(function (s) { return /[a-zA-ZüÜ]/.test(s); });
        }
      } catch (e) {}
      return [];
    }
    return src.split(/[\s,，、;；]+/).filter(function (s) { return s.length > 0; });
  }

  // 渲染单个音节（逐字母一格）
  function sylHTML(syl, isDemo) {
    var letters = Array.from(syl);
    var inner = letters.map(function (ch) {
      var t = letterType(ch);
      var cls = 'lt ' + t;
      if (!isDemo && state.mode !== 'blank') cls += ' trace';
      var show = state.mode !== 'blank';
      return '<div class="pcell">' + (show ? '<span class="' + cls + '">' + esc(ch) + '</span>' : '') + '</div>';
    }).join('');
    return '<div class="syl">' + inner + '</div>';
  }

  function render() {
    paper.style.setProperty('--cw', state.size + 'mm');

    var syls = parseSyllables();
    var html = syls.map(function (s, i) {
      // 首音节示范模式：只有第一个音节是深色
      return sylHTML(s, state.mode === 'sample' && i === 0);
    }).join('');

    var head = '<div class="sheet-head">' +
                 '<span class="t">' + esc(state.title || '') + '</span>' +
                 '<span class="meta">姓名：____________　　班级：____________</span>' +
               '</div>';

    paper.innerHTML = head + '<div class="syl-wrap">' + html + '</div>';

    // 单行高度估算，用于超出提示
    var cy = state.size * 1.35;
    var perLine = Math.floor(180 / (state.size + state.size * 0.7)) || 1;
    var lines = Math.ceil(syls.length / perLine);
    var maxLines = Math.floor((297 - 24 - 13 - 8) / cy);
    if (lines > maxLines) {
      tip.className = 'tip warn';
      tip.textContent = '内容约需 ' + lines + ' 行，超过单页的 ' + maxLines + ' 行，超出部分不会被打印。可以调小格子或减少音节。';
    } else {
      tip.className = 'tip';
      tip.textContent = '每个音节按字母占格：上格字母（b d f h k l t j）、中格字母、中下格字母（g p q y）自动归位。';
    }

    fitScale();
  }

  function fitScale() {
    var wrapW = document.querySelector('.preview').clientWidth - 8;
    var paperW = 210 * MM;
    var s = Math.min(1, wrapW / paperW);
    stage.style.transform = 'scale(' + s + ')';
    stage.style.marginBottom = (297 * MM) * (s - 1) + 'px';
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function bindActive(id, val) {
    Array.prototype.forEach.call(document.querySelectorAll('#' + id + ' button'), function (b) {
      b.classList.toggle('on', b.dataset.v === val);
    });
  }

  function syncUI() {
    elText.value = state.text;
    elTitle.value = state.title;
    chkAuto.checked = state.auto;
    bindActive('segSize', String(state.size));
    bindActive('segMode', state.mode);
  }

  // 事件绑定
  var timer = null;
  elText.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      state.text = elText.value;
      save();
      render();
    }, 220);
  });

  elTitle.addEventListener('input', function () {
    state.title = elTitle.value;
    save();
    render();
  });

  chkAuto.addEventListener('change', function () {
    state.auto = chkAuto.checked;
    save();
    render();
  });

  document.getElementById('segSize').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    state.size = Number(b.dataset.v);
    bindActive('segSize', b.dataset.v);
    save();
    render();
  });

  document.getElementById('segMode').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    state.mode = b.dataset.v;
    bindActive('segMode', b.dataset.v);
    save();
    render();
  });

  // 一键填充
  document.querySelectorAll('.chip button').forEach(function (b) {
    b.addEventListener('click', function () {
      var k = b.dataset.fill;
      state.auto = false;
      chkAuto.checked = false;
      if (k === 'clear') {
        state.text = '';
      } else if (TABLES[k]) {
        state.text = TABLES[k];
      }
      elText.value = state.text;
      save();
      render();
    });
  });

  document.getElementById('btnPrint').addEventListener('click', function () {
    window.print();
  });

  document.getElementById('btnReset').addEventListener('click', function () {
    state = Object.assign({}, DEF);
    save();
    syncUI();
    render();
  });

  window.addEventListener('resize', fitScale);

  syncUI();
  render();
})();
</script>
</body>
</html>
