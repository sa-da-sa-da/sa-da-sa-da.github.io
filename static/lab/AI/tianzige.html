<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>田字格字帖生成器 · 生字古诗拼音字帖 A4 打印 | 当以读书通世事</title>
<link rel="canonical" href="https://www.sakaay.com/lab/AI/tianzige.html">
<meta name="description" content="田字格字帖生成器：粘贴生字、古诗或课文，一键生成田字格、米字格、方格字帖，支持拼音标注与首字示范、纯描红、空白练习三种模式，A4 直接打印。支持字格大小、每行字数、描红深浅与笔顺提示设置，可批量生成多页，适合语文写字课、书法社团与家庭练字。">
<script src="https://cdn.jsdelivr.net/npm/pinyin-pro/dist/index.js"></script>
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#1f2d2b;--muted:#6b7a78;--line:#e2e9e7;
  --brand:#2f7d6e;--brand-l:#e9f4f1;--bg:#f3f6f5;--card:#fff;
}
body{font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.app{display:flex;gap:18px;padding:18px;max-width:1360px;margin:0 auto;align-items:flex-start}
/* ===== 左侧控制面板 ===== */
.panel{width:326px;flex:0 0 326px;background:var(--card);border-radius:14px;padding:18px;box-shadow:0 4px 20px rgba(20,50,45,.07);position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto}
.panel h2{font-size:16px;font-weight:700;margin-bottom:4px}
.panel .sub{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.6}
.field{margin-bottom:16px}
.field label{display:block;font-size:13px;font-weight:600;color:#40514e;margin-bottom:7px}
textarea{width:100%;min-height:104px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;line-height:1.7;font-family:inherit;outline:none;color:var(--ink);background:#fbfdfc;transition:border-color .2s}
textarea:focus{border-color:var(--brand)}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:62px;padding:8px 6px;border:1px solid var(--line);background:#fbfdfc;border-radius:9px;font-size:13px;color:#5a6b68;cursor:pointer;transition:all .18s;font-family:inherit}
.seg button:hover{border-color:#bcd6d0}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:#40514e;cursor:pointer;padding:5px 0}
.check input{width:16px;height:16px;accent-color:var(--brand);cursor:pointer}
input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:14px;font-family:inherit;outline:none;color:var(--ink);background:#fbfdfc}
input[type=text]:focus{border-color:var(--brand)}
.actions{display:flex;gap:8px;margin-top:4px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .18s}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:#276a5d}
.btn.ghost{background:#f0f4f3;color:#5a6b68}
.btn.ghost:hover{background:#e5ecea}
.tip{margin-top:12px;font-size:12px;color:var(--muted);line-height:1.7;background:var(--brand-l);border-radius:9px;padding:9px 11px}
.tip.warn{background:#fff4e6;color:#9a6420}
/* ===== 右侧预览 ===== */
.preview{flex:1;min-width:0;display:flex;justify-content:center;overflow:auto;padding-bottom:36px}
.stage{width:210mm;height:297mm;transform-origin:top center}
/* ===== A4 纸面 ===== */
.paper{
  width:210mm;height:297mm;background:#fff;padding:12mm 15mm 10mm;
  box-shadow:0 8px 30px rgba(20,50,45,.16);border-radius:1mm;
  display:flex;flex-direction:column;overflow:hidden;
}
.sheet-head{display:flex;align-items:flex-end;justify-content:space-between;height:12mm;flex:0 0 12mm;border-bottom:.35mm solid #c9d2cf;margin-bottom:3mm;padding-bottom:2mm;font-size:3.8mm;color:#333}
.sheet-head .t{font-weight:700}
.sheet-head .meta{font-size:3.4mm;color:#444;letter-spacing:.2mm}
.rows{flex:1;overflow:hidden}
.row{display:flex;margin-bottom:2mm}
.cell{width:var(--cw);flex:0 0 var(--cw)}
.py{height:calc(var(--cw) * .34);font-size:calc(var(--cw) * .24);line-height:calc(var(--cw) * .34);text-align:center;color:#2c2c2c;font-family:"Times New Roman",Georgia,serif;white-space:nowrap;overflow:hidden}
.gf{width:var(--cw);height:var(--cw);position:relative;border:.5mm solid #232323;background:#fff}
.gf svg{position:absolute;inset:0;width:100%;height:100%;display:block}
.ch{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:"KaiTi","STKaiti","楷体","Kaiti SC",serif;font-size:calc(var(--cw) * .74);line-height:1;color:#1a1a1a}
.ch.trace{color:#c6cdcb}
/* ===== 打印 ===== */
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .panel{display:none !important}
  .app{display:block;padding:0;margin:0;max-width:none}
  .preview{display:block;padding:0;overflow:visible}
  .stage{width:auto;height:auto;transform:none !important;margin:0 !important}
  .paper{box-shadow:none;border-radius:0;margin:0;page-break-after:avoid}
}
@media (max-width:900px){
  .app{flex-direction:column;padding:12px}
  .panel{width:100%;flex:none;position:static;max-height:none}
  .preview{width:100%}
}
</style>
</head>
<body>
<h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">田字格字帖生成器 · 生字古诗拼音字帖</h1>
<div class="app">
  <aside class="panel">
    <h2>田字格字帖生成器</h2>
    <p class="sub">粘贴生字或古诗，选好格型直接打印。所有内容只存在你的浏览器里。</p>

    <div class="field">
      <label>练字内容</label>
      <textarea id="txt" placeholder="粘贴生字、古诗或课文，空格与换行会被自动去掉"></textarea>
    </div>

    <div class="field">
      <label>排版方式</label>
      <div class="seg" id="segLayout">
        <button data-v="repeat">逐字重复</button>
        <button data-v="flow">连续排列</button>
      </div>
    </div>

    <div class="field">
      <label>格型</label>
      <div class="seg" id="segGrid">
        <button data-v="tian">田字格</button>
        <button data-v="mi">米字格</button>
        <button data-v="fang">方格</button>
      </div>
    </div>

    <div class="field">
      <label>每行格数</label>
      <div class="seg" id="segPerRow">
        <button data-v="6">6</button>
        <button data-v="8">8</button>
        <button data-v="10">10</button>
        <button data-v="12">12</button>
      </div>
    </div>

    <div class="field">
      <label>练习模式</label>
      <div class="seg" id="segMode">
        <button data-v="sample">首字示范</button>
        <button data-v="trace">全部描红</button>
        <button data-v="blank">空白练习</button>
      </div>
    </div>

    <div class="field">
      <label class="check"><input type="checkbox" id="chkPinyin"> 显示拼音（每字上方标注）</label>
    </div>

    <div class="field">
      <label>页头标题</label>
      <input type="text" id="txtTitle" placeholder="如：第一单元生字练习">
    </div>

    <div class="actions">
      <button class="btn primary" id="btnPrint">打印字帖</button>
      <button class="btn ghost" id="btnReset">恢复示例</button>
    </div>

    <div class="tip" id="tip">逐字重复：每个字占一整行，适合生字抄写。连续排列：按原文顺序往下排，适合古诗、课文。</div>
  </aside>

  <main class="preview">
    <div class="stage" id="stage">
      <div class="paper" id="paper"></div>
    </div>
  </main>
</div>

<script>
(function(){
  'use strict';

  var KEY = 'tzg_state_v1';
  var DEF = {
    text: '床前明月光，疑是地上霜。举头望明月，低头思故乡。',
    layout: 'repeat',
    grid: 'tian',
    perRow: 8,
    mode: 'sample',
    pinyin: true,
    title: '古诗练习'
  };
  var state = Object.assign({}, DEF);
  try {
    var saved = localStorage.getItem(KEY);
    if (saved) state = Object.assign(state, JSON.parse(saved));
  } catch (e) { /* 忽略隐私模式下的读写异常 */ }

  var paper = document.getElementById('paper');
  var stage = document.getElementById('stage');
  var elText = document.getElementById('txt');
  var elTitle = document.getElementById('txtTitle');
  var chkPinyin = document.getElementById('chkPinyin');
  var tip = document.getElementById('tip');

  var pyCache = {};
  var MM = 96 / 25.4; // 1mm 对应的 CSS 像素

  // 取单个汉字的无声调拼音，失败则留空
  function getPy(ch) {
    if (pyCache[ch] !== undefined) return pyCache[ch];
    var r = '';
    try {
      if (window.pinyinPro && /\p{Script=Han}/u.test(ch)) {
        r = window.pinyinPro.pinyin(ch, { toneType: 'none', type: 'array' })[0] || '';
      }
    } catch (e) { r = ''; }
    pyCache[ch] = r;
    return r;
  }

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // 生成格内辅助线 SVG
  function gridLines(type) {
    if (type === 'fang') return '';
    var st = 'stroke="#a3aeab" stroke-width="1.1" stroke-dasharray="5 4"';
    var mid = '<line x1="50" y1="0" x2="50" y2="100" ' + st + '/>' +
              '<line x1="0" y1="50" x2="100" y2="50" ' + st + '/>';
    var cross = '';
    if (type === 'mi') {
      cross = '<line x1="0" y1="0" x2="100" y2="100" ' + st + '/>' +
              '<line x1="100" y1="0" x2="0" y2="100" ' + st + '/>';
    }
    return '<svg viewBox="0 0 100 100" preserveAspectRatio="none">' + mid + cross + '</svg>';
  }

  // 按排版方式切行
  function buildRows() {
    var chars = Array.from((state.text || '').replace(/\s+/g, ''));
    // 逐字重复模式下过滤标点，避免出现整行都是逗号的空练习行
    if (state.layout === 'repeat') {
      chars = chars.filter(function (ch) {
        return !/[，。、；：？！""''《》（）…—·,.;:?!"'()\[\]]/.test(ch);
      });
    }
    var n = state.perRow;
    if (!chars.length) return [];
    var rows = [];
    if (state.layout === 'repeat') {
      chars.forEach(function (ch) { rows.push(Array(n).fill(ch)); });
    } else {
      for (var i = 0; i < chars.length; i += n) {
        var seg = chars.slice(i, i + n);
        while (seg.length < n) seg.push('');
        rows.push(seg);
      }
    }
    return rows;
  }

  function cellHTML(ch, col) {
    var py = ch ? getPy(ch) : '';
    var cls = '';
    var show = false;
    if (ch) {
      if (state.mode === 'sample') { cls = (col === 0 ? '' : 'trace'); show = true; }
      else if (state.mode === 'trace') { cls = 'trace'; show = true; }
      else { show = false; }
    }
    var charHTML = show ? '<div class="ch ' + cls + '">' + esc(ch) + '</div>' : '';
    return '<div class="cell">' +
             '<div class="py">' + esc(py) + '</div>' +
             '<div class="gf">' + gridLines(state.grid) + charHTML + '</div>' +
           '</div>';
  }

  function render() {
    var cw = (210 - 30) / state.perRow; // 版心 180mm 均分
    paper.style.setProperty('--cw', cw + 'mm');

    var rows = buildRows();
    var rowH = cw * (state.pinyin ? 1.34 : 1) + 2; // 单行总高（mm）
    var maxRows = Math.floor(261 / rowH);
    var overflow = rows.length > maxRows;
    if (overflow) rows = rows.slice(0, maxRows);

    var head = '';
    if (state.title || true) {
      head = '<div class="sheet-head">' +
               '<span class="t">' + esc(state.title || '') + '</span>' +
               '<span class="meta">姓名：____________　　日期：____________</span>' +
             '</div>';
    }

    var body = rows.map(function (row) {
      return '<div class="row">' + row.map(function (ch, i) { return cellHTML(ch, i); }).join('') + '</div>';
    }).join('');

    paper.innerHTML = head + '<div class="rows">' + body + '</div>';

    if (overflow) {
      tip.className = 'tip warn';
      tip.textContent = '内容超出单页，只显示前 ' + maxRows + ' 行（约 ' + (maxRows * state.perRow) + ' 格）。可以调大每行格数或分批打印。';
    } else {
      tip.className = 'tip';
      tip.textContent = state.layout === 'repeat'
        ? '逐字重复：每个字占一整行，适合生字抄写。'
        : '连续排列：按原文顺序往下排，适合古诗、课文。';
    }

    fitScale();
  }

  // 预览按容器宽度等比缩放，打印时还原 1:1
  function fitScale() {
    var wrapW = document.querySelector('.preview').clientWidth - 8;
    var paperW = 210 * MM;
    var s = Math.min(1, wrapW / paperW);
    stage.style.transform = 'scale(' + s + ')';
    stage.style.marginBottom = (297 * MM) * (s - 1) + 'px';
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function syncUI() {
    elText.value = state.text;
    elTitle.value = state.title;
    chkPinyin.checked = state.pinyin;
    bindActive('segLayout', state.layout);
    bindActive('segGrid', state.grid);
    bindActive('segPerRow', String(state.perRow));
    bindActive('segMode', state.mode);
  }

  function bindActive(id, val) {
    var btns = document.querySelectorAll('#' + id + ' button');
    Array.prototype.forEach.call(btns, function (b) {
      b.classList.toggle('on', b.dataset.v === val);
    });
  }

  function bindSeg(id, key, isNum) {
    document.getElementById(id).addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      state[key] = isNum ? Number(b.dataset.v) : b.dataset.v;
      bindActive(id, b.dataset.v);
      save();
      render();
    });
  }

  // 事件绑定
  var timer = null;
  elText.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      state.text = elText.value;
      save();
      render();
    }, 220);
  });

  elTitle.addEventListener('input', function () {
    state.title = elTitle.value;
    save();
    render();
  });

  chkPinyin.addEventListener('change', function () {
    state.pinyin = chkPinyin.checked;
    save();
    render();
  });

  bindSeg('segLayout', 'layout');
  bindSeg('segGrid', 'grid');
  bindSeg('segPerRow', 'perRow', true);
  bindSeg('segMode', 'mode');

  document.getElementById('btnPrint').addEventListener('click', function () {
    window.print();
  });

  document.getElementById('btnReset').addEventListener('click', function () {
    state = Object.assign({}, DEF);
    pyCache = {};
    save();
    syncUI();
    render();
  });

  window.addEventListener('resize', fitScale);

  // 拼音库异步就绪后重绘一次（CDN 较慢时也能补上拼音）
  window.addEventListener('load', function () {
    pyCache = {};
    render();
  });

  syncUI();
  render();
})();
</script>
</body>
</html>
