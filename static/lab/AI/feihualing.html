<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>飞花令 · 古诗词课堂互动对抗/计时计分 | 当以读书通世事</title>
<link rel="canonical" href="https://www.sakaay.com/lab/AI/feihualing.html">
<meta name="description" content="飞花令课堂互动工具：选「月、花、春、风、雨、山、水、云、雪、夜」等关键字，红蓝两队轮流背诵诗句，含 20 秒倒计时、随机提示与计分，支持投屏展示。支持自定义关键字与题库，倒计时时长、提示方式均可调整，适合课堂分组对抗、校园诗词大会与课前热身。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --bg:#0b1020;--card:#161e33;--card2:#1c2540;--line:rgba(255,255,255,.09);
  --text:#e9eefc;--muted:#8e9bbd;--gold:#ffd166;--red:#ff6b6b;--blue:#4dabf7;
  --radius:16px;
}
body{font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;color:var(--text);
  background:radial-gradient(1200px 600px at 50% -10%,#1e2a4d 0%,#0b1020 62%) fixed;min-height:100vh;-webkit-font-smoothing:antialiased}

/* ===== 骨架 ===== */
.wrap{max-width:1080px;margin:0 auto;padding:20px 16px 48px}
.top{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:16px}
.logo{font-size:20px;font-weight:800;letter-spacing:1px;display:flex;align-items:center;gap:8px}
.logo small{font-size:12px;font-weight:400;color:var(--muted);letter-spacing:0}

/* 关键字胶囊 */
.kw-row{display:flex;gap:8px;flex-wrap:wrap}
.kw{padding:8px 16px;border-radius:999px;border:1px solid var(--line);background:rgba(255,255,255,.04);
  color:var(--muted);font-size:15px;font-weight:600;font-family:inherit;cursor:pointer;transition:all .18s}
.kw:hover{color:var(--text);border-color:rgba(255,209,102,.5)}
.kw.on{background:linear-gradient(135deg,#ffe08a,#ffd166);border-color:transparent;color:#3a2c00;box-shadow:0 6px 18px rgba(255,209,102,.28)}

/* 主舞台 */
.stage{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:18px;
  box-shadow:0 18px 50px rgba(0,0,0,.35)}
.teams{display:grid;grid-template-columns:1fr 260px 1fr;gap:14px;align-items:stretch}

/* 队伍卡 */
.team{border-radius:14px;padding:16px;background:var(--card2);border:1px solid var(--line);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;transition:all .25s;position:relative;overflow:hidden}
.team .t-name{font-size:14px;font-weight:700;letter-spacing:2px;color:var(--muted)}
.team .t-score{font-size:52px;font-weight:800;line-height:1.1;font-variant-numeric:tabular-nums}
.team .t-tip{font-size:12px;color:var(--muted)}
.team.red .t-score{color:var(--red)}
.team.blue .t-score{color:var(--blue)}
.team.red.active{border-color:rgba(255,107,107,.65);box-shadow:0 0 0 2px rgba(255,107,107,.18) inset,0 8px 26px rgba(255,107,107,.18);background:linear-gradient(180deg,rgba(255,107,107,.14),rgba(255,107,107,.04))}
.team.blue.active{border-color:rgba(77,171,247,.65);box-shadow:0 0 0 2px rgba(77,171,247,.18) inset,0 8px 26px rgba(77,171,247,.18);background:linear-gradient(180deg,rgba(77,171,247,.14),rgba(77,171,247,.04))}
.team.active .t-name{color:var(--text)}
.badge{position:absolute;top:10px;right:12px;font-size:11px;padding:2px 8px;border-radius:999px;background:rgba(255,255,255,.12);color:var(--text);display:none}
.team.active .badge{display:block}

/* 中间计时 */
.center{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.timer{width:170px;height:170px;border-radius:50%;position:relative;display:flex;align-items:center;justify-content:center;
  background:conic-gradient(var(--gold) calc(var(--p, 100) * 1%), rgba(255,255,255,.07) 0);transition:background .15s linear}
.timer::before{content:'';position:absolute;inset:9px;border-radius:50%;background:#111a30;box-shadow:inset 0 0 26px rgba(0,0,0,.55)}
.timer .num{position:relative;font-size:46px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1;color:var(--text)}
.timer .unit{position:relative;font-size:11px;color:var(--muted);margin-top:6px;text-align:center;letter-spacing:2px}
.timer.warn{background:conic-gradient(var(--red) calc(var(--p, 100) * 1%), rgba(255,255,255,.07) 0);animation:pulseRed 1s infinite}
@keyframes pulseRed{0%,100%{filter:drop-shadow(0 0 0 rgba(255,107,107,0))}50%{filter:drop-shadow(0 0 12px rgba(255,107,107,.5))}}
.timer.paused::after{content:'已暂停';position:absolute;bottom:26px;font-size:11px;color:var(--muted);letter-spacing:1px}
.turn-label{font-size:14px;font-weight:700;padding:5px 16px;border-radius:999px;background:rgba(255,255,255,.06);border:1px solid var(--line)}
.dur-row{display:flex;gap:6px}
.dur{padding:5px 12px;border-radius:999px;border:1px solid var(--line);background:transparent;color:var(--muted);
  font-size:12px;font-family:inherit;cursor:pointer;transition:all .18s}
.dur.on{background:rgba(255,209,102,.16);border-color:rgba(255,209,102,.55);color:var(--gold);font-weight:700}

/* 提示区 */
.hint-area{margin-top:16px}
.hint-box{min-height:76px;border-radius:12px;border:1px dashed rgba(255,209,102,.35);background:rgba(255,209,102,.06);
  display:flex;align-items:center;justify-content:center;text-align:center;padding:14px 18px;font-size:20px;line-height:1.7;letter-spacing:1px}
.hint-box .placeholder{font-size:14px;color:var(--muted);letter-spacing:0}
.hint-box .from{display:block;font-size:12.5px;color:var(--gold);margin-top:6px;letter-spacing:0}
.hint-box.fade{animation:fadeIn .3s ease}
@keyframes fadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

/* 操作按钮 */
.ops{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}
.op{flex:1;min-width:132px;padding:14px 12px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.05);
  color:var(--text);font-size:15px;font-weight:700;font-family:inherit;cursor:pointer;transition:all .18s;letter-spacing:1px}
.op:hover{background:rgba(255,255,255,.1);transform:translateY(-2px)}
.op.primary{background:linear-gradient(135deg,#59d6a4,#2fa87a);border-color:transparent;color:#052019;box-shadow:0 8px 22px rgba(47,168,122,.28)}
.op.gold{background:linear-gradient(135deg,#ffe08a,#ffd166);border-color:transparent;color:#3a2c00}
.op.danger{color:#ffb3b3}

/* 已用诗句 */
.used{margin-top:16px;border-top:1px solid var(--line);padding-top:14px}
.used-head{display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700;margin-bottom:10px}
.used-head .cnt{font-size:12px;font-weight:400;color:var(--muted)}
.used-list{list-style:none;max-height:230px;overflow:auto;display:flex;flex-direction:column;gap:8px;padding-right:4px}
.used-list li{display:flex;gap:10px;font-size:14px;line-height:1.65;padding:8px 12px;border-radius:10px;background:rgba(255,255,255,.04);border:1px solid transparent}
.used-list li .no{flex:0 0 26px;height:26px;border-radius:50%;background:rgba(255,209,102,.16);color:var(--gold);
  font-size:12px;font-weight:700;display:flex;align-items:center;justify-content:center;margin-top:2px}
.used-list li .txt{flex:1;min-width:0}
.used-list li .from{display:block;font-size:12px;color:var(--muted);margin-top:2px}
.used-list li .tag{font-size:11px;color:var(--gold);border:1px solid rgba(255,209,102,.4);border-radius:999px;padding:1px 7px;height:20px;align-self:flex-start;margin-top:2px;flex:0 0 auto}
.used-list li.hint{margin-left:0}
.empty{font-size:13px;color:var(--muted);padding:12px;text-align:center;border-radius:10px;background:rgba(255,255,255,.03)}

/* 轻提示 */
.toast{position:fixed;left:50%;bottom:36px;transform:translate(-50%,20px);padding:12px 26px;border-radius:999px;
  background:rgba(20,28,48,.96);border:1px solid rgba(255,209,102,.5);color:var(--gold);font-size:14px;font-weight:700;
  box-shadow:0 10px 30px rgba(0,0,0,.45);opacity:0;pointer-events:none;transition:all .28s ease;z-index:99}
.toast.show{opacity:1;transform:translate(-50%,0)}

/* ===== 打印（保留基本可读性） ===== */
@media print{
  @page{size:A4;margin:14mm}
  body{background:#fff;color:#111}
  .wrap{max-width:none;padding:0}
  .top,.ops,.dur-row,.toast{display:none!important}
  .stage,.team,.hint-box,.used-list li{background:#fff!important;border-color:#bbb!important;box-shadow:none!important}
  .team .t-score{color:#111!important}
  .kw{border-color:#bbb;color:#111}
}

/* ===== 响应式 ===== */
@media (max-width:820px){
  .teams{grid-template-columns:1fr 1fr;grid-template-areas:"center center" "red blue"}
  .center{grid-area:center}
  .team.red{grid-area:red}
  .team.blue{grid-area:blue}
  .timer{width:140px;height:140px}
  .timer .num{font-size:38px}
  .hint-box{font-size:16px}
  .op{min-width:120px;font-size:14px;padding:12px 10px}
}
</style>
</head>
<body>
<h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">飞花令 · 古诗词课堂互动对抗</h1>
<div class="wrap">
  <header class="top">
    <div class="logo">🎋 飞花令 <small>课堂对抗 · 看谁背得多</small></div>

  <main class="stage">
    <!-- 队伍与计时 -->
    <section class="teams">
      <div class="team red active" id="teamRed">
        <span class="badge">作答中</span>
        <div class="t-name">红 队</div>
        <div class="t-score" id="scoreRed">0</div>
        <div class="t-tip">含「月」字的诗句</div>
      </div>

      <div class="center">
        <div class="timer" id="timerRing">
          <div style="display:flex;flex-direction:column;align-items:center">
            <div class="num" id="timerNum">20</div>
            <div class="unit">秒</div>
          </div>
        </div>
        <div class="turn-label" id="turnLabel">红队作答中</div>
        <div class="dur-row" id="durRow">
          <button type="button" class="dur" data-v="15">15 秒</button>
          <button type="button" class="dur on" data-v="20">20 秒</button>
          <button type="button" class="dur" data-v="30">30 秒</button>
        </div>
      </div>

      <div class="team blue" id="teamBlue">
        <span class="badge">作答中</span>
        <div class="t-name">蓝 队</div>
        <div class="t-score" id="scoreBlue">0</div>
        <div class="t-tip">含「月」字的诗句</div>
      </div>
    </section>

    <!-- 提示区 -->
    <section class="hint-area">

    <!-- 操作 -->
    <section class="ops">
      <button type="button" class="op primary" id="btnAccept">✅ 我来接（答对 +1）</button>
      <button type="button" class="op gold" id="btnHint">💡 提示</button>
      <button type="button" class="op" id="btnPause">⏸ 暂停计时</button>
      <button type="button" class="op danger" id="btnReset">↺ 重置本局</button>
    </section>

    <!-- 已用诗句 -->
    <section class="used">
      <div class="used-head"><span>已用诗句</span><span class="cnt" id="usedCount">0 句</span></div>
      <ol class="used-list" id="usedList"></ol>
      <div class="empty" id="usedEmpty">还没有用过的诗句，先让红队来一句吧。</div>
    </section>
  </main>

  <div class="toast" id="toast"></div>
</div>

      { j: '问渠那得清如许？为有源头活水来。', f: '朱熹《观书有感》' },
      { j: '蒹葭苍苍，白露为霜。所谓伊人，在水一方。', f: '《诗经·秦风·蒹葭》' },
      { j: '峨眉山月半轮秋，影入平羌江水流。', f: '李白《峨眉山月歌》' }
    ],
    '云': [
      { j: '远上寒山石径斜，白云生处有人家。', f: '杜牧《山行》' },
      { j: '只在此山中，云深不知处。', f: '贾岛《寻隐者不遇》' },
      { j: '千里黄云白日曛，北风吹雁雪纷纷。', f: '高适《别董大》' },
      { j: '黑云翻墨未遮山，白雨跳珠乱入船。', f: '苏轼《六月二十七日望湖楼醉书》' },
      { j: '不畏浮云遮望眼，自缘身在最高层。', f: '王安石《登飞来峰》' },
      { j: '长风破浪会有时，直挂云帆济沧海。', f: '李白《行路难》' },
      { j: '众鸟高飞尽，孤云独去闲。', f: '李白《独坐敬亭山》' },
      { j: '大风起兮云飞扬。', f: '刘邦《大风歌》' },
      { j: '云横秦岭家何在？雪拥蓝关马不前。', f: '韩愈《左迁至蓝关示侄孙湘》' },
      { j: '半亩方塘一鉴开，天光云影共徘徊。', f: '朱熹《观书有感》' },
      { j: '黄鹤一去不复返，白云千载空悠悠。', f: '崔颢《黄鹤楼》' }
    ],
    '雪': [
      { j: '孤舟蓑笠翁，独钓寒江雪。', f: '柳宗元《江雪》' },
      { j: '遥知不是雪，为有暗香来。', f: '王安石《梅花》' },
      { j: '千里黄云白日曛，北风吹雁雪纷纷。', f: '高适《别董大》' },
      { j: '窗含西岭千秋雪，门泊东吴万里船。', f: '杜甫《绝句》' },
      { j: '夜深知雪重，时闻折竹声。', f: '白居易《夜雪》' },
      { j: '五月天山雪，无花只有寒。', f: '李白《塞下曲》' },
      { j: '柴门闻犬吠，风雪夜归人。', f: '刘长卿《逢雪宿芙蓉山主人》' },
      { j: '云横秦岭家何在？雪拥蓝关马不前。', f: '韩愈《左迁至蓝关示侄孙湘》' },
      { j: '北国风光，千里冰封，万里雪飘。', f: '毛泽东《沁园春·雪》' },
      { j: '白雪却嫌春色晚，故穿庭树作飞花。', f: '韩愈《春雪》' }
    ],
    '夜': [
      { j: '夜来风雨声，花落知多少。', f: '孟浩然《春晓》' },
      { j: '露从今夜白，月是故乡明。', f: '杜甫《月夜忆舍弟》' },
      { j: '姑苏城外寒山寺，夜半钟声到客船。', f: '张继《枫桥夜泊》' },
      { j: '何当共剪西窗烛，却话巴山夜雨时。', f: '李商隐《夜雨寄北》' },
      { j: '今夜月明人尽望，不知秋思落谁家。', f: '王建《十五夜望月》' },
      { j: '明月别枝惊鹊，清风半夜鸣蝉。', f: '辛弃疾《西江月·夜行黄沙道中》' },
      { j: '人闲桂花落，夜静春山空。', f: '王维《鸟鸣涧》' },
      { j: '夜阑卧听风吹雨，铁马冰河入梦来。', f: '陆游《十一月四日风雨大作》' },
      { j: '柴门闻犬吠，风雪夜归人。', f: '刘长卿《逢雪宿芙蓉山主人》' },
      { j: '夜深知雪重，时闻折竹声。', f: '白居易《夜雪》' }
    ]
  };

  var KEYS = ['月', '花', '春', '风', '雨', '山', '水', '云', '雪', '夜'];
  var KEY = 'feihualing_v1';
  var TEAM_NAMES = ['红队', '蓝队'];

  var state = { keyword: '月', team: 0, scores: [0, 0], duration: 20, used: {} };
  try {
    var saved = localStorage.getItem(KEY);
    if (saved) {
      var parsed = JSON.parse(saved);
      if (parsed && POEMS[parsed.keyword]) state = Object.assign(state, parsed);
    }
  } catch (e) { /* 隐私模式忽略 */ }
  if (!state.scores || !state.scores.length) state.scores = [0, 0];
  if (!state.used || typeof state.used !== 'object') state.used = {};
  if (!state.duration) state.duration = 20;

  var el = {
    kwRow: document.getElementById('kwRow'),
    teamRed: document.getElementById('teamRed'),
    teamBlue: document.getElementById('teamBlue'),
    scoreRed: document.getElementById('scoreRed'),
    scoreBlue: document.getElementById('scoreBlue'),
    timerRing: document.getElementById('timerRing'),
    timerNum: document.getElementById('timerNum'),
    turnLabel: document.getElementById('turnLabel'),
    durRow: document.getElementById('durRow'),
    hintBox: document.getElementById('hintBox'),
    btnAccept: document.getElementById('btnAccept'),
    btnHint: document.getElementById('btnHint'),
    btnPause: document.getElementById('btnPause'),
    btnReset: document.getElementById('btnReset'),
    usedList: document.getElementById('usedList'),
    usedCount: document.getElementById('usedCount'),
    usedEmpty: document.getElementById('usedEmpty'),
    toast: document.getElementById('toast'),
    tips: document.querySelectorAll('.team .t-tip')
  };

  // 计时状态
  var timerId = null;
  var running = false;
  var lastTs = 0;
  var remaining = state.duration;
  var audioCtx = null;
  var toastTimer = null;

  // ===== 音效（Web Audio 合成，无外部音频文件） =====
  function getCtx() {
    try {
      if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
      if (audioCtx.state === 'suspended') audioCtx.resume();
      return audioCtx;
    } catch (e) { return null; }
  }

  function beep(freq, dur, type, delay, vol) {
    var ctx = getCtx();
    if (!ctx) return;
    var t0 = ctx.currentTime + (delay || 0);
    var osc = ctx.createOscillator();
    var gain = ctx.createGain();
    osc.type = type || 'sine';
    osc.frequency.setValueAtTime(freq, t0);
    gain.gain.setValueAtTime(0.0001, t0);
    gain.gain.linearRampToValueAtTime(vol || 0.16, t0 + 0.02);
    gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    osc.connect(gain);
    gain.connect(ctx.destination);
    osc.start(t0);
    osc.stop(t0 + dur + 0.05);
  }

  function sfxScore() { beep(680, 0.13, 'sine', 0, 0.18); beep(1000, 0.18, 'sine', 0.12, 0.16); }
  function sfxSwitch() { beep(520, 0.1, 'triangle', 0, 0.12); beep(400, 0.12, 'triangle', 0.1, 0.1); }
  function sfxTimeout() { beep(240, 0.28, 'sawtooth', 0, 0.14); beep(150, 0.34, 'sawtooth', 0.26, 0.13); }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function toast(msg) {
    el.toast.textContent = msg;
    el.toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { el.toast.classList.remove('show'); }, 2200);
  }

  // ===== 渲染 =====
  function renderKeywords() {
    el.kwRow.innerHTML = '';
    KEYS.forEach(function (k) {
      var b = document.createElement('button');
      b.type = 'button';
      b.className = 'kw' + (k === state.keyword ? ' on' : '');
      b.textContent = k;
      b.addEventListener('click', function () {
        if (state.keyword === k) return;
        state.keyword = k;
        save();
        renderKeywords();
        renderAll();
        resetTurnTimer();
        toast('已切换到「' + k + '」字');
      });
      el.kwRow.appendChild(b);
    });
  }

  function renderTeams() {
    el.scoreRed.textContent = state.scores[0];
    el.scoreBlue.textContent = state.scores[1];
    el.teamRed.classList.toggle('active', state.team === 0);
    el.teamBlue.classList.toggle('active', state.team === 1);
    el.turnLabel.textContent = TEAM_NAMES[state.team] + '作答中';
    el.turnLabel.style.color = state.team === 0 ? 'var(--red)' : 'var(--blue)';
    el.turnLabel.style.borderColor = state.team === 0 ? 'rgba(255,107,107,.5)' : 'rgba(77,171,247,.5)';
  }

  function currentUsed() {
    if (!Array.isArray(state.used[state.keyword])) state.used[state.keyword] = [];
    return state.used[state.keyword];
  }

  function renderUsed() {
    var list = currentUsed();
    el.usedList.innerHTML = list.map(function (item, i) {
      return '<li class="' + (item.hint ? 'hint' : '') + '">' +
        '<span class="no">' + (i + 1) + '</span>' +
        '<span class="txt">' + item.j + '<span class="from">' + item.f + '</span></span>' +
        (item.hint ? '<span class="tag">提示</span>' : '') +
        '</li>';
    }).join('');
    el.usedCount.textContent = list.length + ' 句';
    el.usedEmpty.style.display = list.length ? 'none' : 'block';
    el.usedList.style.display = list.length ? 'flex' : 'none';
  }

  function renderHintEmpty() {
    el.hintBox.classList.remove('fade');
    el.hintBox.innerHTML = '<span class="placeholder">点击「提示」可随机抽一句参考，抽出的诗句会记为已用</span>';
  }

  function renderDurations() {
    Array.prototype.forEach.call(el.durRow.querySelectorAll('.dur'), function (b) {
      b.classList.toggle('on', Number(b.dataset.v) === state.duration);
    });
  }

  function renderTeamTips() {
    Array.prototype.forEach.call(el.tips, function (t) {
      t.textContent = '含「' + state.keyword + '」字的诗句';
    });
  }

  function renderAll() {
    renderTeams();
    renderUsed();
    renderDurations();
    renderTeamTips();
    renderTimer();
    renderHintEmpty();
  }

  // ===== 计时 =====
  function renderTimer() {
    var pct = state.duration > 0 ? Math.max(0, Math.min(100, remaining / state.duration * 100)) : 0;
    el.timerRing.style.setProperty('--p', pct.toFixed(2));
    el.timerNum.textContent = Math.ceil(remaining);
    el.timerRing.classList.toggle('warn', remaining <= 5 && remaining > 0);
    el.timerRing.classList.toggle('paused', !running);
  }

  function tick() {
    if (!running) return;
    var now = Date.now();
    remaining -= (now - lastTs) / 1000;
    lastTs = now;
    if (remaining <= 0) {
      remaining = 0;
      renderTimer();
      stopTimer();
      onTimeout();
      return;
    }
    renderTimer();
  }

  function startTimer() {
    if (timerId) return;
    running = true;
    lastTs = Date.now();
    timerId = setInterval(tick, 100);
    el.btnPause.textContent = '⏸ 暂停计时';
    renderTimer();
  }

  function stopTimer() {
    if (timerId) { clearInterval(timerId); timerId = null; }
    running = false;
    el.btnPause.textContent = '▶ 继续计时';
    renderTimer();
  }

  // 换人/换字后重置本回合计时并自动开始
  function resetTurnTimer() {
    stopTimer();
    remaining = state.duration;
    renderTimer();
    startTimer();
  }

  function onTimeout() {
    sfxTimeout();
    toast('⏰ ' + TEAM_NAMES[state.team] + '超时，换对方作答');
    switchTeam('timeout');
  }

  // 交换作答队伍
  function switchTeam(reason) {
    state.team = 1 - state.team;
    save();
    renderTeams();
    renderHintEmpty();
    resetTurnTimer();
    if (reason !== 'timeout') {
      setTimeout(function () { sfxSwitch(); }, 260);
    }
  }

  // ===== 玩法 =====
  function accept() {
    state.scores[state.team] += 1;
    save();
    renderTeams();
    sfxScore();
    toast('👏 ' + TEAM_NAMES[state.team] + '答对，加 1 分');
    switchTeam('answer');
  }

  function giveHint() {
    var list = currentUsed();
    var all = POEMS[state.keyword] || [];
    var unused = all.filter(function (line) {
      return !list.some(function (u) { return u.j === line.j; });
    });
    if (!unused.length) {
      toast('「' + state.keyword + '」字的诗句已经全部用完了');
      return;
    }
    var pick = unused[Math.floor(Math.random() * unused.length)];
    list.push({ j: pick.j, f: pick.f, hint: true });
    save();
    renderUsed();
    el.hintBox.classList.remove('fade');
    // 触发重排以重启动画
    void el.hintBox.offsetWidth;
    el.hintBox.classList.add('fade');
    el.hintBox.innerHTML = pick.j + '<span class="from">—— ' + pick.f + '</span>';
    remaining = state.duration;
    renderTimer();
  }

  function resetAll() {
    if (!window.confirm('确定要重置本局吗？两队的分数和已用诗句都会清空。')) return;
    state.scores = [0, 0];
    state.used = {};
    state.team = 0;
    save();
    renderAll();
    resetTurnTimer();
    toast('本局已重置');
  }

  // ===== 事件绑定 =====
  el.btnAccept.addEventListener('click', accept);
  el.btnHint.addEventListener('click', giveHint);
  el.btnReset.addEventListener('click', resetAll);

  el.btnPause.addEventListener('click', function () {
    if (running) {
      stopTimer();
      toast('已暂停计时');
    } else {
      startTimer();
      toast('继续计时');
    }
  });

  el.durRow.addEventListener('click', function (e) {
    var b = e.target.closest('.dur');
    if (!b) return;
    state.duration = Number(b.dataset.v);
    save();
    renderDurations();
    remaining = state.duration;
    renderTimer();
    if (!running) startTimer();
    toast('每队作答时间改为 ' + state.duration + ' 秒');
  });

  // ===== 初始化 =====
  renderKeywords();
  renderAll();
  resetTurnTimer();
})();
</script>
