<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>抽签排序器 · 随机点名/演讲排序/值日分组 | 当以读书通世事</title>
<link rel="canonical" href="https://www.sakaay.com/lab/AI/chouqian.html">
<meta name="description" content="课堂抽签排序工具：粘贴学生名单后可随机抽人点名，滚动减速动画配音效，支持不放回模式与抽中历史记录，也可一键生成全员随机顺序用于演讲、值日排序。支持分组抽取与结果导出，适合课堂提问、活动暖场与公平排班，数据只存本机。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:linear-gradient(135deg,#d6f0f7 0%,#dce9fb 55%,#e8dcf5 100%);min-height:100vh;color:#333;padding:24px 16px}
.wrap{max-width:1080px;margin:0 auto}
.hero{text-align:center;margin-bottom:20px}
.hero h1{font-size:30px;font-weight:800;color:#1f6a8c;letter-spacing:2px}
.hero p{font-size:14px;color:#7ba3b8;margin-top:6px}

/* ===== 面板 ===== */
.layout{display:grid;grid-template-columns:300px 1fr;gap:16px;align-items:start}
@media(max-width:820px){.layout{grid-template-columns:1fr}}
.panel{background:rgba(255,255,255,.92);border-radius:14px;padding:16px 18px;box-shadow:0 4px 16px rgba(31,106,140,.10)}
.panel + .panel{margin-top:16px}
.panel-title{font-size:16px;font-weight:700;color:#1f6a8c;margin-bottom:10px;display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.count{font-size:12px;font-weight:600;color:#fff;background:#4d9fbf;border-radius:10px;padding:2px 10px}
.spacer{flex:1}
.hint{font-size:12px;color:#999;line-height:1.7}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}

/* ===== 按钮 ===== */
.btn{border:none;border-radius:18px;padding:8px 18px;font-size:14px;font-weight:600;cursor:pointer;transition:all .2s;background:#e2f1f7;color:#21708f}
.btn:hover{transform:translateY(-2px);box-shadow:0 4px 10px rgba(31,106,140,.18)}
.btn.primary{background:linear-gradient(135deg,#4d9fbf,#2f7fa5);color:#fff}
.btn.ghost{background:#fff;border:1px solid #cfe6ef;color:#7ba3b8}
.btn.big{padding:12px 34px;font-size:17px;border-radius:26px}
.btn.small{padding:5px 14px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed;transform:none}

/* ===== 名单 ===== */
textarea{width:100%;min-height:200px;padding:10px 12px;border:1.5px solid #cfe3ee;border-radius:10px;font-size:14px;line-height:1.9;resize:vertical;outline:none;margin-bottom:10px}
textarea:focus{border-color:#4d9fbf}

/* ===== 模式切换 ===== */
.tabs{display:flex;gap:6px;background:rgba(255,255,255,.85);border-radius:22px;padding:4px;margin-bottom:16px;box-shadow:0 2px 10px rgba(31,106,140,.08);width:fit-content}
.tab{border:none;background:transparent;padding:9px 26px;border-radius:18px;font-size:15px;font-weight:700;color:#7ba3b8;cursor:pointer;transition:all .2s}
.tab.active{background:linear-gradient(135deg,#4d9fbf,#2f7fa5);color:#fff}

/* ===== 抽人区 ===== */
.draw-box{background:linear-gradient(160deg,#1d5d80,#2e88ad);border-radius:18px;height:170px;display:flex;align-items:center;justify-content:center;margin-bottom:16px;box-shadow:inset 0 0 40px rgba(0,0,0,.18),0 6px 18px rgba(31,106,140,.25);overflow:hidden}
.draw-name{font-size:56px;font-weight:900;color:#fff;letter-spacing:6px;text-shadow:0 4px 16px rgba(0,0,0,.35);font-family:'PingFang SC','Microsoft YaHei',sans-serif;max-width:95%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.center{justify-content:center}
.switch-wrap{display:flex;align-items:center;gap:6px;font-size:14px;color:#555;cursor:pointer;user-select:none}
.switch-wrap input{width:17px;height:17px;accent-color:#2f7fa5;cursor:pointer}
.pool-line{margin-top:12px;font-size:14px;color:#666;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.pool-line b{color:#2f7fa5;font-size:17px}
.pool-line.full b{color:#e05c5c}

/* ===== 抽中历史 ===== */
.history{display:flex;flex-wrap:wrap;gap:8px;min-height:34px}
.h-item{display:inline-flex;align-items:center;gap:6px;background:#f0f8fb;border:1px solid #d8ecf3;border-radius:18px;padding:4px 12px 4px 6px;font-size:14px;font-weight:600}
.h-item .no{width:22px;height:22px;border-radius:50%;background:#2f7fa5;color:#fff;font-size:11px;display:flex;align-items:center;justify-content:center;font-weight:700}
.h-item.latest{background:#fff3d6;border-color:#f0d890}
.empty-tip{font-size:12px;color:#bbb;padding:6px 2px}

/* ===== 排序区 ===== */
.sort-list{margin-top:14px;display:flex;flex-direction:column;gap:8px}
.s-item{display:flex;align-items:center;gap:14px;background:#f7fbfd;border:1px solid #e2f0f6;border-radius:12px;padding:10px 16px}
.s-item .no{min-width:44px;height:44px;border-radius:12px;background:linear-gradient(135deg,#4d9fbf,#2f7fa5);color:#fff;font-size:22px;font-weight:900;display:flex;align-items:center;justify-content:center}
.s-item .nm{font-size:20px;font-weight:700;color:#2a5a70}

/* ===== 打印区（仅打印可见） ===== */
.print-area{display:none}
@media print{
  @page{size:A4;margin:15mm}
  body{background:#fff;padding:0}
  .wrap,.toast{display:none!important}
  .print-area{display:block}
  .p-title{font-size:20pt;font-weight:900;margin-bottom:14px;border-bottom:2px solid #222;padding-bottom:8px}
  .p-list{list-style:none}
  .p-list li{display:flex;align-items:center;gap:14px;padding:9px 4px;border-bottom:1px dashed #bbb;font-size:14pt}
  .p-list .no{font-size:16pt;font-weight:900;min-width:32pt;color:#222}
  .p-grid{display:flex;flex-wrap:wrap;gap:10px}
  .p-grid .chip{border:1.5px solid #222;border-radius:8px;padding:6px 14px;font-size:13pt;font-weight:700}
}

/* ===== 提示 ===== */
.toast{position:fixed;top:24px;left:50%;transform:translateX(-50%) translateY(-80px);padding:10px 26px;border-radius:22px;font-size:14px;font-weight:600;z-index:99;transition:all .3s;pointer-events:none;box-shadow:0 6px 18px rgba(0,0,0,.18)}
.toast.show{transform:translateX(-50%) translateY(0)}
.toast.ok{background:#38a169;color:#fff}
.toast.warn{background:#ff9800;color:#fff}
</style>
</head>
<body>

<div class="wrap">
  <header class="hero">
    <h1>🎯 抽签排序器</h1>
    <p>滚动抽人点名 · 不放回模式 · 全员随机排序</p>
  </header>

  <div class="layout">
    <!-- 左侧：名单管理 -->
    <div>
      <div class="panel">
        <div class="panel-title">📋 名单 <span class="count" id="nameCount">0 人</span></div>
        <textarea id="namesInput" placeholder="每行一个姓名，也可用逗号、顿号、空格分隔"></textarea>
        <div class="row">
          <button class="btn primary" onclick="applyNames()">✔ 应用名单</button>
          <button class="btn ghost" onclick="resetNames()">恢复示例</button>
        </div>
        <p class="hint" style="margin-top:8px">应用后自动保存到本机；更换名单会重置待抽池。</p>
      </div>
    </div>

    <!-- 右侧：两种模式 -->
    <div>
      <div class="tabs">
        <button class="tab active" id="tabDraw" onclick="switchTab('draw')">🎟 随机抽人</button>
        <button class="tab" id="tabSort" onclick="switchTab('sort')">🔀 全员排序</button>
      </div>

      <!-- 模式一：随机抽人 -->
      <div class="panel" id="drawArea">
        <div class="draw-box"><div class="draw-name" id="drawName">？</div></div>
        <div class="row center">
          <button class="btn primary big" id="btnDraw" onclick="startDraw()">🎲 开始抽签</button>
          <label class="switch-wrap"><input type="checkbox" id="noPutBack" onchange="toggleNoPutBack()"> 不放回（抽中即移出）</label>
        </div>
        <div class="pool-line" id="poolLine">剩余待抽：<b id="poolCount">0</b> 人
          <button class="btn small ghost" id="btnResetPool" style="display:none" onclick="resetPool()">↺ 重置名单池</button>
        </div>
        <div class="panel" style="margin-top:14px;background:#fbfdfe">
          <div class="panel-title">📜 抽中记录
            <span class="spacer"></span>
            <button class="btn small ghost" onclick="clearHistory()">清空</button>
            <button class="btn small" onclick="printHistory()">🖨 打印</button>
          </div>
          <div id="historyList" class="history"></div>
        </div>
      </div>

      <!-- 模式二：全员排序 -->
      <div class="panel" id="sortArea" style="display:none">
        <div class="row">
          <button class="btn primary big" id="btnOrder" onclick="makeOrder()">🔀 生成随机顺序</button>
          <button class="btn" onclick="printSort()">🖨 打印顺序表</button>
        </div>
        <p class="hint" style="margin-top:8px">适合演讲顺序、值日顺序、背诵顺序等场景，可反复点击重新洗牌。</p>
        <div id="sortList" class="sort-list"></div>
      </div>
    </div>
  </div>
</div>

<!-- 打印区：屏幕隐藏，打印时按当前内容生成 -->
<div id="printArea" class="print-area"></div>

<div class="toast" id="toast"></div>

<script>
// ===== 示例数据与本地存储键 =====
var DEFAULT_NAMES = ['王一诺','李思远','张沐宸','陈嘉懿','杨知夏','赵清妍','周子墨','吴依诺','徐煜城','孙语汐',
  '马皓轩','朱静姝','胡云帆','郭星辰','何雨泽','高梓萱','林亦辰','罗天佑','郑安然','梁知行',
  '谢明轩','宋佳琪','唐子豪','韩雨桐','冯若曦','曹铭轩','彭诗涵','董浩然','萧忆情','程锦航'];
var LS = {names:'cq_namesText', pool:'cq_pool', noBack:'cq_noputback', history:'cq_history', sorted:'cq_sorted'};

// ===== 全局状态 =====
var names = [];      // 全量名单
var pool = [];       // 当前待抽池（不放回模式会逐渐变小）
var drawHistory = [];    // 抽中记录 [{n:名字}]（避免遮蔽 window.history）
var sorted = [];     // 全员排序结果
var noBack = false;  // 不放回开关
var rolling = false; // 是否正在滚动动画
var rafId = 0;

// ===== 工具函数 =====
// HTML 转义：名单为用户输入，统一转义防止注入
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];});}
function lsGet(k,d){try{var v=localStorage.getItem(k);return v===null?d:JSON.parse(v);}catch(e){return d;}}
function lsSet(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
// 解析名单：支持换行/逗号/顿号/分号/空格分隔，去空去重
function parseNames(text){
  var seen = {}, out = [];
  String(text||'').split(/[\n\r,，、;；\t \u3000]+/).forEach(function(n){
    n = n.trim();
    if(n && !seen[n]){ seen[n] = 1; out.push(n); }
  });
  return out;
}
function shuffle(arr){
  for(var i = arr.length - 1; i > 0; i--){
    var j = Math.floor(Math.random() * (i + 1));
    var t = arr[i]; arr[i] = arr[j]; arr[j] = t;
  }
  return arr;
}
function toast(msg, type){
  var t = document.getElementById('toast');
  t.textContent = msg;
  t.className = 'toast show ' + (type || 'ok');
  clearTimeout(toast._tm);
  toast._tm = setTimeout(function(){ t.classList.remove('show'); }, 2400);
}

// ===== Web Audio 音效 =====
var audioCtx = null;
function getCtx(){
  if(!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  return audioCtx;
}
// 滚动嘀嗒声：短促低音量，模拟转轮
function playTick(){
  try{
    var ctx = getCtx(), now = ctx.currentTime;
    var o = ctx.createOscillator(), g = ctx.createGain();
    o.connect(g); g.connect(ctx.destination);
    o.type = 'square';
    o.frequency.setValueAtTime(720, now);
    g.gain.setValueAtTime(0.05, now);
    g.gain.exponentialRampToValueAtTime(0.005, now + 0.04);
    o.start(now); o.stop(now + 0.04);
  }catch(e){}
}
// 中签音：上行双音
function playWin(){
  try{
    var ctx = getCtx(), now = ctx.currentTime;
    [660, 880].forEach(function(f, i){
      var o = ctx.createOscillator(), g = ctx.createGain();
      o.connect(g); g.connect(ctx.destination);
      o.type = 'triangle';
      o.frequency.setValueAtTime(f, now + i * 0.12);
      g.gain.setValueAtTime(0.22, now + i * 0.12);
      g.gain.exponentialRampToValueAtTime(0.01, now + i * 0.12 + 0.3);
      o.start(now + i * 0.12); o.stop(now + i * 0.12 + 0.3);
    });
  }catch(e){}
}

// ===== 名单管理 =====
function applyNames(){
  names = parseNames(document.getElementById('namesInput').value);
  if(names.length < 2){ toast('请至少填写 2 个有效姓名', 'warn'); return; }
  pool = names.slice();          // 更换名单后重置待抽池
  lsSet(LS.names, document.getElementById('namesInput').value);
  lsSet(LS.pool, pool);
  sorted = [];
  lsSet(LS.sorted, sorted);
  renderSort();
  renderPool();
  document.getElementById('nameCount').textContent = names.length + ' 人';
  toast('名单已应用，共 ' + names.length + ' 人');
}
function resetNames(){
  document.getElementById('namesInput').value = DEFAULT_NAMES.join('\n');
  applyNames();
}

// ===== 模式切换 =====
function switchTab(m){
  document.getElementById('tabDraw').classList.toggle('active', m === 'draw');
  document.getElementById('tabSort').classList.toggle('active', m === 'sort');
  document.getElementById('drawArea').style.display = m === 'draw' ? '' : 'none';
  document.getElementById('sortArea').style.display = m === 'sort' ? '' : 'none';
}

// ===== 待抽池 =====
function renderPool(){
  var left = pool.length;
  document.getElementById('poolCount').textContent = left;
  var line = document.getElementById('poolLine');
  line.classList.toggle('full', noBack && left === 0);
  // 不放回模式抽完时，显示「重置名单池」按钮
  document.getElementById('btnResetPool').style.display = noBack ? '' : 'none';
  var btn = document.getElementById('btnDraw');
  if(left === 0){
    btn.disabled = true;
    btn.textContent = noBack ? '名单已抽完' : '请先应用名单';
  }else{
    btn.disabled = false;
    btn.textContent = '🎲 开始抽签';
  }
}
function toggleNoPutBack(){
  noBack = document.getElementById('noPutBack').checked;
  pool = names.slice();  // 切换模式时重置池，避免状态混乱
  lsSet(LS.noBack, noBack);
  lsSet(LS.pool, pool);
  renderPool();
}
function resetPool(){
  pool = names.slice();
  lsSet(LS.pool, pool);
  renderPool();
  toast('名单池已重置，共 ' + pool.length + ' 人');
}

// ===== 随机抽人：滚动减速动画 =====
function startDraw(){
  if(rolling || !pool.length) return;
  try{ getCtx().resume(); }catch(e){}
  // 提前随机决定中签者，动画只是展示过程，保证公平
  var winner = pool[Math.floor(Math.random() * pool.length)];
  rolling = true;
  var btn = document.getElementById('btnDraw');
  btn.disabled = true; btn.textContent = '滚动中…';
  var nameEl = document.getElementById('drawName');
  var start = performance.now(), DUR = 2400, last = 0, lastTick = 0;

  function frame(now){
    var t = (now - start) / DUR;   // 归一化进度 0~1
    if(t >= 1){
      // 动画结束：定格中签者并落账
      nameEl.textContent = winner;
      rolling = false;
      playWin();
      commitDraw(winner);
      return;
    }
    // 减速：名字切换间隔随进度平方增大（30ms → 约 450ms）
    var delay = 30 + t * t * 420;
    if(now - last >= delay){
      last = now;
      // 最后 0.5 秒直接预显示中签者，避免「跳过后再回跳」的突兀感
      var nm = (DUR - (now - start) < 500) ? winner : pool[Math.floor(Math.random() * pool.length)];
      nameEl.textContent = nm;
      // 限制嘀嗒声频率，避免高频滚动时声音过密
      if(now - lastTick > 70){ playTick(); lastTick = now; }
    }
    rafId = requestAnimationFrame(frame);
  }
  rafId = requestAnimationFrame(frame);
}
function commitDraw(winner){
  drawHistory.push({n: winner});
  lsSet(LS.history, drawHistory);
  if(noBack){
    var i = pool.indexOf(winner);
    if(i >= 0) pool.splice(i, 1);
    lsSet(LS.pool, pool);
  }
  renderPool();
  renderHistory();
}
function renderHistory(){
  var box = document.getElementById('historyList');
  if(!drawHistory.length){ box.innerHTML = '<div class="empty-tip">还没有抽签记录，点击「开始抽签」试试。</div>'; return; }
  box.innerHTML = drawHistory.map(function(h, i){
    var latest = i === drawHistory.length - 1 ? ' latest' : '';
    return '<span class="h-item' + latest + '"><span class="no">' + (i + 1) + '</span>' + esc(h.n) + '</span>';
  }).join('');
  box.parentElement.scrollTop = 0;
}
function clearHistory(){
  if(!drawHistory.length) return;
  drawHistory = [];
  lsSet(LS.history, drawHistory);
  renderHistory();
  toast('抽中记录已清空');
}

// ===== 全员排序 =====
function makeOrder(){
  if(names.length < 2){ toast('请先在左侧应用名单', 'warn'); return; }
  try{ getCtx().resume(); }catch(e){}
  sorted = shuffle(names.slice());
  lsSet(LS.sorted, sorted);
  renderSort();
  playWin();
}
function renderSort(){
  var box = document.getElementById('sortList');
  if(!sorted.length){ box.innerHTML = ''; return; }
  box.innerHTML = sorted.map(function(nm, i){
    return '<div class="s-item"><span class="no">' + (i + 1) + '</span><span class="nm">' + esc(nm) + '</span></div>';
  }).join('');
}

// ===== 打印 =====
// 打印前根据当前数据生成打印区内容（历史与顺序表任一有内容即打印）
function printHistory(){
  if(!drawHistory.length){ toast('暂无抽中记录可打印', 'warn'); return; }
  buildPrint('抽中记录', drawHistory.map(function(h){ return h.n; }), true);
  window.print();
}
function printSort(){
  if(!sorted.length){ toast('请先生成随机顺序', 'warn'); return; }
  buildPrint('随机顺序表', sorted, false);
  window.print();
}
function buildPrint(title, list, chipStyle){
  var inner;
  if(chipStyle){
    inner = '<div class="p-grid">' + list.map(function(nm, i){
      return '<span class="chip">' + (i + 1) + '. ' + esc(nm) + '</span>';
    }).join('') + '</div>';
  }else{
    inner = '<ol class="p-list">' + list.map(function(nm, i){
      return '<li><span class="no">' + (i + 1) + '</span><span>' + esc(nm) + '</span></li>';
    }).join('') + '</ol>';
  }
  document.getElementById('printArea').innerHTML =
    '<div class="p-title">' + esc(title) + '（共 ' + list.length + ' 人）</div>' + inner;
}

// ===== 初始化 =====
function init(){
  document.getElementById('namesInput').value = lsGet(LS.names, DEFAULT_NAMES.join('\n'));
  names = parseNames(document.getElementById('namesInput').value);
  noBack = !!lsGet(LS.noBack, false);
  document.getElementById('noPutBack').checked = noBack;
  // 恢复不放回池；若本地池数据不合法则回退全量名单
  var saved = lsGet(LS.pool, null);
  pool = (Array.isArray(saved) && saved.every(function(n){ return names.indexOf(n) >= 0; })) ? saved : names.slice();
  drawHistory = lsGet(LS.history, []);
  sorted = lsGet(LS.sorted, []);
  document.getElementById('nameCount').textContent = names.length + ' 人';
  renderPool();
  renderHistory();
  renderSort();
}
init();
</script>
</body>
</html>
