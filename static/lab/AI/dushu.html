<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>阅读打卡表 · 21天/30天阅读记录表 A4 打印 | 当以读书通世事</title>
<link rel="canonical" href="https://www.sakaay.com/lab/AI/dushu.html">
<meta name="description" content="阅读打卡表生成器：填写书名、姓名与起始日期，一键生成 21 天 / 30 天阅读记录表，每天一格勾选打卡并记录阅读时长，附班级阅读排行榜与 A4 打印。支持自定义记录天数与阅读目标，完成后可打印成班级阅读墙，适合整本书共读与假期阅读计划。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#20302c;--muted:#6b7a78;--line:#e3ebe8;
  --brand:#2f7d6e;--brand-d:#26695b;--brand-l:#eaf4f1;
  --bg:#f2f6f4;--card:#fff;
}
body{font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.app{display:flex;gap:18px;padding:18px;max-width:1400px;margin:0 auto;align-items:flex-start}

/* ===== 左侧控制面板 ===== */
.panel{width:340px;flex:0 0 340px;background:var(--card);border-radius:16px;padding:18px;box-shadow:0 6px 24px rgba(20,50,45,.08);position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto}
.panel h2{font-size:16px;font-weight:700;margin-bottom:4px}
.panel .sub{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.6}
.field{margin-bottom:14px}
.field>label{display:block;font-size:13px;font-weight:600;color:#40514e;margin-bottom:7px}
.field>label .count{font-weight:400;color:var(--muted);font-size:12px;margin-left:4px}
.row2{display:flex;gap:10px}
.row2 .field{flex:1}
input[type=text],input[type=date],input[type=number],textarea{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:14px;font-family:inherit;outline:none;color:var(--ink);background:#fbfdfc;transition:border-color .18s}
input[type=text]:focus,input[type=date]:focus,input[type=number]:focus,textarea:focus{border-color:var(--brand)}
textarea{min-height:110px;resize:vertical;line-height:1.7;font-size:13.5px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:66px;padding:8px 6px;border:1px solid var(--line);background:#fbfdfc;border-radius:9px;font-size:13px;color:#5a6b68;cursor:pointer;transition:all .18s;font-family:inherit}
.seg button:hover{border-color:#bcd6d0}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:#40514e;cursor:pointer;padding:5px 0}
.check input{width:16px;height:16px;accent-color:var(--brand);cursor:pointer}
.hint{font-size:12px;color:var(--muted);line-height:1.6;margin-top:6px}
.actions{display:flex;gap:8px;margin-top:2px}
.actions .btn{flex:1}
.btn{padding:11px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .18s}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-d)}
.btn.ghost{background:#f0f4f3;color:#5a6b68}
.btn.ghost:hover{background:#e5ecea}
.btn.small{padding:8px;font-size:13px}
.tip{margin-top:12px;font-size:12px;color:#4c615c;line-height:1.75;background:var(--brand-l);border-radius:9px;padding:9px 11px}

/* ===== 右侧预览区 ===== */
.preview{flex:1;min-width:0;overflow:auto;padding-bottom:40px}
.papers{display:flex;flex-direction:column;align-items:center;gap:18px}
.paper{width:210mm;min-height:297mm;background:#fff;padding:12mm 13mm 9mm;border-radius:2mm;box-shadow:0 10px 34px rgba(20,50,45,.16);display:flex;flex-direction:column}
.sheet-head{border-bottom:.4mm solid #cfdbd7;padding-bottom:3mm;margin-bottom:3.5mm}
.sheet-head h1{font-size:7mm;letter-spacing:2mm;text-align:center;font-weight:700;color:#1d2b27}
.info{display:flex;flex-wrap:wrap;justify-content:center;gap:2mm 6mm;font-size:3.4mm;color:#3b4a46;margin-top:3mm}
.info .val{display:inline-block;min-width:22mm;padding:0 1mm;text-align:center;border-bottom:.3mm solid #b9c6c2;font-weight:600}
.info .label{color:#6b7a78}

/* 日历网格 */
.grid{display:grid;grid-template-columns:repeat(7,1fr);gap:1.8mm;flex:0 0 auto}
.wd{height:6mm;display:flex;align-items:center;justify-content:center;font-size:2.9mm;color:#6b7a78;font-weight:600;letter-spacing:.4mm}
.day{border:.35mm solid #bccfc9;border-radius:1.4mm;height:var(--ch,30mm);padding:1.4mm 1.6mm;display:flex;flex-direction:column;gap:1mm;background:#fcfdfc;position:relative;box-sizing:border-box}
.day.ghost{border-style:dashed;border-color:#e6eeea;background:#fff}
.day.done{background:#f0f8f4;border-color:#8fc3b2}
.dh{display:flex;justify-content:space-between;align-items:baseline;font-size:2.8mm;color:#5d6e6a;line-height:1.2}
.dh .dn{font-weight:700;color:#3c4f4a}
.dh .dd{font-size:2.5mm;color:#879793}
.db{flex:1;display:flex;align-items:center;justify-content:center;gap:1.2mm}
.tick{width:4.6mm;height:4.6mm;flex:0 0 4.6mm;border:.3mm solid #9cadA8;border-radius:.8mm;display:flex;align-items:center;justify-content:center;font-size:3.2mm;line-height:1;color:var(--brand-d);cursor:pointer;user-select:none;background:#fff}
.tick.done{background:#dff0e8;border-color:#7fb7a4}
.min{width:11mm;border:none;border-bottom:.25mm solid #a9bbb6;background:transparent;font-family:inherit;font-size:2.7mm;text-align:center;color:#33443f;outline:none;padding:0 0 .4mm}
.min:focus{border-bottom-color:var(--brand)}
.unit{font-size:2.5mm;color:#7c8b87}
.legend{margin-top:3mm;font-size:2.7mm;color:#7c8b87;line-height:1.6}

/* 底部统计 */
.sheet-foot{margin-top:auto;padding-top:4mm;border-top:.3mm dashed #d4e0db;display:flex;justify-content:space-between;align-items:flex-end;gap:6mm}
.stat{font-size:4mm;color:#2c3d39}
.stat .num{display:inline-block;min-width:11mm;text-align:center;font-weight:700;color:var(--brand-d);border-bottom:.3mm solid #b9c6c2;font-size:4.2mm}
.quote{font-size:3.3mm;color:#5e716c;font-style:italic;text-align:right;line-height:1.6;max-width:80mm}

/* 排行榜（横向页面） */
.paper.board{width:297mm;min-height:210mm;padding:10mm 12mm}
.paper.board .sheet-head{margin-bottom:2.5mm;padding-bottom:2mm}
.paper.board h1{font-size:5.6mm;letter-spacing:1.5mm}
.paper.board .info{font-size:3mm;margin-top:1.6mm}
.bt{width:100%;table-layout:fixed;border-collapse:collapse}
.bt th,.bt td{border:.28mm solid #8d9d99;text-align:center;font-size:var(--bfs,3mm);line-height:1.3;color:#26332f;padding:.6mm .3mm;word-break:break-all}
.bt thead th{height:7mm;background:#eef4f1;font-weight:700;font-size:calc(var(--bfs,3mm) * .95)}
.bt tbody td{height:var(--rh,5mm)}
.bt td.name{text-align:left;padding-left:1.5mm;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bt td.no{color:#6b7a78;font-size:calc(var(--bfs,3mm) * .9)}
.bt td.sum{background:#f7faf8}

.empty{width:210mm;min-height:120mm;background:#fff;border-radius:14px;box-shadow:0 6px 24px rgba(20,50,45,.1);display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:14px;text-align:center}

/* ===== 移动端 ===== */
@media (max-width:900px){
  .app{flex-direction:column;padding:12px;gap:12px}
  .panel{width:100%;flex:none;position:static;max-height:none}
  .preview{width:100%;overflow-x:auto}
  .empty{width:100%}
}

/* ===== 打印 ===== */
@media print{
  @page{size:A4 portrait;margin:10mm}
  @page board{size:A4 landscape;margin:8mm}
  html,body{background:#fff}
  .app{display:block;padding:0;margin:0;max-width:none}
  .panel,.empty{display:none!important}
  .preview{display:block;padding:0;overflow:visible}
  .papers{display:block;gap:0}
  .paper{width:auto;height:auto;min-height:274mm;padding:0;margin:0;box-shadow:none;border-radius:0}
  .paper + .paper{break-before:page;page-break-before:always}
  .paper.board{page:board;width:auto;min-height:auto;height:auto;padding:0}
  .day,.bt tr{page-break-inside:avoid;break-inside:avoid}
  .min{border-bottom:.25mm solid #98a8a4}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>
<body>
<h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">阅读打卡表 · 21 天 / 30 天阅读记录</h1>
<div class="app">
  <aside class="panel">
    <h2>阅读打卡表</h2>
    <p class="sub">填好书名和姓名，生成一张可打印的阅读打卡纸。所有内容只存在你的浏览器里。</p>

    <div class="field">
      <label for="dTitle">标题</label>
      <input type="text" id="dTitle" placeholder="阅读打卡记录">
    </div>

    <div class="row2">
      <div class="field">
        <label for="dName">学生姓名</label>
        <input type="text" id="dName" placeholder="如：张雨萱">
      </div>
      <div class="field">
        <label for="dBook">书名</label>
        <input type="text" id="dBook" placeholder="如：窗边的小豆豆">
      </div>
    </div>

    <div class="field">
      <label>打卡周期</label>
      <div class="seg" id="daysSeg">
        <button type="button" data-days="21" class="on">21 天</button>
        <button type="button" data-days="30">30 天</button>
        <button type="button" data-days="custom">自定义</button>
      </div>
    </div>

    <div class="field" id="customField" hidden>
      <label for="dDays">自定义天数（1~60）</label>
      <input type="number" id="dDays" min="1" max="60" step="1" value="45">
    </div>

    <div class="field">
      <label for="dStart">起始日期</label>
      <input type="date" id="dStart">
    </div>

    <div class="field">
      <label class="check"><input type="checkbox" id="leaderOn"> 同时生成班级阅读排行榜</label>
    </div>

    <div class="field" id="leaderField" hidden>
      <label for="classNames">班级名单<span class="count" id="classCount"></span></label>
      <textarea id="classNames" spellcheck="false" placeholder="每行一个学生姓名，留空则生成 20 行空白"></textarea>
      <p class="hint">排行榜为 A4 横向页面，列号为每日打卡，适合全班张贴。</p>
    </div>

    <div class="actions">
      <button class="btn primary" id="btnGenerate" type="button">生成打卡表</button>
      <button class="btn ghost" id="btnPrint" type="button">打印 A4</button>
    </div>
    <div class="actions">
      <button class="btn ghost small" id="btnQuote" type="button">换一句鼓励语</button>
      <button class="btn ghost small" id="btnReset" type="button">恢复默认</button>
    </div>

    <div class="tip">
      屏幕上的小方格可以点一下打勾，格内还能直接填当天阅读分钟数，底部统计会自动累计；打印出来也能用笔手写。
    </div>
  </aside>

  <main class="preview">
    <div class="papers" id="papers"></div>
  </main>
</div>

<script>
(function(){
'use strict';

var KEY = 'dushu.v1';
var QUOTES = [
  '每天读一点，日子就有了光。',
  '书页翻过的地方，都会变成你的底气。',
  '坚持打卡，把好习惯读进骨子里。',
  '今天的十分钟，是明天的底气。',
  '读书不觉已春深，一寸光阴一寸金。',
  '把书读薄，把自己读厚。',
  '慢慢读，比较快。',
  '一天一页，一年就是一本厚厚的自己。'
];

function $(id){ return document.getElementById(id); }

function esc(s){
  return String(s).replace(/[&<>"']/g, function(c){
    return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
  });
}

function pad2(n){ return n < 10 ? '0' + n : String(n); }

/* 日期格式：2026.11.04 */
function fmtDot(d){
  return d.getFullYear() + '.' + pad2(d.getMonth() + 1) + '.' + pad2(d.getDate());
}

function addDays(d, n){
  var x = new Date(d.getTime());
  x.setDate(x.getDate() + n);
  return x;
}

/* 今天的本地日期字符串，用于 date 输入框 */
function todayStr(){
  var d = new Date();
  return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
}

var els = {
  dTitle: $('dTitle'),
  dName: $('dName'),
  dBook: $('dBook'),
  daysSeg: $('daysSeg'),
  customField: $('customField'),
  dDays: $('dDays'),
  dStart: $('dStart'),
  leaderOn: $('leaderOn'),
  leaderField: $('leaderField'),
  classNames: $('classNames'),
  classCount: $('classCount'),
  btnGenerate: $('btnGenerate'),
  btnPrint: $('btnPrint'),
  btnQuote: $('btnQuote'),
  btnReset: $('btnReset'),
  papers: $('papers')
};

var DEFAULTS = {
  title: '阅读打卡记录',
  name: '',
  book: '',
  days: 21,
  start: '',
  leaderOn: false,
  classText: '',
  quoteIndex: 0,
  checks: {},
  minutes: {}
};

var state = loadState();

function loadState(){
  var base = {
    title: DEFAULTS.title,
    name: DEFAULTS.name,
    book: DEFAULTS.book,
    days: DEFAULTS.days,
    start: todayStr(),
    leaderOn: DEFAULTS.leaderOn,
    classText: DEFAULTS.classText,
    quoteIndex: 0,
    checks: {},
    minutes: {}
  };
  try{
    var raw = localStorage.getItem(KEY);
    if(raw){
      var o = JSON.parse(raw);
      ['title','name','book','classText','start'].forEach(function(k){
        if(typeof o[k] === 'string') base[k] = o[k];
      });
      if(typeof o.days === 'number' && o.days >= 1 && o.days <= 60) base.days = Math.floor(o.days);
      if(typeof o.leaderOn === 'boolean') base.leaderOn = o.leaderOn;
      if(typeof o.quoteIndex === 'number') base.quoteIndex = o.quoteIndex % QUOTES.length;
      if(o.checks && typeof o.checks === 'object') base.checks = o.checks;
      if(o.minutes && typeof o.minutes === 'object') base.minutes = o.minutes;
    }
  }catch(e){
    console.warn('读取本地设置失败：', e);
  }
  return base;
}

function saveState(){
  try{
    localStorage.setItem(KEY, JSON.stringify(state));
  }catch(e){
    /* 隐私模式写入失败时忽略 */
  }
}

var saveTimer = null;
function saveLater(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(saveState, 250);
}

/* 文本为空时输出下划线空位 */
function valOrBlank(v, blankLen){
  var t = String(v || '').trim();
  if(!t){
    return new Array((blankLen || 6) + 1).join('&nbsp;');
  }
  return esc(t);
}

function parseClassNames(){
  return state.classText.split(/[\n\r,，、;；]+/).map(function(s){
    return s.trim();
  }).filter(function(s){ return s.length > 0; });
}

/* ===== 主打卡页 ===== */
function renderCalendar(){
  var start = new Date(state.start + 'T00:00:00');
  if(isNaN(start.getTime())) start = new Date();
  var days = state.days;

  /* 周一为一周第一天：0=周一 … 6=周日 */
  var offset = (start.getDay() + 6) % 7;
  var rows = Math.ceil((offset + days) / 7);

  /* 根据行数压缩格高，保证一张 A4 放下 */
  var cellH = Math.min(44, Math.max(14, Math.floor(198 / rows)));

  var wd = ['周一','周二','周三','周四','周五','周六','周日'].map(function(t){
    return '<div class="wd">' + t + '</div>';
  }).join('');

  var cells = '';
  for(var g = 0; g < offset; g++){
    cells += '<div class="day ghost"></div>';
  }

  for(var i = 1; i <= days; i++){
    var date = addDays(start, i - 1);
    var done = !!state.checks[String(i)];
    var mins = state.minutes[String(i)] || '';
    cells += '<div class="day' + (done ? ' done' : '') + '">' +
      '<div class="dh"><span class="dn">第 ' + i + ' 天</span><span class="dd">' +
        (date.getMonth() + 1) + '.' + date.getDate() + '</span></div>' +
      '<div class="db">' +
        '<span class="tick' + (done ? ' done' : '') + '" data-day="' + i + '" role="button" tabindex="0" aria-label="第 ' + i + ' 天打卡">' + (done ? '✓' : '') + '</span>' +
        '<input class="min" data-day="' + i + '" value="' + esc(String(mins)) + '" inputmode="numeric" maxlength="4" aria-label="第 ' + i + ' 天阅读分钟数">' +
        '<span class="unit">分</span>' +
      '</div>' +
    '</div>';
  }

  /* 补齐最后一行空位，保证网格整齐 */
  var used = offset + days;
  for(var t = used; t % 7 !== 0; t++){
    cells += '<div class="day ghost"></div>';
  }

  var endDate = addDays(start, days - 1);
  var quote = QUOTES[state.quoteIndex % QUOTES.length];

  return '<div class="paper">' +
    '<div class="sheet-head">' +
      '<h1>' + esc(state.title.trim() || '阅读打卡记录') + '</h1>' +
      '<div class="info">' +
        '<span><span class="label">书名：</span><span class="val">' + valOrBlank(state.book ? '《' + state.book.trim() + '》' : '', 10) + '</span></span>' +
        '<span><span class="label">姓名：</span><span class="val">' + valOrBlank(state.name, 6) + '</span></span>' +
        '<span><span class="label">开始日期：</span><span class="val">' + fmtDot(start) + '</span></span>' +
        '<span><span class="label">共：</span><span class="val">' + days + ' 天（至 ' + fmtDot(endDate) + '）</span></span>' +
      '</div>' +
    '</div>' +
    '<div class="grid" style="--ch:' + cellH + 'mm">' + wd + cells + '</div>' +
    '<div class="legend">说明：每天完成阅读后在小方格里打勾，并在横线上写下当天阅读分钟数；底部统计由老师或家长核对填写。</div>' +
    '<div class="sheet-foot">' +
      '<div class="stat">共读 <span class="num" data-stat="days">____</span> 天，累计 <span class="num" data-stat="min">____</span> 分钟</div>' +
      '<div class="quote">' + esc(quote) + '</div>' +
    '</div>' +
  '</div>';
}

/* ===== 排行榜页（横向，学生为行、日期为列） ===== */
function renderBoards(){
  var names = parseClassNames();
  var rowsCount = names.length || 20;
  var days = state.days;
  var maxCols = 31;                       /* 一页最多放 31 天列 */
  var chunkSize = Math.min(days, maxCols);
  var chunks = Math.ceil(days / chunkSize);

  /* 行高按人数压缩，保证一页放下 */
  var rowH = Math.min(6, Math.max(3.6, 150 / rowsCount));

  var html = '';
  for(var c = 0; c < chunks; c++){
    var from = c * chunkSize + 1;
    var to = Math.min(days, (c + 1) * chunkSize);
    var colCount = to - from + 1;

    var dayHead = '';
    for(var d = from; d <= to; d++){
      dayHead += '<th>' + d + '</th>';
    }

    /* 列宽：序号 4%、姓名 15%、合计 7%，其余平分 */
    var dayW = (100 - 4 - 15 - 7) / colCount;
    var cols = '<col style="width:4%"><col style="width:15%">';
    for(var k = 0; k < colCount; k++) cols += '<col style="width:' + dayW.toFixed(2) + '%">';
    cols += '<col style="width:7%">';

    var body = '';
    for(var r = 0; r < rowsCount; r++){
      var nm = names[r] || '';
      body += '<tr><td class="no">' + (r + 1) + '</td><td class="name">' + esc(nm) +
        '</td>' + new Array(colCount + 1).join('<td></td>') + '<td class="sum"></td></tr>';
    }

    var start = new Date(state.start + 'T00:00:00');
    var titleInfo = '《' + (state.book.trim() || '　　　　') + '》　第 ' + from + '–' + to + ' 天 ' +
      (isNaN(start.getTime()) ? '' : '（' + fmtDot(addDays(start, from - 1)) + ' 起）') +
      '　列号为打卡天数，完成后在格内打勾，合计栏写总天数';

    html += '<div class="paper board">' +
      '<div class="sheet-head">' +
        '<h1>班级阅读排行榜</h1>' +
        '<div class="info"><span>' + esc(titleInfo) + '</span></div>' +
      '</div>' +
      '<table class="bt" style="--rh:' + rowH.toFixed(2) + 'mm;--bfs:2.8mm">' +
        '<colgroup>' + cols + '</colgroup>' +
        '<thead><tr><th>序</th><th>姓名</th>' + dayHead + '<th>合计</th></tr></thead>' +
        '<tbody>' + body + '</tbody>' +
      '</table>' +
      '<div class="legend">共 ' + rowsCount + ' 人参与记录；每页最多 31 天，超过则自动续页。</div>' +
    '</div>';
  }
  return html;
}

function render(){
  var html = renderCalendar();
  if(state.leaderOn) html += renderBoards();
  els.papers.innerHTML = html;

  /* 周期按钮与自定义输入联动 */
  var mode = state.days === 21 ? '21' : (state.days === 30 ? '30' : 'custom');
  markSeg(els.daysSeg, mode);
  els.customField.hidden = mode !== 'custom';
  els.dDays.value = state.days;
  els.leaderField.hidden = !state.leaderOn;
  els.classCount.textContent = parseClassNames().length + ' 人';

  updateStats();
}

function markSeg(container, mode){
  var btns = container.querySelectorAll('button');
  for(var i = 0; i < btns.length; i++){
    btns[i].classList.toggle('on', btns[i].dataset.days === mode);
  }
}

/* 统计：屏幕打勾与分钟数自动累计；没有数据时显示待填下划线 */
function updateStats(){
  var days = 0;
  var mins = 0;
  for(var i = 1; i <= state.days; i++){
    if(state.checks[String(i)]) days++;
    var m = parseFloat(state.minutes[String(i)]);
    if(!isNaN(m)) mins += m;
  }
  var dEl = els.papers.querySelector('[data-stat="days"]');
  var mEl = els.papers.querySelector('[data-stat="min"]');
  if(dEl) dEl.textContent = days ? String(days) : '____';
  if(mEl) mEl.textContent = mins ? String(mins) : '____';
}

/* ===== 事件绑定 ===== */
els.dTitle.addEventListener('input', function(){
  state.title = els.dTitle.value;
  saveLater();
  render();
});

els.dName.addEventListener('input', function(){
  state.name = els.dName.value;
  saveLater();
  render();
});

els.dBook.addEventListener('input', function(){
  state.book = els.dBook.value;
  saveLater();
  render();
});

els.dStart.addEventListener('change', function(){
  if(!els.dStart.value) return;
  state.start = els.dStart.value;
  saveState();
  render();
});

els.daysSeg.addEventListener('click', function(e){
  var btn = e.target.closest('button[data-days]');
  if(!btn) return;
  var v = btn.dataset.days;
  if(v === 'custom'){
    /* 从 21/30 天切到自定义时给一个 45 天的起点，其余情况保留原天数 */
    if(state.days === 21 || state.days === 30) state.days = 45;
  }else{
    state.days = parseInt(v, 10);
  }
  saveState();
  render();
});

els.dDays.addEventListener('change', function(){
  var v = parseInt(els.dDays.value, 10);
  if(isNaN(v)) v = 21;
  v = Math.max(1, Math.min(60, v));
  state.days = v;
  els.dDays.value = v;
  saveState();
  render();
});

els.leaderOn.addEventListener('change', function(){
  state.leaderOn = els.leaderOn.checked;
  saveState();
  render();
});

els.classNames.addEventListener('input', function(){
  state.classText = els.classNames.value;
  els.classCount.textContent = parseClassNames().length + ' 人';
  saveLater();
  render();
});

/* 打勾 */
els.papers.addEventListener('click', function(e){
  var tick = e.target.closest('.tick');
  if(!tick) return;
  var day = tick.dataset.day;
  if(state.checks[day]){
    delete state.checks[day];
  }else{
    state.checks[day] = true;
  }
  var done = !!state.checks[day];
  tick.classList.toggle('done', done);
  tick.textContent = done ? '✓' : '';
  var cell = tick.closest('.day');
  if(cell) cell.classList.toggle('done', done);
  saveState();
  updateStats();
});

/* 键盘也能打勾 */
els.papers.addEventListener('keydown', function(e){
  if(e.key !== 'Enter' && e.key !== ' ') return;
  var tick = e.target.closest ? e.target.closest('.tick') : null;
  if(!tick) return;
  e.preventDefault();
  tick.click();
});

/* 分钟数输入 */
els.papers.addEventListener('input', function(e){
  var inp = e.target;
  if(!inp.classList || !inp.classList.contains('min')) return;
  var day = inp.dataset.day;
  var v = inp.value.replace(/[^\d]/g, '').slice(0, 4);
  if(v !== inp.value) inp.value = v;
  if(v) state.minutes[day] = parseInt(v, 10);
  else delete state.minutes[day];
  saveState();
  updateStats();
});

els.btnGenerate.addEventListener('click', function(){
  render();
});

els.btnPrint.addEventListener('click', function(){
  window.print();
});

els.btnQuote.addEventListener('click', function(){
  state.quoteIndex = (state.quoteIndex + 1) % QUOTES.length;
  saveState();
  render();
});

els.btnReset.addEventListener('click', function(){
  if(!confirm('确定恢复默认设置？打卡记录也会一起清空。')) return;
  state = {
    title: DEFAULTS.title,
    name: DEFAULTS.name,
    book: DEFAULTS.book,
    days: DEFAULTS.days,
    start: todayStr(),
    leaderOn: false,
    classText: '',
    quoteIndex: 0,
    checks: {},
    minutes: {}
  };
  saveState();
  syncInputs();
  render();
});

/* ===== 初始化 ===== */
function syncInputs(){
  els.dTitle.value = state.title;
  els.dName.value = state.name;
  els.dBook.value = state.book;
  els.dStart.value = state.start;
  els.dDays.value = state.days;
  els.leaderOn.checked = state.leaderOn;
  els.classNames.value = state.classText;
}

syncInputs();
render();

})();
</script>
</body>
</html>
