<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>听写播报器 · 语文词语自动报听写/语音朗读 | 当以读书通世事</title>
<link rel="canonical" href="https://www.sakaay.com/lab/AI/tingxie.html">
<meta name="description" content="在线听写播报器：粘贴词语清单即可自动语音报听写，可调节词语间隔、朗读遍数与语速，支持暂停、跳过、重读与序号播报，屏幕不显示当前词语防止学生偷看。支持中英文词语、句子与课文段落播报，可设置随机顺序，适合语文课堂听写与家庭听写练习。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'PingFang SC','Microsoft YaHei',sans-serif;background:#e9efe9;color:#333;height:100vh;display:flex;overflow:hidden}

/* ===== 左侧配置面板 ===== */
.sidebar{width:330px;flex-shrink:0;background:#fff;box-shadow:2px 0 14px rgba(0,0,0,.07);padding:16px;overflow-y:auto;z-index:5}
.logo{font-size:18px;font-weight:700;color:#2e6e4e;display:flex;align-items:center;gap:8px;margin-bottom:12px}
.sec{margin-bottom:12px;padding:12px;background:#f5faf5;border:1px solid #e2ede2;border-radius:12px}
.sec-title{font-size:13px;font-weight:700;color:#2e6e4e;margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
.sec-title .cnt{font-size:12px;color:#8a9a8a;font-weight:400}
textarea{width:100%;min-height:170px;padding:10px;border:1.5px solid #cfe0cf;border-radius:8px;font-size:14px;line-height:1.7;resize:vertical;background:#fff}
.hint{font-size:11px;color:#a5b3a5;margin-top:5px;line-height:1.5}
/* 滑块行 */
.slider-row{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.slider-row label{font-size:13px;color:#444;width:76px;flex-shrink:0}
.slider-row output{font-size:13px;font-weight:700;color:#2e6e4e;width:46px;text-align:right;flex-shrink:0}
input[type=range]{flex:1;accent-color:#2e6e4e;cursor:pointer}
/* 遍数分段 */
.seg{display:flex;gap:6px}
.seg label{flex:1;text-align:center;padding:6px 0;border:1.5px solid #d5e3d5;border-radius:8px;cursor:pointer;font-size:13px;background:#fff;transition:all .15s}
.seg label:has(input:checked){background:#2e6e4e;border-color:#2e6e4e;color:#fff;font-weight:600}
.seg input{display:none}
/* 序号播报开关 */
.opt-row{display:flex;align-items:center;gap:6px;font-size:13px;color:#444;cursor:pointer}

/* ===== 按钮区 ===== */
.ctrl-grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px}
.cbtn{padding:10px 0;border:none;border-radius:12px;font-size:14px;font-weight:700;cursor:pointer;transition:all .2s;color:#fff}
.cbtn:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 10px rgba(0,0,0,.15)}
.cbtn:disabled{opacity:.4;cursor:not-allowed}
.cbtn.start{grid-column:span 3;background:linear-gradient(135deg,#2e6e4e,#3f9468);font-size:16px;padding:13px 0}
.cbtn.pause{background:#e8a13c}
.cbtn.resume{background:#3f9468}
.cbtn.stop{background:#d95f5f}
.cbtn.skip{background:#5b7fd4}
.cbtn.reprev{background:#8a6fc4}

/* 不支持提示 */
.no-speech{display:none;margin-bottom:12px;padding:10px 12px;background:#fdeeee;border:1px solid #f2c8c8;border-radius:10px;font-size:12px;color:#b03a3a;line-height:1.6}

/* ===== 右侧大屏播报区 ===== */
.stage{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:26px;background:linear-gradient(160deg,#f2f8f2 0%,#e7f0fa 100%);overflow:auto;padding:30px}
.st-status{font-size:16px;color:#7d8f7d;letter-spacing:2px;padding:6px 22px;border-radius:20px;background:rgba(255,255,255,.75)}
.st-count{font-size:min(11vw,88px);font-weight:800;color:#2e6e4e;letter-spacing:4px;text-align:center;line-height:1.2}
.st-count .dim{color:#9db4a4}
/* 倒计时圆环 */
.ring-wrap{position:relative;width:min(30vw,230px);height:min(30vw,230px)}
.ring-wrap svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring-bg{fill:none;stroke:#d8e6da;stroke-width:9}
.ring-fg{fill:none;stroke:#3f9468;stroke-width:9;stroke-linecap:round;stroke-dasharray:609.47;stroke-dashoffset:0;transition:stroke-dashoffset .12s linear}
.ring-num{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-size:min(9vw,64px);font-weight:800;color:#3f9468}
/* 完成提示 */
.st-done{display:none;font-size:min(8vw,56px);font-weight:800;color:#d9962e;letter-spacing:6px;animation:pop .5s ease}
.st-done.show{display:block}
@keyframes pop{0%{transform:scale(.4);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}

.toast{position:fixed;bottom:26px;left:50%;transform:translateX(-50%) translateY(10px);background:#2e6e4e;color:#fff;padding:10px 22px;border-radius:22px;font-size:14px;opacity:0;transition:all .3s;pointer-events:none;z-index:99}
.toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

@media(max-width:860px){
  body{flex-direction:column;overflow:auto;height:auto}
  .sidebar{width:100%;box-shadow:none;border-bottom:2px solid #dce8dc}
  .stage{min-height:80vh}
}
</style>
</head>
<body>
<h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">听写播报器</h1>

<!-- 左侧配置面板 -->
<aside class="sidebar">
  <div class="logo">🔊 听写播报器</div>

  <!-- 浏览器兼容提示 -->
  <div class="no-speech" id="noSpeech">⚠️ 当前浏览器不支持语音合成功能，无法播报听写。建议使用 <b>Chrome</b> 或 <b>Edge</b> 浏览器打开本页面。</div>

  <!-- 词表输入 -->
  <div class="sec">
    <div class="sec-title">📝 词表 <span class="cnt" id="wordCnt">共 0 词</span></div>
    <textarea id="wordsInput" spellcheck="false" placeholder="每行一个词语，支持带编号（如 1.春天），编号会自动剥离"></textarea>
    <div class="hint">词表自动保存到本机浏览器；播报时屏幕大字只显示进度，不显示词语内容，防止学生偷看。</div>
  </div>

  <!-- 播报参数 -->
  <div class="sec">
    <div class="sec-title">⚙️ 播报参数</div>
    <div class="slider-row">
      <label>词语间隔</label>
      <input type="range" id="intervalSlider" min="3" max="15" step="1" value="6">
      <output id="intervalVal">6 秒</output>
    </div>
    <div class="slider-row">
      <label>语速</label>
      <input type="range" id="rateSlider" min="0.5" max="1.5" step="0.1" value="1">
      <output id="rateVal">1.0</output>
    </div>
    <div style="margin-bottom:8px;font-size:13px;color:#444">每词读几遍</div>
    <div class="seg" id="timesSeg">
      <label><input type="radio" name="times" value="1"><span>1 遍</span></label>
      <label><input type="radio" name="times" value="2"><span>2 遍</span></label>
      <label><input type="radio" name="times" value="3"><span>3 遍</span></label>
    </div>
    <div style="margin-top:10px">
      <label class="opt-row"><input type="checkbox" id="announceIdx"> 播报序号（每个词前读"第 N 个"）</label>
    </div>
  </div>

  <!-- 播报控制 -->
  <div class="ctrl-grid">
    <button class="cbtn start" id="btnStart">▶ 开始听写</button>
    <button class="cbtn pause" id="btnPause" disabled>⏸ 暂停</button>
    <button class="cbtn resume" id="btnResume" disabled>▶️ 继续</button>
    <button class="cbtn stop" id="btnStop" disabled>⏹ 停止</button>
    <button class="cbtn skip" id="btnSkip" disabled>⏭ 跳过当前</button>
    <button class="cbtn reprev" id="btnReprev" disabled>↺ 重读上一个</button>
  </div>
</aside>

<!-- 右侧播报大屏 -->
<main class="stage">
  <div class="st-status" id="stStatus">待开始</div>
  <div class="st-count" id="stCount"><span class="dim">第 — 个</span> / 共 0 个</div>
  <div class="ring-wrap">
    <svg viewBox="0 0 220 220">
      <circle class="ring-bg" cx="110" cy="110" r="97"></circle>
      <circle class="ring-fg" id="ringFg" cx="110" cy="110" r="97"></circle>
    </svg>
    <div class="ring-num" id="ringNum">—</div>
  </div>
  <div class="st-done" id="stDone">🎉 听写完成！</div>
</main>

<div class="toast" id="toast"></div>

<script>
(function(){
'use strict';
var WORDS_KEY='tingxie_words_v1';
var CFG_KEY='tingxie_cfg_v1';

/* 预填示例词表（带编号，演示自动剥编号功能） */
var SAMPLE_WORDS='1.春天\n2.燕子\n3.柳树\n4.桃花\n5.小溪\n6.蝴蝶\n7.风筝\n8.麦苗\n9.杜鹃\n10.笋芽\n11.月亮\n12.山谷\n13.温暖\n14.芬芳\n15.闪烁\n16.头发';

var config={interval:6,times:1,rate:1,announceIdx:false};
var synth=('speechSynthesis' in window)?window.speechSynthesis:null;

/* 播报状态机：idle / speak（朗读中）/ wait（间隔倒计时）/ done */
var st={words:[],idx:-1,running:false,paused:false,phase:'idle',remain:0,timer:null,token:0,repeatLeft:0};
var voiceObj=null;
var RING_C=2*Math.PI*97; /* 圆环周长 */

function $(id){return document.getElementById(id)}

function saveCfg(){try{localStorage.setItem(CFG_KEY,JSON.stringify(config))}catch(e){}}
function saveWords(){try{localStorage.setItem(WORDS_KEY,$('wordsInput').value)}catch(e){}}
function loadStore(){
  try{
    var raw=localStorage.getItem(CFG_KEY);
    if(raw)Object.assign(config,JSON.parse(raw));
  }catch(e){}
  try{
    var w=localStorage.getItem(WORDS_KEY);
    $('wordsInput').value=(w!==null&&w!=='')?w:SAMPLE_WORDS;
  }catch(e){
    $('wordsInput').value=SAMPLE_WORDS;
  }
}

/* ===== 词表解析：剥离"1."、"（2）"、"一、"等编号前缀 ===== */
function cleanWord(line){
  var w=line.trim();
  /* 编号后必须跟分隔符或空格才剥离，避免误伤"十分"这类词语 */
  var m=w.match(/^[\(（]?[0-9０-９一二三四五六七八九十百]{1,4}([\)）\.．、:：,，]|(?=\s))/);
  if(m){
    w=w.slice(m[0].length);
    w=w.replace(/^[\)）\.．、:：,，]?\s*/,'');
  }
  return w;
}
function parseWords(){
  return $('wordsInput').value.split(/\r?\n/).map(cleanWord).filter(function(w){return w;});
}
function updateWordCnt(){
  var n=parseWords().length;
  $('wordCnt').textContent='共 '+n+' 词';
  if(!st.running){
    $('stCount').innerHTML='<span class="dim">第 — 个</span> / 共 '+n+' 个';
  }
  return n;
}

/* ===== 语音合成 ===== */
function pickVoice(){
  if(voiceObj)return voiceObj;
  if(!synth)return null;
  var vs=synth.getVoices()||[];
  var i;
  for(i=0;i<vs.length;i++){if(/zh[-_]CN/i.test(vs[i].lang)){voiceObj=vs[i];return voiceObj;}}
  for(i=0;i<vs.length;i++){if(/^zh/i.test(vs[i].lang)){voiceObj=vs[i];return voiceObj;}}
  return null;
}
if(synth){
  synth.onvoiceschanged=function(){voiceObj=null;pickVoice();};
}

/* 令牌机制：任何控制操作都会使旧的语音回调失效，避免重复推进 */
function bump(){return ++st.token}

/* ===== 主流程 ===== */
function startAll(){
  if(!synth){showToast('当前浏览器不支持语音合成，请使用 Chrome / Edge');return;}
  var ws=parseWords();
  if(!ws.length){showToast('请先在左侧输入词表');return;}
  if(synth.paused){try{synth.cancel()}catch(e){}}
  st.words=ws;st.idx=-1;st.running=true;st.paused=false;
  $('stDone').classList.remove('show');
  nextWord();
  updateButtons();
}
function nextWord(){
  var t=bump();
  stopTimer();
  st.idx++;
  if(st.idx>=st.words.length){finish();return;}
  st.phase='speak';
  setStatus('朗读中，请书写');
  drawRing(1,'🔊');
  st.repeatLeft=config.times;
  speakOnce(t);
  updateProgress();
}
function speakOnce(t){
  if(t!==st.token||!st.running||st.paused)return;
  /* 序号播报仅在第一遍朗读前加入 */
  var pre=(config.announceIdx&&st.repeatLeft===config.times)?('第'+(st.idx+1)+'个，'):'';
  var u=new SpeechSynthesisUtterance(pre+st.words[st.idx]);
  u.lang='zh-CN';
  var v=pickVoice();
  if(v)u.voice=v;
  u.rate=config.rate;
  u.onend=function(){if(t===st.token&&st.running&&!st.paused)onWordEnd(t);};
  u.onerror=function(){if(t===st.token&&st.running&&!st.paused)onWordEnd(t);};
  try{synth.speak(u)}catch(e){onWordEnd(t)}
}
function onWordEnd(t){
  if(t!==st.token||!st.running)return;
  st.repeatLeft--;
  if(st.repeatLeft>0){
    /* 多遍朗读之间留一小段停顿 */
    setTimeout(function(){if(t===st.token&&st.running&&!st.paused)speakOnce(t);},500);
  }else{
    startCountdown(t);
  }
}
function startCountdown(t){
  if(t!==st.token||!st.running)return;
  st.phase='wait';
  setStatus('书写时间');
  st.remain=config.interval;
  drawRing(1,Math.ceil(st.remain));
  stopTimer();
  st.timer=setInterval(function(){
    if(!st.running||st.paused)return;
    st.remain-=0.1;
    if(st.remain<=0){
      stopTimer();
      nextWord();
    }else{
      drawRing(st.remain/config.interval,Math.ceil(st.remain));
    }
  },100);
}

/* ===== 控制操作 ===== */
function pauseAll(){
  if(!st.running||st.paused)return;
  st.paused=true;
  if(st.phase==='speak'){try{synth.pause()}catch(e){}}
  setStatus('已暂停');
  updateButtons();
}
function resumeAll(){
  if(!st.running||!st.paused)return;
  st.paused=false;
  if(st.phase==='speak'){
    try{synth.resume()}catch(e){}
    /* 兜底：若暂停发生在两遍朗读间隙（无排队语音），恢复后补读一遍 */
    setTimeout(function(){
      if(st.running&&!st.paused&&st.phase==='speak'&&!synth.speaking&&!synth.pending){
        speakOnce(st.token);
      }
    },350);
  }
  setStatus(st.phase==='speak'?'朗读中，请书写':'书写时间');
  updateButtons();
}
function stopAll(){
  bump();
  st.running=false;st.paused=false;st.phase='idle';st.idx=-1;
  stopTimer();
  if(synth){try{synth.cancel()}catch(e){}}
  setStatus('已停止');
  $('stDone').classList.remove('show');
  updateProgress();
  drawRing(0,'—');
  updateButtons();
}
function skipCurrent(){
  if(!st.running)return;
  bump();
  stopTimer();
  if(synth){try{synth.cancel()}catch(e){}}
  nextWord();
}
function repeatPrev(){
  if(!st.running)return;
  var target=Math.max(0,st.idx-1); /* 第一个词时重读自身 */
  bump();
  stopTimer();
  if(synth){try{synth.cancel()}catch(e){}}
  st.idx=target-1;
  nextWord();
}
function stopTimer(){
  if(st.timer){clearInterval(st.timer);st.timer=null;}
}
function finish(){
  st.running=false;st.paused=false;st.phase='done';
  stopTimer();
  setStatus('完成');
  $('stCount').innerHTML='全部播报完毕';
  drawRing(0,'✓');
  $('stDone').classList.add('show');
  playDingDong();
  updateButtons();
}

/* ===== 界面刷新 ===== */
function updateProgress(){
  var m=st.words.length;
  if(st.idx>=0&&st.idx<m){
    $('stCount').innerHTML='第 <span class="dim">'+(st.idx+1)+'</span> 个 / 共 '+m+' 个';
  }else{
    $('stCount').innerHTML='<span class="dim">第 — 个</span> / 共 '+m+' 个';
  }
}
function setStatus(s){$('stStatus').textContent=s}
function drawRing(pct,label){
  var fg=$('ringFg');
  fg.style.strokeDashoffset=String(RING_C*(1-Math.max(0,Math.min(1,pct))));
  $('ringNum').textContent=label;
}
function updateButtons(){
  $('btnStart').disabled=st.running;
  $('btnPause').disabled=!st.running||st.paused;
  $('btnResume').disabled=!st.running||!st.paused;
  $('btnStop').disabled=!st.running;
  $('btnSkip').disabled=!st.running;
  $('btnReprev').disabled=!st.running;
}

/* ===== 结束提示音：Web Audio 叮咚 ===== */
function tone(ctx,freq,at,dur){
  var o=ctx.createOscillator(),g=ctx.createGain();
  o.type='sine';o.frequency.value=freq;
  g.gain.setValueAtTime(0.0001,at);
  g.gain.exponentialRampToValueAtTime(0.5,at+0.02);
  g.gain.exponentialRampToValueAtTime(0.0001,at+dur);
  o.connect(g);g.connect(ctx.destination);
  o.start(at);o.stop(at+dur+0.05);
}
function playDingDong(){
  try{
    var AC=window.AudioContext||window.webkitAudioContext;
    if(!AC)return;
    var ctx=new AC();
    var t0=ctx.currentTime;
    tone(ctx,880,t0,0.3);
    tone(ctx,660,t0+0.34,0.55);
    setTimeout(function(){ctx.close()},1400);
  }catch(e){}
}

function showToast(msg){
  var t=$('toast');
  t.textContent=msg;
  t.classList.add('show');
  clearTimeout(t._tm);
  t._tm=setTimeout(function(){t.classList.remove('show')},2400);
}

/* ===== 控件绑定 ===== */
function applyCfgToUI(){
  $('intervalSlider').value=config.interval;
  $('intervalVal').textContent=config.interval+' 秒';
  $('rateSlider').value=config.rate;
  $('rateVal').textContent=(+config.rate).toFixed(1);
  document.querySelectorAll('input[name=times]').forEach(function(r){
    r.checked=(+r.value===config.times);
  });
  $('announceIdx').checked=config.announceIdx;
}
function bindEvents(){
  $('wordsInput').addEventListener('input',function(){saveWords();updateWordCnt();});
  $('intervalSlider').addEventListener('input',function(){
    config.interval=+this.value;
    $('intervalVal').textContent=config.interval+' 秒';
    saveCfg();
  });
  $('rateSlider').addEventListener('input',function(){
    config.rate=+this.value;
    $('rateVal').textContent=config.rate.toFixed(1);
    saveCfg();
  });
  document.querySelectorAll('input[name=times]').forEach(function(r){
    r.addEventListener('change',function(){config.times=+this.value;saveCfg();});
  });
  $('announceIdx').addEventListener('change',function(){config.announceIdx=this.checked;saveCfg();});

  $('btnStart').addEventListener('click',startAll);
  $('btnPause').addEventListener('click',pauseAll);
  $('btnResume').addEventListener('click',resumeAll);
  $('btnStop').addEventListener('click',stopAll);
  $('btnSkip').addEventListener('click',skipCurrent);
  $('btnReprev').addEventListener('click',repeatPrev);
}

/* ===== 启动 ===== */
loadStore();
applyCfgToUI();
bindEvents();
updateWordCnt();
drawRing(0,'—');
if(!synth){
  $('noSpeech').style.display='block';
  $('btnStart').disabled=true;
}
})();
</script>
</body>
</html>
