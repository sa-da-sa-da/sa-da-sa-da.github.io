<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>闪卡单词卡生成器 · 网页翻卡+双面对折打印 | 当以读书通世事</title>
<link rel="canonical" href="https://www.sakaay.com/lab/AI/shanka.html">
<meta name="description" content="闪卡 / 单词卡生成器：粘贴正反面内容，网页端 3D 翻卡背单词、标记认识与不认识，也能生成 A4 双面对折裁剪卡片，打印后裁开即可用。支持按单元批量导入、随机洗牌与只看未掌握卡片，适合单词突击、生字复习与课堂抢答，打印版沿虚线裁开即可使用。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#2b2620;--muted:#857a6c;--line:#eae1d5;
  --brand:#c1682c;--brand-l:#fdf1e7;--bg:#faf7f2;--card:#fff;
}
body{font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.app{display:flex;gap:18px;padding:18px;max-width:1360px;margin:0 auto;align-items:flex-start}
/* ===== 左侧面板 ===== */
.panel{width:326px;flex:0 0 326px;background:var(--card);border-radius:14px;padding:18px;box-shadow:0 4px 20px rgba(80,60,35,.08);position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto}
.panel h2{font-size:16px;font-weight:700;margin-bottom:4px}
.panel .sub{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.6}
.field{margin-bottom:15px}
.field label{display:block;font-size:13px;font-weight:600;color:#4c4235;margin-bottom:7px}
textarea{width:100%;min-height:150px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;line-height:1.7;font-family:inherit;outline:none;color:var(--ink);background:#fffdfa;transition:border-color .2s}
textarea:focus{border-color:var(--brand)}
input[type=text]{width:100%;border:1px solid var(--line);border-radius:10px;padding:9px 10px;font-size:14px;font-family:inherit;outline:none;color:var(--ink);background:#fffdfa}
input[type=text]:focus{border-color:var(--brand)}
.actions{display:flex;gap:8px;margin-top:4px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .18s}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:#a9541f}
.btn.ghost{background:#f2ece3;color:#6b5f4e}
.btn.ghost:hover{background:#eae2d6}
.deck-row{display:flex;gap:6px;margin-top:8px}
.deck-row select{flex:1;min-width:0;border:1px solid var(--line);border-radius:10px;padding:9px;font-size:13px;font-family:inherit;color:#4c4235;background:#fffdfa;outline:none}
.tip{margin-top:12px;font-size:12px;color:var(--muted);line-height:1.7;background:var(--brand-l);border-radius:9px;padding:9px 11px}
/* ===== 右侧翻卡区 ===== */
.main{flex:1;min-width:0}
.study{background:var(--card);border-radius:14px;padding:18px;box-shadow:0 4px 20px rgba(80,60,35,.08)}
.study-head{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.counter{font-size:14px;color:var(--muted);font-weight:600}
.counter b{color:var(--ink);font-size:18px}
.bar{flex:1;min-width:120px;height:8px;background:#f0e8dc;border-radius:5px;overflow:hidden}
.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,#e0a35c,#c1682c);border-radius:5px;transition:width .3s}
.stage{perspective:1200px;display:flex;justify-content:center;padding:10px 0 18px}
.flipper{position:relative;width:min(600px,100%);height:320px;transform-style:preserve-3d;transition:transform .55s cubic-bezier(.4,.2,.2,1);cursor:pointer}
.flipper.flipped{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:18px;display:flex;align-items:center;justify-content:center;padding:26px;text-align:center;word-break:break-word}
.face .txt{font-size:clamp(22px,4vw,40px);font-weight:700;line-height:1.35}
.face.front{background:linear-gradient(140deg,#fffdf7,#f7ecdd);border:2px solid #f0e2ce;box-shadow:0 10px 30px rgba(120,80,30,.12)}
.face.back{background:linear-gradient(140deg,#2f3d4f,#1e2836);color:#fff;transform:rotateY(180deg);border:2px solid #37485c;box-shadow:0 10px 30px rgba(20,30,45,.22)}
.face .tip-mini{position:absolute;bottom:14px;left:0;right:0;text-align:center;font-size:12px;opacity:.45;font-weight:400}
.controls{display:flex;gap:10px;justify-content:center;flex-wrap:wrap}
.cbtn{padding:11px 20px;border:1px solid var(--line);background:#fffdfa;border-radius:11px;font-size:14px;font-weight:600;color:#5d5241;cursor:pointer;font-family:inherit;transition:all .18s}
.cbtn:hover{border-color:#e0cfb8;background:#fdf7ef}
.cbtn.flip{background:var(--brand);border-color:var(--brand);color:#fff}
.cbtn.flip:hover{background:#a9541f}
.cbtn.know{background:#e9f5ec;border-color:#c8e6d0;color:#2f7d4f}
.cbtn.unknow{background:#fdeceb;border-color:#f5cfcb;color:#b8453b}
.mark-line{display:flex;gap:10px;justify-content:center;margin-top:12px;flex-wrap:wrap;align-items:center}
.chk{display:flex;align-items:center;gap:6px;font-size:13px;color:#6b5f4e;cursor:pointer}
.chk input{accent-color:var(--brand);width:15px;height:15px;cursor:pointer}
.empty{padding:60px 20px;text-align:center;color:var(--muted);font-size:14px;line-height:1.9}
/* ===== 打印用对折卡 ===== */
.print-area{display:none}
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .app{display:none !important}
  .print-area{display:block}
  .print-page{width:210mm;height:297mm;padding:10mm 8mm;box-sizing:border-box;display:flex;flex-direction:column;page-break-after:always}
  .print-page:last-child{page-break-after:auto}
  .print-head{flex:0 0 auto;display:flex;justify-content:space-between;align-items:flex-end;font-size:9pt;color:#333;border-bottom:.4mm solid #999;padding-bottom:1.5mm;margin-bottom:3mm}
  .print-body{flex:1;display:flex;gap:0;min-height:0}
  .pcol{flex:1;display:flex;flex-direction:column;border-right:.3mm dashed #999}
  .pcol:last-child{border-right:none;padding-left:1mm}
  .pcol .lab{font-size:7pt;color:#888;text-align:center;margin-bottom:1mm}
  .pcard{flex:1;border:.3mm dashed #aaa;margin:.6mm;display:flex;align-items:center;justify-content:center;text-align:center;padding:2mm;font-size:11pt;font-weight:600;line-height:1.3;overflow:hidden;word-break:break-word}
  .pcard.small{font-size:9pt}
  .pcard.backface{color:#666;font-weight:400;font-size:9pt}
  .fold-hint{position:absolute;left:50%;top:0;bottom:0;border-left:.3mm dashed #ccc}
}
@media (max-width:900px){
  .app{flex-direction:column;padding:12px}
  .panel{width:100%;flex:none;position:static;max-height:none}
  .flipper{height:260px}
}
</style>
</head>
<body>
<h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">闪卡单词卡生成器 · 网页翻卡与双面打印</h1>
<div class="app">
  <aside class="panel">
    <h2>闪卡 / 单词卡生成器</h2>
    <p class="sub">每行一张卡：正面、背面用逗号或 Tab 分隔。网页翻卡背诵，也能打印成对折卡片。</p>

    <div class="field">
      <label>卡片内容（正面 , 背面）</label>
      <textarea id="txt" placeholder="例：&#10;apple,苹果&#10;book,书&#10;床前明月光,李白"></textarea>
    </div>

    <div class="field">
      <label>卡组名称</label>
      <input type="text" id="txtName" placeholder="如：第三单元单词">
      <div class="deck-row">
        <select id="selDeck"><option value="">载入已存卡组…</option></select>
        <button class="btn ghost" id="btnSaveDeck" style="flex:0 0 auto;padding:9px 14px;font-size:13px;">保存</button>
      </div>
    </div>

    <div class="actions">
      <button class="btn primary" id="btnPrint">打印卡片</button>
      <button class="btn ghost" id="btnShuffle">洗牌</button>
    </div>

    <div class="tip">卡片会实时更新。打印版是 A4 两列对折：左列正面、右列背面，沿中缝对折后裁开即可。</div>
  </aside>

  <main class="main">
    <div class="study">
      <div class="study-head">
        <div class="counter">第 <b id="curNo">0</b> / <b id="curTotal">0</b> 张</div>
        <div class="bar"><i id="barFill"></i></div>
        <label class="chk"><input type="checkbox" id="chkFilter"> 只看没掌握的</label>
      </div>

      <div class="stage" id="stage">
        <div class="flipper" id="flipper">
          <div class="face front">
            <div class="txt" id="faceFront">—</div>
            <div class="tip-mini">点击卡片翻面</div>
          </div>
          <div class="face back">
            <div class="txt" id="faceBack">—</div>
            <div class="tip-mini">空格翻面 · ← → 切换</div>
          </div>
        </div>
      </div>

      <div class="controls">
        <button class="cbtn" id="btnPrev">← 上一张</button>
        <button class="cbtn flip" id="btnFlip">翻面</button>
        <button class="cbtn" id="btnNext">下一张 →</button>
      </div>

      <div class="mark-line">
        <button class="cbtn know" id="btnKnow">✓ 已掌握</button>
        <button class="cbtn unknow" id="btnUnknown">✗ 再练练</button>
        <button class="cbtn" id="btnClearMark">清除标记</button>
      </div>
    </div>
  </main>
</div>

<!-- ===== 打印区：A4 两列对折 ===== -->
<div class="print-area" id="printArea"></div>

<script>
(function(){
  'use strict';

  var KEY = 'sk_state_v1';
  var DEF = {
    text: 'apple,苹果\nbook,书\nwater,水\nfamily,家庭\nschool,学校\nfriend,朋友\nteacher,老师\ntomorrow,明天',
    name: '第三单元单词',
    decks: []
  };
  var state = Object.assign({}, DEF);
  try {
    var saved = localStorage.getItem(KEY);
    if (saved) state = Object.assign(state, JSON.parse(saved));
  } catch (e) {}

  var cards = [];      // 全部卡片
  var order = [];      // 当前浏览顺序（存原始索引）
  var pos = 0;
  var flipped = false;

  var elText = document.getElementById('txt');
  var elName = document.getElementById('txtName');
  var elSel = document.getElementById('selDeck');
  var flipper = document.getElementById('flipper');
  var fFront = document.getElementById('faceFront');
  var fBack = document.getElementById('faceBack');
  var elCurNo = document.getElementById('curNo');
  var elCurTotal = document.getElementById('curTotal');
  var barFill = document.getElementById('barFill');
  var chkFilter = document.getElementById('chkFilter');
  var stage = document.getElementById('stage');
  var printArea = document.getElementById('printArea');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // 解析文本：支持 Tab、中文逗号、英文逗号、竖线、两个以上空格
  function parseCards(text) {
    var out = [];
    (text || '').split('\n').forEach(function (line) {
      line = line.trim();
      if (!line) return;
      var parts = line.split(/\t|，|,|\||\s{2,}/);
      var f = (parts[0] || '').trim();
      var b = parts.length > 1 ? line.substring(line.indexOf(parts[0]) + parts[0].length).replace(/^[\t，,| ]+/, '').trim() : '';
      if (!f) return;
      out.push({ f: f, b: b, mark: null });
    });
    return out;
  }

  function rebuild(keepMark) {
    var old = cards;
    cards = parseCards(state.text);
    // 保留同一正面内容的掌握标记，减少重排后丢失
    if (keepMark && old.length) {
      var map = {};
      old.forEach(function (c) { if (c.mark) map[c.f] = c.mark; });
      cards.forEach(function (c) { if (map[c.f]) c.mark = map[c.f]; });
    }
    order = cards.map(function (_, i) { return i; });
    pos = 0;
    flipped = false;
    renderAll();
  }

  function visibleOrder() {
    if (!chkFilter.checked) return order;
    return order.filter(function (i) { return cards[i].mark !== 'know'; });
  }

  function renderAll() {
    renderCard();
    renderPrint();
    save();
  }

  function renderCard() {
    var vis = visibleOrder();
    var total = vis.length;
    elCurTotal.textContent = total;

    if (!total) {
      fFront.textContent = chkFilter.checked ? '全部掌握啦' : '还没有卡片';
      fBack.textContent = '在左侧粘贴内容，每行一张';
      elCurNo.textContent = '0';
      barFill.style.width = '100%';
      return;
    }
    if (pos >= total) pos = 0;
    var idx = vis[pos];
    var c = cards[idx];
    elCurNo.textContent = (pos + 1);
    fFront.textContent = c.f;
    fBack.textContent = c.b || '（这张卡没有背面）';
    flipper.classList.toggle('flipped', flipped);

    var known = cards.filter(function (x) { return x.mark === 'know'; }).length;
    barFill.style.width = Math.round(known / cards.length * 100) + '%';
  }

  function go(delta) {
    var vis = visibleOrder();
    if (!vis.length) return;
    pos = (pos + delta + vis.length) % vis.length;
    flipped = false;
    renderCard();
  }

  function toggleFlip() {
    if (!visibleOrder().length) return;
    flipped = !flipped;
    flipper.classList.toggle('flipped', flipped);
  }

  function mark(type) {
    var vis = visibleOrder();
    if (!vis.length) return;
    cards[vis[pos]].mark = type;
    // 标记后自动前往下一张，方便快速过卡
    var next = pos + 1;
    var vis2 = visibleOrder();
    if (next >= vis2.length) next = 0;
    pos = next;
    flipped = false;
    renderAll();
  }

  // 打印区：两列对折，左列正面右列背面，行数自适应
  function renderPrint() {
    var list = cards.slice();
    if (!list.length) {
      printArea.innerHTML = '';
      return;
    }
    var maxRows = 7;                    // 单页最多 7 行，保证卡片不至于太小
    var pageCount = Math.ceil(list.length / maxRows);

    var html = '';
    for (var p = 0; p < pageCount; p++) {
      var slice = list.slice(p * maxRows, (p + 1) * maxRows);
      var head = '<div class="print-head">' +
                   '<span>' + esc(state.name || '闪卡') + '</span>' +
                   '<span>第 ' + (p + 1) + ' / ' + pageCount + ' 页　沿中缝对折后裁开</span>' +
                 '</div>';
      var frontCol = '<div class="pcol"><div class="lab">正面</div>' +
        slice.map(function (c) {
          var small = c.f.length > 14 ? ' small' : '';
          return '<div class="pcard' + small + '">' + esc(c.f) + '</div>';
        }).join('') + '</div>';
      var backCol = '<div class="pcol"><div class="lab">背面</div>' +
        slice.map(function (c) {
          var small = (c.b || '').length > 20 ? ' small' : '';
          return '<div class="pcard backface' + small + '">' + esc(c.b || '') + '</div>';
        }).join('') + '</div>';
      html += '<div class="print-page">' + head + '<div class="print-body">' + frontCol + backCol + '</div></div>';
    }
    printArea.innerHTML = html;
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function renderDeckOptions() {
    var opts = '<option value="">载入已存卡组…</option>';
    state.decks.forEach(function (d, i) {
      opts += '<option value="' + i + '">' + esc(d.name) + '</option>';
    });
    elSel.innerHTML = opts;
  }

  // ===== 事件绑定 =====
  var timer = null;
  elText.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      state.text = elText.value;
      rebuild(true);
    }, 220);
  });

  elName.addEventListener('input', function () {
    state.name = elName.value;
    renderPrint();
    save();
  });

  document.getElementById('btnSaveDeck').addEventListener('click', function () {
    var name = (state.name || '').trim() || ('卡组 ' + (state.decks.length + 1));
    var exist = state.decks.findIndex(function (d) { return d.name === name; });
    var item = { name: name, text: state.text, cards: state.text };
    if (exist > -1) state.decks[exist] = item;
    else state.decks.push(item);
    renderDeckOptions();
    save();
  });

  elSel.addEventListener('change', function () {
    if (elSel.value === '') return;
    var d = state.decks[Number(elSel.value)];
    if (!d) return;
    state.text = d.text;
    state.name = d.name;
    elText.value = d.text;
    elName.value = d.name;
    rebuild(false);
    elSel.value = '';
  });

  document.getElementById('btnShuffle').addEventListener('click', function () {
    for (var i = order.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = order[i]; order[i] = order[j]; order[j] = t;
    }
    pos = 0;
    flipped = false;
    renderAll();
  });

  document.getElementById('btnPrint').addEventListener('click', function () {
    renderPrint();
    window.print();
  });

  document.getElementById('btnPrev').addEventListener('click', function () { go(-1); });
  document.getElementById('btnNext').addEventListener('click', function () { go(1); });
  document.getElementById('btnFlip').addEventListener('click', toggleFlip);
  document.getElementById('btnKnow').addEventListener('click', function () { mark('know'); });
  document.getElementById('btnUnknown').addEventListener('click', function () { mark('unknown'); });
  document.getElementById('btnClearMark').addEventListener('click', function () {
    cards.forEach(function (c) { c.mark = null; });
    pos = 0;
    renderAll();
  });

  chkFilter.addEventListener('change', function () {
    pos = 0;
    flipped = false;
    renderCard();
  });

  flipper.addEventListener('click', toggleFlip);

  document.addEventListener('keydown', function (e) {
    if (e.target.tagName === 'TEXTAREA' || e.target.tagName === 'INPUT') return;
    if (e.code === 'Space') { e.preventDefault(); toggleFlip(); }
    else if (e.code === 'ArrowLeft') { go(-1); }
    else if (e.code === 'ArrowRight') { go(1); }
  });

  // ===== 初始化 =====
  elText.value = state.text;
  elName.value = state.name;
  renderDeckOptions();
  rebuild(false);
})();
</script>
</body>
</html>
