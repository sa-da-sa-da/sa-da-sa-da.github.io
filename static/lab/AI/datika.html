<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>答题卡生成器 · 自定义题量选项 A4 打印 | 当以读书通世事</title>
<link rel="canonical" href="https://www.sakaay.com/lab/AI/datika.html">
<meta name="description" content="在线答题卡生成器：自定义题目数量、选项数、每行题数与考号涂卡格，自动生成含姓名班级栏、选择题圆圈与注意事项的 A4 标准答题卡，直接打印即可用于随堂测验、单元测试与月考。支持题号连续编排与选项字母自定义，版式可保存复用，生成结果按 A4 打印，无需再排版。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#20312f;--muted:#6b7a78;--line:#e2e9e7;
  --brand:#2f7d6e;--brand-l:#e9f4f1;--bg:#f3f6f5;--card:#fff;
  --s:1;
}
body{font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}

/* ===== 布局 ===== */
.app{display:flex;gap:18px;padding:18px;max-width:1360px;margin:0 auto;align-items:flex-start}
.panel{width:330px;flex:0 0 330px;background:var(--card);border-radius:14px;padding:18px;box-shadow:0 4px 20px rgba(20,50,45,.07);position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto}
.panel h2{font-size:16px;font-weight:700;margin-bottom:4px}
.panel .sub{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.6}
.field{margin-bottom:16px}
.field>label{display:block;font-size:13px;font-weight:600;color:#40514e;margin-bottom:7px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:56px;padding:8px 6px;border:1px solid var(--line);background:#fbfdfc;border-radius:9px;font-size:13px;color:#5a6b68;cursor:pointer;transition:all .18s;font-family:inherit}
.seg button:hover{border-color:#bcd6d0}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.inline{display:flex;align-items:center;gap:8px;margin-top:10px;font-size:12px;color:#5a6b68}
input[type=number]{width:82px;padding:7px 9px;border:1px solid var(--line);border-radius:8px;font-size:13px;font-family:inherit;outline:none;color:var(--ink);background:#fbfdfc}
input[type=number]:focus{border-color:var(--brand)}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:#40514e;cursor:pointer;padding:5px 0}
.check input{width:16px;height:16px;accent-color:var(--brand);cursor:pointer}
.actions{display:flex;gap:8px;margin-top:4px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .18s}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:#276a5d}
.btn.ghost{background:#f0f4f3;color:#5a6b68}
.btn.ghost:hover{background:#e5ecea}
.tip{margin-top:12px;font-size:12px;color:#5a6b68;line-height:1.7;background:var(--brand-l);border-radius:9px;padding:9px 11px}
.tip.warn{background:#fff4e6;color:#9a6420}

/* ===== 预览 ===== */
.preview{flex:1;min-width:0;padding:0 4px 40px;display:flex;flex-direction:column}
.preview-note{font-size:12px;color:#8fa09d;text-align:center;margin-bottom:10px}
.pages{display:flex;flex-direction:column;align-items:center}
.page-shell{width:100%;height:calc(297mm * var(--s));display:flex;justify-content:center;margin-bottom:18px}

/* ===== A4 纸面 ===== */
.paper{
  width:210mm;height:297mm;background:#fff;padding:12mm;
  box-shadow:0 8px 30px rgba(20,50,45,.16);border-radius:1mm;
  transform:scale(var(--s));transform-origin:top center;flex:0 0 auto;
  display:flex;flex-direction:column;
}

/* 顶部信息栏 */
.tk-head{flex:0 0 auto;display:flex;justify-content:space-between;align-items:flex-start;gap:4mm;border-bottom:.45mm solid #222;padding-bottom:1.2mm}
.head-left{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-around;height:100%}
.card-title{font-size:5.6mm;font-weight:800;letter-spacing:1.6mm;color:#111}
.head-line{display:flex;align-items:center;gap:1.6mm;font-size:3.2mm;color:#333;margin-top:2mm}
.head-line b{font-weight:600;white-space:nowrap}
.wl{flex:1;height:4.6mm;border-bottom:.3mm solid #666;min-width:12mm}
.wl.short{flex:.6}

/* 考号涂卡区 */
.id-card{flex:0 0 auto;border:.35mm solid #333;border-radius:1.5mm;padding:1.2mm 1.6mm 1.6mm}
.id-title{font-size:2.4mm;color:#333;text-align:center;margin-bottom:.8mm}
.id-grid{display:flex;gap:.7mm}
.id-labels{display:flex;flex-direction:column;gap:.5mm;width:3.4mm}
.id-labels span{height:3.2mm;display:flex;align-items:center;justify-content:center;font-size:2.2mm;color:#666}
.id-labels .id-sp{height:3.2mm}
.id-col{display:flex;flex-direction:column;gap:.5mm}
.id-col .id-sp{height:3.2mm}
.id-c{width:3.2mm;height:3.2mm;border:.25mm solid #999;border-radius:50%}

/* 题目区 */
.q-area{flex:0 0 auto;overflow:hidden}
.q-group{margin-bottom:2.6mm}
.q-group:last-child{margin-bottom:0}
.q-row{display:flex;align-items:center}
.q{flex:1;display:flex;align-items:center;gap:var(--numgap);min-width:0}
.q-no{
  width:var(--numw);height:var(--dia);flex:0 0 var(--numw);
  border:.28mm solid #222;border-radius:.8mm;
  display:flex;align-items:center;justify-content:center;
  font-size:var(--nofs);font-weight:700;color:#111;line-height:1;
}
.opts{display:flex;gap:var(--ogap)}
.bubble{
  width:var(--dia);height:var(--dia);flex:0 0 var(--dia);
  border:.26mm solid #7a8a87;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  font-size:calc(var(--dia) * .42);color:#4c5c59;line-height:1;
}

/* 底部注意事项 */
.notes{flex:0 0 auto;border-top:.25mm solid #bbb;padding-top:1.6mm;font-size:2.5mm;line-height:1.7;color:#555}
.notes b{color:#222}

/* ===== 打印 ===== */
@media print{
  @page{size:A4 portrait;margin:0}
  html,body{background:#fff}
  .panel,.preview-note{display:none !important}
  .app{display:block;padding:0;margin:0;max-width:none}
  .preview{padding:0;display:block}
  .pages{display:block}
  .page-shell{display:block;height:auto !important;margin:0}
  .paper{transform:none !important;box-shadow:none;border-radius:0;margin:0;overflow:hidden;page-break-inside:avoid;height:295mm;padding:11mm 12mm}
}

/* ===== 窄屏 ===== */
@media (max-width:980px){
  .app{flex-direction:column;padding:12px}
  .panel{width:100%;flex:none;position:static;max-height:none}
  .preview{width:100%}
}
</style>
</head>
<body>
<h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">答题卡生成器 · 自定义题量与 A4 打印</h1>
<div class="app">
  <aside class="panel">
    <h2>答题卡生成器</h2>
    <p class="sub">按题量与选项数一键排版，A4 纵向打印。配置只保存在你的浏览器里。</p>

    <div class="field">
      <label>题目数量</label>
      <div class="seg" id="segCount">
        <button data-v="20">20 题</button>
        <button data-v="30">30 题</button>
        <button data-v="50">50 题</button>
        <button data-v="100">100 题</button>
      </div>
      <div class="inline">自定义 <input type="number" id="numCount" min="1" max="150" step="1" value="30"> 题（1~150）</div>
    </div>

    <div class="field">
      <label>每题选项数</label>
      <div class="seg" id="segOpts">
        <button data-v="4">4 个（ABCD）</button>
        <button data-v="5">5 个（ABCDE）</button>
      </div>
    </div>

    <div class="field">
      <label>每行题数</label>
      <div class="seg" id="segPerRow">
        <button data-v="5">每行 5 题</button>
        <button data-v="10">每行 10 题</button>
      </div>
      <div class="hint">每行 10 题会自动使用紧凑版式，圆圈略小。</div>
    </div>

    <div class="field">
      <label class="check"><input type="checkbox" id="chkId" checked> 显示考号涂卡格（9 位，每列 0~9）</label>
    </div>

    <div class="actions">
      <button class="btn primary" id="btnPrint">打印答题卡</button>
      <button class="btn ghost" id="btnReset">恢复默认</button>
    </div>

    <div class="tip" id="tip"></div>
  </aside>

  <main class="preview">
    <div class="preview-note" id="previewNote">A4 纵向纸面预览 · 实际尺寸 210×297mm</div>
    <div class="pages" id="pages"></div>
  </main>
</div>

<script>
(function(){
  'use strict';

  var KEY = 'datika_state_v1';
  var DEF = { count: 30, opts: 4, perRow: 5, idShow: true };
  var state = Object.assign({}, DEF);
  try {
    var saved = localStorage.getItem(KEY);
    if (saved) state = Object.assign(state, JSON.parse(saved));
  } catch (e) { /* 隐私模式下忽略存储异常 */ }

  // 配置合法性兜底（防止旧数据越界）
  state.count = Math.max(1, Math.min(150, parseInt(state.count, 10) || DEF.count));
  state.opts = state.opts === 5 ? 5 : 4;
  state.perRow = state.perRow === 10 ? 10 : 5;
  state.idShow = state.idShow !== false;

  var pagesEl = document.getElementById('pages');
  var tip = document.getElementById('tip');
  var numCount = document.getElementById('numCount');
  var chkId = document.getElementById('chkId');
  var previewNote = document.getElementById('previewNote');

  var LETTERS = ['A', 'B', 'C', 'D', 'E'];

  // ===== 顶部信息栏（含考号涂卡格） =====
  function headHTML(headH) {
    var info = '<div class="head-left">' +
      '<div class="card-title">答 题 卡</div>' +
      '<div class="head-line"><b>姓名</b><span class="wl"></span><b>班级</b><span class="wl"></span></div>' +
      '<div class="head-line"><b>考场</b><span class="wl"></span><b>座位号</b><span class="wl short"></span></div>' +
    '</div>';

    if (!state.idShow) {
      return '<div class="tk-head" style="height:' + headH + 'mm;border-bottom:none">' + info + '</div>';
    }

    // 9 位考号：每一位一列，列内 0~9 圆圈
    var cols = '';
    for (var c = 0; c < 9; c++) {
      var cells = '<span class="id-sp"></span>';
      for (var d = 0; d < 10; d++) cells += '<span class="id-c"></span>';
      cols += '<div class="id-col">' + cells + '</div>';
    }
    var labels = '<div class="id-labels"><span class="id-sp"></span>';
    for (var n = 0; n < 10; n++) labels += '<span>' + n + '</span>';
    labels += '</div>';

    var idCard = '<div class="id-card">' +
      '<div class="id-title">考号（9 位，逐列涂黑）</div>' +
      '<div class="id-grid">' + labels + cols + '</div>' +
    '</div>';

    return '<div class="tk-head" style="height:' + headH + 'mm">' + info + idCard + '</div>';
  }

  // ===== 题目区（每 10 题一组，组间空隙由 CSS 控制） =====
  function questionsHTML(availH, rowH, dia, numW, optGap, numGap, nofs) {
    var n = state.count, per = state.perRow, nopt = state.opts;
    var html = '';
    var groupOpen = false;

    for (var i = 0; i < n; i++) {
      if (i % 10 === 0) {
        if (groupOpen) html += '</div>';
        html += '<div class="q-group">';
        groupOpen = true;
      }
      if (i % per === 0) {
        html += '<div class="q-row" style="height:' + rowH + 'mm">';
      }

      var opts = '';
      for (var o = 0; o < nopt; o++) opts += '<span class="bubble">' + LETTERS[o] + '</span>';
      html += '<div class="q"><span class="q-no">' + (i + 1) + '</span>' +
              '<div class="opts">' + opts + '</div></div>';

      if (i % per === per - 1 || i === n - 1) html += '</div>';
    }
    if (groupOpen) html += '</div>';

    return '<div class="q-area" style="height:' + availH + 'mm;--dia:' + dia + 'mm;--numw:' + numW +
      'mm;--ogap:' + optGap + 'mm;--numgap:' + numGap + 'mm;--nofs:' + nofs + 'mm">' + html + '</div>';
  }

  // ===== 渲染 =====
  function render() {
    var n = state.count, per = state.perRow;
    var headH = state.idShow ? 50 : 26;   // 信息栏高度（mm）
    var noteH = 16;                       // 注意事项区高度（mm）
    var areaGap = 3;
    var availH = 273 - headH - noteH - areaGap; // 版心总高 273mm
    var rows = Math.ceil(n / per);
    var groups = Math.ceil(n / 10);
    var groupGap = 2.6;
    var groupGaps = groups > 1 ? (groups - 1) * groupGap : 0;

    // 每行高度：优先按可用高度均分，最多 9.5mm，过密时压缩
    var rowH = Math.min(9.5, (availH - groupGaps) / rows);
    rowH = Math.max(5, rowH);

    // 圆圈直径：先按宽度算，再受行高约束，最终 2.4~5mm
    var qGap = per === 5 ? 2 : 0.6;
    // 三位数题号需要更宽的题号框，避免数字溢出
    var numW = per === 5 ? 5 : (n >= 100 ? 3.1 : 2.4);
    var numGap = per === 5 ? 0.8 : 0.4;
    var optGap = per === 5 ? 0.9 : 0.25;
    var usable = 186 / per - qGap;
    var dia = (usable - numW - numGap - (state.opts - 1) * optGap) / state.opts;
    dia = Math.min(5, dia, rowH - 1.2);
    dia = Math.max(2.4, dia);
    // 题号字号：三位数时略小，保证在框内完整显示
    var nofs = dia * (n >= 100 ? 0.4 : 0.46);

    var paperHTML = '<div class="paper">' +
      headHTML(headH) +
      questionsHTML(availH, rowH, dia.toFixed(2), numW, optGap, numGap, nofs.toFixed(2)) +
      '<div class="notes" style="margin-top:auto">' +
        '<b>注意事项：</b>1. 请用 2B 铅笔或黑色签字笔将所选选项的圆圈涂满、涂黑；' +
        '2. 修改时须用橡皮擦干净，不要留下残迹；' +
        '3. 考号需按位对应涂黑，姓名、班级等信息请用正楷填写；' +
        '4. 请保持卡面整洁，不要折叠、污损或做其他标记。' +
      '</div>' +
    '</div>';

    pagesEl.innerHTML = '<div class="page-shell">' + paperHTML + '</div>';

    var tight = dia < 4.4 || rowH < 6;
    tip.className = tight ? 'tip warn' : 'tip';
    tip.textContent = '共 ' + n + ' 题 · 每题 ' + state.opts + ' 个选项 · 每行 ' + per + ' 题 · 共 ' + rows + ' 行' +
      (tight ? ' · 已启用紧凑排版' : '');
    previewNote.textContent = 'A4 纵向纸面预览 · 实际尺寸 210×297mm · 共 ' + n + ' 题';

    fitScale();
  }

  // ===== 预览等比缩放 =====
  function fitScale() {
    var wrapW = document.querySelector('.preview').clientWidth - 8;
    var s = Math.min(1, wrapW / (210 * 96 / 25.4));
    document.documentElement.style.setProperty('--s', s > 0 ? s : 1);
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* 忽略 */ }
  }

  function bindActive(id, val) {
    Array.prototype.forEach.call(document.querySelectorAll('#' + id + ' button'), function (b) {
      b.classList.toggle('on', Number(b.dataset.v) === val);
    });
  }

  function syncUI() {
    numCount.value = state.count;
    chkId.checked = state.idShow;
    bindActive('segCount', state.count);
    bindActive('segOpts', state.opts);
    bindActive('segPerRow', state.perRow);
  }

  // ===== 事件绑定 =====
  function bindSeg(id, key) {
    document.getElementById(id).addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      state[key] = Number(b.dataset.v);
      bindActive(id, state[key]);
      numCount.value = state.count;
      save();
      render();
    });
  }
  bindSeg('segCount', 'count');
  bindSeg('segOpts', 'opts');
  bindSeg('segPerRow', 'perRow');

  numCount.addEventListener('input', function () {
    var v = parseInt(numCount.value, 10);
    if (isNaN(v)) return;
    state.count = Math.max(1, Math.min(150, v));
    bindActive('segCount', state.count);
    save();
    render();
  });
  numCount.addEventListener('blur', function () {
    numCount.value = state.count;
  });

  chkId.addEventListener('change', function () {
    state.idShow = chkId.checked;
    save();
    render();
  });

  document.getElementById('btnPrint').addEventListener('click', function () {
    window.print();
  });

  document.getElementById('btnReset').addEventListener('click', function () {
    state = Object.assign({}, DEF);
    save();
    syncUI();
    render();
  });

  window.addEventListener('resize', fitScale);

  syncUI();
  save();
  render();
})();
</script>
</body>
</html>
