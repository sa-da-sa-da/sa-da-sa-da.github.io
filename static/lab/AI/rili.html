<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>教师工作日历 · 学期周历生成/备注标记/A4打印 | 当以读书通世事</title>
<link rel="canonical" href="https://www.sakaay.com/lab/AI/rili.html">
<meta name="description" content="教师工作日历：输入学期名称与开学日期，自动生成 18~22 周的 A4 周历表，每行标注起止日期并可填写节假日、考试周、家长会等备注，支持开学周/考试周/期末周标记与本周高亮，一键打印 A4 纵向。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
html{-webkit-print-color-adjust:exact;print-color-adjust:exact}
body{
  font-family:'PingFang SC','Microsoft YaHei',sans-serif;
  color:#243447;
  background:linear-gradient(180deg,#eef3f9 0%,#e2e9f2 100%);
  min-height:100vh;
  padding:24px 16px 40px;
}
.page{max-width:960px;margin:0 auto;display:flex;flex-direction:column;gap:16px}

/* ===== 页头 ===== */
.app-head h1{font-size:26px;color:#163a5f;letter-spacing:2px}
.app-head p{font-size:13.5px;color:#5f7391;margin-top:6px;line-height:1.7}

/* ===== 设置区 ===== */
.settings{
  background:#fff;border-radius:14px;padding:16px 18px;
  box-shadow:0 4px 16px rgba(30,58,95,.1);
  display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;align-items:end;
}
.field{display:flex;flex-direction:column;gap:5px}
.field label{font-size:12px;font-weight:700;color:#5b6b80;letter-spacing:.5px}
.field input,.field select{
  width:100%;padding:9px 10px;border:1px solid #cfd9e6;border-radius:9px;
  background:#fbfdff;color:#1f2d3d;font-size:14px;font-family:inherit;outline:none;
  transition:border-color .18s,box-shadow .18s;
}
.field input:focus,.field select:focus{border-color:#2563eb;box-shadow:0 0 0 3px rgba(37,99,235,.12)}
.print-field{display:flex;align-items:end}
.btn-print{
  width:100%;padding:10px 18px;border:none;border-radius:9px;cursor:pointer;
  background:linear-gradient(135deg,#2563eb,#1b4b9c);color:#fff;
  font-size:14px;font-weight:700;font-family:inherit;letter-spacing:1px;
  box-shadow:0 6px 14px rgba(37,99,235,.25);transition:transform .18s,box-shadow .18s;
}
.btn-print:hover{transform:translateY(-2px);box-shadow:0 10px 20px rgba(37,99,235,.32)}

/* ===== A4 纸张 ===== */
.sheet-wrap{overflow-x:auto;padding-bottom:8px}
.sheet{
  width:210mm;min-height:297mm;margin:0 auto;background:#fff;
  padding:14mm 14mm 12mm;border-radius:2px;
  box-shadow:0 10px 30px rgba(20,40,70,.16);
}
.sheet-title{text-align:center;font-size:22px;font-weight:700;color:#163a5f;letter-spacing:2px}
.sheet-meta{text-align:center;font-size:12.5px;color:#6b7c92;margin:7px 0 14px;letter-spacing:.5px}
.cal-table{width:100%;border-collapse:collapse;table-layout:fixed}
.cal-table th{
  background:#24405f;color:#fff;font-size:13px;font-weight:600;
  padding:8px 8px;border:1px solid #24405f;letter-spacing:1px;
}
.cal-table td{
  border:1px solid #d3dce8;padding:8px 9px;font-size:13px;color:#243447;
  vertical-align:middle;
}
.col-week{width:16%}
.col-date{width:25%}
.col-mark{width:25%}
tr:nth-child(even) td{background:#f7f9fc}

.cell-week{font-weight:600;color:#163a5f;white-space:nowrap}
.cell-date{white-space:nowrap;font-variant-numeric:tabular-nums;color:#3c5372}
.today-tag{
  display:inline-block;margin-left:6px;padding:1px 6px;border-radius:8px;
  background:#2563eb;color:#fff;font-size:10.5px;font-weight:600;letter-spacing:.5px;
}
/* 本周行高亮边框 */
tr.is-today td{border-top:2px solid #2563eb;border-bottom:2px solid #2563eb}
tr.is-today td:first-child{border-left:2px solid #2563eb}
tr.is-today td:last-child{border-right:2px solid #2563eb}

/* 备注输入 */
.remark-input{
  width:100%;border:1px dashed transparent;border-radius:6px;background:transparent;
  padding:4px 6px;font-size:12.5px;font-family:inherit;color:#243447;outline:none;
}
.remark-input::placeholder{color:#aab6c6}
.remark-input:hover{border-color:#dbe4ef;background:#fbfdff}
.remark-input:focus{border-color:#2563eb;background:#fff;box-shadow:0 0 0 2px rgba(37,99,235,.12)}

/* 特殊标记 */
.cell-mark{display:flex;flex-wrap:wrap;gap:5px;align-items:center}
.mark-chk{
  display:inline-flex;align-items:center;gap:3px;padding:2px 7px;border-radius:7px;
  border:1px solid #e1e8f1;background:#f2f5f9;font-size:11.5px;color:#6b7c92;cursor:pointer;
  white-space:nowrap;transition:all .15s;
}
.mark-chk input{accent-color:#2563eb;cursor:pointer}
.mark-chk input:checked + span{color:#163a5f;font-weight:700}
.mark-chk:hover{border-color:#c3d3e6;background:#eaf1f9}

/* 行底色 */
tr.mark-open td{background:#eafaf0}
tr.mark-exam td{background:#fff6e6}
tr.mark-finish td{background:#eaf0fd}

/* 打印专用标记徽章 */
.badge{display:none;padding:1px 7px;border-radius:9px;font-size:11px;border:1px solid;margin-right:4px;white-space:nowrap}
.badge-open{color:#166534;background:#dcfce7;border-color:#86efac}
.badge-exam{color:#9a3412;background:#ffedd5;border-color:#fdba74}
.badge-finish{color:#1e3a8a;background:#dbeafe;border-color:#93c5fd}

.sheet-foot{margin-top:12px;text-align:center;font-size:11px;color:#8b9bb2;letter-spacing:.5px}
.tip-cell{text-align:center;color:#8b9bb2;padding:26px 10px!important}

/* ===== 小屏适配 ===== */
@media (max-width:820px){
  body{padding:14px 10px 30px}
  .sheet{width:100%;min-height:0;padding:16px 14px}
  .app-head h1{font-size:20px}
  .cal-table td,.cal-table th{font-size:12px;padding:6px}
}

/* ===== 打印 A4 纵向 ===== */
@media print{
  @page{size:A4 portrait;margin:12mm}
  body{background:#fff!important;padding:0;min-height:0}
  .no-print{display:none!important}
  .page{max-width:none;margin:0;display:block}
  .sheet-wrap{overflow:visible;padding:0}
  .sheet{width:auto;min-height:0;margin:0;padding:0;box-shadow:none;border-radius:0}
  .sheet-title{font-size:15pt}
  .sheet-meta{font-size:8.5pt;margin:4px 0 8px}
  .cal-table th{font-size:9.5pt;padding:5px 6px;background:#24405f!important}
  .cal-table td{font-size:9.5pt;padding:4px 6px}
  .remark-input{border:none!important;background:transparent!important;box-shadow:none!important;padding:0;font-size:9.5pt}
  .remark-input::placeholder{color:transparent}
  .cell-mark{display:block}
  .mark-chk{display:none}
  .badge{display:inline-block}
  .today-tag{font-size:8pt;padding:0 4px}
  .sheet-foot{display:none}
  tr{page-break-inside:avoid}
  thead{display:table-header-group}
}
</style>
</head>
<body>
<div class="page">
  <!-- 页头（打印隐藏） -->
  <header class="app-head no-print">
    <h1>教师工作日历</h1>
    <p>按学期生成周历表：一行一周，填好备注与特殊标记后，可直接打印 A4 纵向贴在办公桌上</p>
  </header>

  <!-- 设置区（打印隐藏） -->
  <section class="settings no-print">
    <div class="field">
      <label for="termName">学期名称</label>
      <input id="termName" type="text" maxlength="24" placeholder="如 2026 学年第一学期">
    </div>
    <div class="field">
      <label for="startDate">开学第一天</label>
      <input id="startDate" type="date">
    </div>
    <div class="field">
      <label for="totalWeeks">总周数</label>
      <select id="totalWeeks">
        <option value="18">18 周</option>
        <option value="19">19 周</option>
        <option value="20" selected>20 周</option>
        <option value="21">21 周</option>
        <option value="22">22 周</option>
      </select>
    </div>
    <div class="field">
      <label for="weekStart">每周起始日</label>
      <select id="weekStart">
        <option value="1" selected>周一</option>
        <option value="0">周日</option>
      </select>
    </div>
    <div class="field print-field">
      <button class="btn-print" id="btnPrint" type="button">打印 A4</button>
    </div>
  </section>

  <!-- A4 周历表 -->
  <section class="sheet-wrap">
    <div class="sheet" id="sheet">
      <h2 class="sheet-title" id="sheetTitle">学期周历</h2>
      <div class="sheet-meta" id="sheetMeta"></div>
      <table class="cal-table" id="calTable">
        <colgroup>
          <col class="col-week">
          <col class="col-date">
          <col>
          <col class="col-mark">
        </colgroup>
        <thead>
          <tr>
            <th>周次</th>
            <th>起止日期</th>
            <th>备注</th>
            <th>标记</th>
          </tr>
        </thead>
        <tbody id="calBody"></tbody>
      </table>
      <p class="sheet-foot">今日所在周已加框标注 · 备注可填写节假日、考试周、家长会等安排</p>
    </div>
  </section>
</div>

<script>
(function(){
  'use strict';

  var STORAGE_KEY = 'rili_teacher_v1';
  var MARK_DEFS = [
    {key:'open',   label:'开学周', badgeClass:'badge-open',   rowClass:'mark-open'},
    {key:'exam',   label:'考试周', badgeClass:'badge-exam',   rowClass:'mark-exam'},
    {key:'finish', label:'期末周', badgeClass:'badge-finish', rowClass:'mark-finish'}
  ];

  var config = {term:'', startDate:'', weeks:20, weekStart:1};
  var remarks = {};   // {周次: 备注文字}
  var marks = {};     // {周次: {open:true, exam:true, finish:true}}

  function pad2(n){ return n < 10 ? '0' + n : String(n); }
  function escapeHtml(str){
    return String(str).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }
  function parseDate(str){
    if(!str) return null;
    var p = String(str).split('-');
    if(p.length < 3) return null;
    var d = new Date(Number(p[0]), Number(p[1]) - 1, Number(p[2]));
    return isNaN(d.getTime()) ? null : d;
  }
  function addDays(d, n){
    var r = new Date(d.getFullYear(), d.getMonth(), d.getDate());
    r.setDate(r.getDate() + n);
    return r;
  }
  function fmtShort(d){ return pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }
  function fmtFull(d){ return d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate()); }

  // 取某日期所在周的起始日（startDay：1 周一 / 0 周日）
  function alignWeekStart(date, startDay){
    var d = new Date(date.getFullYear(), date.getMonth(), date.getDate());
    var shift = (d.getDay() - startDay + 7) % 7;
    return addDays(d, -shift);
  }

  // ===== 默认配置：按当前月份推断学年 =====
  function defaultConfig(){
    var now = new Date();
    var y = now.getFullYear();
    if(now.getMonth() >= 7){
      // 8 月及以后视为新学年第一学期
      return {term:(y + ' 学年第一学期'), startDate:(y + '-09-01'), weeks:20, weekStart:1};
    }
    // 其余月份视为当年春季学期
    return {term:((y - 1) + ' 学年第二学期'), startDate:(y + '-02-01'), weeks:20, weekStart:1};
  }

  // ===== 存储 =====
  function loadData(){
    var raw = null;
    try{ raw = localStorage.getItem(STORAGE_KEY); }catch(e){ raw = null; }
    var def = defaultConfig();
    if(raw){
      try{
        var data = JSON.parse(raw);
        config = {
          term: String(data.term || def.term),
          startDate: String(data.startDate || def.startDate),
          weeks: clampWeeks(Number(data.weeks)),
          weekStart: Number(data.weekStart) === 0 ? 0 : 1
        };
        remarks = (data.remarks && typeof data.remarks === 'object') ? data.remarks : {};
        marks = (data.marks && typeof data.marks === 'object') ? data.marks : {};
        return;
      }catch(e){ /* 数据损坏时用默认值 */ }
    }
    config = def;
    remarks = {};
    marks = {};
    saveData();
  }

  function clampWeeks(n){
    if(!n || n < 18) return 20;
    if(n > 22) return 22;
    return n;
  }

  function saveData(){
    try{
      localStorage.setItem(STORAGE_KEY, JSON.stringify({
        term: config.term,
        startDate: config.startDate,
        weeks: config.weeks,
        weekStart: config.weekStart,
        remarks: remarks,
        marks: marks
      }));
    }catch(e){ console.warn('本地存储写入失败', e); }
  }

  // ===== 渲染表格 =====
  function render(){
    var body = document.getElementById('calBody');
    var title = document.getElementById('sheetTitle');
    var meta = document.getElementById('sheetMeta');
    if(!body || !title || !meta) return;

    title.textContent = config.term || '学期周历';

    var start = parseDate(config.startDate);
    if(!start){
      meta.textContent = '请先设置开学第一天';
      body.innerHTML = '<tr><td class="tip-cell" colspan="4">尚未设置开学日期，请在上方选择</td></tr>';
      return;
    }

    var base = alignWeekStart(start, config.weekStart);
    var today = new Date();
    today.setHours(0, 0, 0, 0);
    var rows = [];

    for(var i = 0; i < config.weeks; i++){
      var weekNo = i + 1;
      var ws = addDays(base, i * 7);
      var we = addDays(ws, 6);
      var m = marks[String(weekNo)] || {};
      var isToday = today.getTime() >= ws.getTime() && today.getTime() <= we.getTime();

      var rowClasses = [];
      var badges = '';
      var checks = '';
      MARK_DEFS.forEach(function(def){
        if(m[def.key]) rowClasses.push(def.rowClass);
        // 打印徽章
        if(m[def.key]) badges += '<span class="badge ' + def.badgeClass + '">' + def.label + '</span>';
        // 勾选项
        checks += '<label class="mark-chk"><input type="checkbox" data-week="' + weekNo + '" data-mark="' + def.key + '"' +
                  (m[def.key] ? ' checked' : '') + '><span>' + def.label + '</span></label>';
      });
      if(isToday) rowClasses.push('is-today');

      var remarkVal = remarks[String(weekNo)] || '';

      rows.push(
        '<tr class="' + rowClasses.join(' ') + '" data-week="' + weekNo + '">' +
          '<td class="cell-week">第 ' + weekNo + ' 周' + (isToday ? '<span class="today-tag">本周</span>' : '') + '</td>' +
          '<td class="cell-date">' + fmtShort(ws) + ' ~ ' + fmtShort(we) + '</td>' +
          '<td><input class="remark-input" type="text" data-week="' + weekNo + '" value="' + escapeHtml(remarkVal) + '" placeholder="节假日 / 家长会 / 月考…"></td>' +
          '<td class="cell-mark">' + badges + checks + '</td>' +
        '</tr>'
      );
    }

    body.innerHTML = rows.join('');
    meta.textContent = '共 ' + config.weeks + ' 周 · 每周从' + (config.weekStart === 1 ? '周一' : '周日') +
                       '开始 · 开学 ' + fmtFull(start);
  }

  // ===== 设置同步到控件 =====
  function syncControls(){
    var termEl = document.getElementById('termName');
    var startEl = document.getElementById('startDate');
    var weeksEl = document.getElementById('totalWeeks');
    var wsEl = document.getElementById('weekStart');
    if(termEl) termEl.value = config.term;
    if(startEl) startEl.value = config.startDate;
    if(weeksEl) weeksEl.value = String(config.weeks);
    if(wsEl) wsEl.value = String(config.weekStart);
  }

  // ===== 事件绑定 =====
  function bindEvents(){
    var termEl = document.getElementById('termName');
    if(termEl){
      termEl.addEventListener('input', function(){
        config.term = termEl.value.trim();
        saveData();
        render();
      });
    }

    var startEl = document.getElementById('startDate');
    if(startEl){
      startEl.addEventListener('change', function(){
        config.startDate = startEl.value;
        saveData();
        render();
      });
    }

    var weeksEl = document.getElementById('totalWeeks');
    if(weeksEl){
      weeksEl.addEventListener('change', function(){
        config.weeks = clampWeeks(Number(weeksEl.value));
        saveData();
        render();
      });
    }

    var wsEl = document.getElementById('weekStart');
    if(wsEl){
      wsEl.addEventListener('change', function(){
        config.weekStart = Number(wsEl.value) === 0 ? 0 : 1;
        saveData();
        render();
      });
    }

    var body = document.getElementById('calBody');
    if(body){
      // 备注输入：逐字保存，不重绘以免丢失焦点
      body.addEventListener('input', function(e){
        if(!e.target.classList.contains('remark-input')) return;
        var week = e.target.getAttribute('data-week');
        remarks[week] = e.target.value;
        saveData();
      });

      // 特殊标记勾选
      body.addEventListener('change', function(e){
        if(!e.target.matches('input[data-mark]')) return;
        var week = e.target.getAttribute('data-week');
        var key = e.target.getAttribute('data-mark');
        if(!marks[week]) marks[week] = {};
        marks[week][key] = e.target.checked;
        saveData();
        render();
      });
    }

    var btnPrint = document.getElementById('btnPrint');
    if(btnPrint){
      btnPrint.addEventListener('click', function(){ window.print(); });
    }
  }

  loadData();
  syncControls();
  bindEvents();
  render();
})();
</script>
</body>
</html>
