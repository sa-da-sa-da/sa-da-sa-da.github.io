<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英语单词默写纸 · 英译中/中译英/听写 A4 打印 | 当以读书通世事</title>
<link rel="canonical" href="https://www.sakaay.com/lab/AI/moxie.html">
<meta name="description" content="英语单词默写纸生成器：粘贴单词表即可生成英译中、中译英或纯听写三种模式的 A4 默写纸，支持每页题数、两栏排版与答案页，含姓名班级日期得分页头。支持按单元导入单词、设置中英文顺序与首字母提示，适合单元复习、早读检测与家校听写练习。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#20312f;--muted:#6b7a78;--line:#e2e9e7;
  --brand:#2f7d6e;--brand-l:#e9f4f1;--bg:#f3f6f5;--card:#fff;
  --s:1;
}
body{font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}

/* ===== 布局 ===== */
.app{display:flex;gap:18px;padding:18px;max-width:1360px;margin:0 auto;align-items:flex-start}
.panel{width:330px;flex:0 0 330px;background:var(--card);border-radius:14px;padding:18px;box-shadow:0 4px 20px rgba(20,50,45,.07);position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto}
.panel h2{font-size:16px;font-weight:700;margin-bottom:4px}
.panel .sub{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.6}
.field{margin-bottom:16px}
.field>label{display:block;font-size:13px;font-weight:600;color:#40514e;margin-bottom:7px}
textarea{width:100%;min-height:190px;resize:vertical;border:1px solid var(--line);border-radius:10px;padding:10px;font-size:14px;line-height:1.75;font-family:inherit;outline:none;color:var(--ink);background:#fbfdfc;transition:border-color .2s}
textarea:focus{border-color:var(--brand)}
.hint{font-size:11px;color:#93a29f;margin-top:5px;line-height:1.5}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:60px;padding:8px 6px;border:1px solid var(--line);background:#fbfdfc;border-radius:9px;font-size:13px;color:#5a6b68;cursor:pointer;transition:all .18s;font-family:inherit}
.seg button:hover{border-color:#bcd6d0}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:#40514e;cursor:pointer;padding:5px 0}
.check input{width:16px;height:16px;accent-color:var(--brand);cursor:pointer}
.actions{display:flex;gap:8px;margin-top:4px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .18s}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:#276a5d}
.btn.ghost{background:#f0f4f3;color:#5a6b68}
.btn.ghost:hover{background:#e5ecea}
.tip{margin-top:12px;font-size:12px;color:#5a6b68;line-height:1.7;background:var(--brand-l);border-radius:9px;padding:9px 11px}
.tip.warn{background:#fff4e6;color:#9a6420}

/* ===== 预览 ===== */
.preview{flex:1;min-width:0;padding:0 4px 40px;display:flex;flex-direction:column}
.preview-note{font-size:12px;color:#8fa09d;text-align:center;margin-bottom:10px}
.pages{display:flex;flex-direction:column;align-items:center}
.page-shell{width:100%;height:calc(297mm * var(--s));display:flex;justify-content:center;margin-bottom:18px}

/* ===== A4 纸面 ===== */
.paper{
  width:210mm;height:297mm;background:#fff;padding:12mm;
  box-shadow:0 8px 30px rgba(20,50,45,.16);border-radius:1mm;
  transform:scale(var(--s));transform-origin:top center;flex:0 0 auto;
  display:flex;flex-direction:column;
}

/* 页头 */
.sheet-head{flex:0 0 auto;height:17mm;display:flex;align-items:flex-end;justify-content:space-between;gap:6mm;border-bottom:.4mm solid #c6d2cf;padding-bottom:2mm}
.hd-title{font-size:5mm;font-weight:800;letter-spacing:.6mm;white-space:nowrap}
.hd-fields{display:flex;align-items:flex-end;gap:3.6mm;font-size:3.1mm;color:#333;white-space:nowrap}
.hd-fields b{display:inline-block;width:15mm;height:4mm;border-bottom:.28mm solid #555;margin-left:.8mm}
.hd-fields .shorter b{width:11mm}

/* 题目主体 */
.q-body{flex:1;display:flex;gap:8mm;padding-top:3mm;overflow:hidden}
.q-col{flex:1;min-width:0;display:flex;flex-direction:column}
.q-col.split{border-right:.25mm dashed #dde6e3;padding-right:6mm}
.q-row{display:flex;align-items:center;gap:2.6mm}
.no{flex:0 0 7mm;font-size:3.8mm;color:#5c6c69;text-align:left;line-height:1}
.prompt{flex:0 0 var(--pw);font-size:3.9mm;color:#1c2b29;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;line-height:1.1}
.prompt.cn{font-size:4.1mm}
.line{flex:1;height:6.5mm;border-bottom:.28mm solid #bcc8c5}
.line.fixed{flex:0 0 auto}

/* 页脚 */
.page-foot{flex:0 0 auto;height:5mm;display:flex;align-items:flex-end;justify-content:flex-end;font-size:2.3mm;color:#9aa9a6}

/* 答案页 */
.ans-head{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;border-bottom:.4mm solid #c6d2cf;padding-bottom:2mm;margin-bottom:3mm}
.ans-head .t{font-size:4.6mm;font-weight:800}
.ans-head .s{font-size:2.6mm;color:#8b9a97}
.ans-row{display:grid;grid-template-columns:10mm 62mm 1fr;gap:3mm;align-items:center;border-bottom:.2mm solid #e3eae8;font-size:3.3mm;color:#243330;padding:0 1mm}
.ans-row.th{font-weight:700;background:#f4f8f7;border-bottom:.35mm solid #c9d4d1;color:#1c2b29}
.ans-row .cn{color:#40514e}

/* ===== 打印 ===== */
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fff}
  .panel,.preview-note{display:none !important}
  .app{display:block;padding:0;margin:0;max-width:none}
  .preview{padding:0;display:block}
  .pages{display:block}
  .page-shell{display:block;height:auto !important;margin:0;page-break-after:always;break-after:page}
  .page-shell:last-child{page-break-after:auto;break-after:auto}
  .paper{transform:none !important;box-shadow:none;border-radius:0;margin:0;overflow:hidden;page-break-inside:avoid;height:295mm;padding:11mm 12mm}
}

/* ===== 窄屏 ===== */
@media (max-width:980px){
  .app{flex-direction:column;padding:12px}
  .panel{width:100%;flex:none;position:static;max-height:none}
  .preview{width:100%}
}
</style>
</head>
<body>
<h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">英语单词默写纸 · 三种模式与答案页</h1>
<div class="app">
  <aside class="panel">
    <h2>英语单词默写纸</h2>
    <p class="sub">粘贴单词表，一键生成默写纸，三种模式可切换，支持答案页与两栏排版。</p>

    <div class="field">
      <label>单词表</label>
      <textarea id="txt" placeholder="每行一条：word,中文">apple,苹果
library,图书馆
different,不同的
important,重要的
because,因为
together,一起
practice,练习
friendly,友好的
question,问题
sports,运动</textarea>
      <div class="hint">每行一条，支持「word,中文」或纯单词；中文用中英文逗号均可。</div>
    </div>

    <div class="field">
      <label>默写模式</label>
      <div class="seg" id="segMode">
        <button data-v="ec">英译中</button>
        <button data-v="ce">中译英</button>
        <button data-v="dict">纯听写</button>
      </div>
    </div>

    <div class="field">
      <label>每页题数</label>
      <div class="seg" id="segPer">
        <button data-v="10">10 题</button>
        <button data-v="15">15 题</button>
        <button data-v="20">20 题</button>
      </div>
    </div>

    <div class="field">
      <label class="check"><input type="checkbox" id="chkAns"> 生成答案页（另起一页，显示完整对照表）</label>
      <label class="check"><input type="checkbox" id="chkTwo"> 两栏排版</label>
    </div>

    <div class="actions">
      <button class="btn primary" id="btnPrint">打印默写纸</button>
      <button class="btn ghost" id="btnReset">恢复示例</button>
    </div>

    <div class="tip" id="tip"></div>
  </aside>

  <main class="preview">
    <div class="preview-note" id="previewNote">A4 纸面预览</div>
    <div class="pages" id="pages"></div>
  </main>
</div>

<script>
(function(){
  'use strict';

  var KEY = 'moxie_state_v1';
  var DEF_TEXT = [
    'apple,苹果',
    'library,图书馆',
    'different,不同的',
    'important,重要的',
    'because,因为',
    'together,一起',
    'practice,练习',
    'friendly,友好的',
    'question,问题',
    'sports,运动'
  ].join('\n');
  var DEF = { text: DEF_TEXT, mode: 'ec', perPage: 10, answers: false, twoCol: false };

  var state = Object.assign({}, DEF);
  try {
    var saved = localStorage.getItem(KEY);
    if (saved) state = Object.assign(state, JSON.parse(saved));
  } catch (e) { /* 隐私模式下忽略存储异常 */ }

  var pagesEl = document.getElementById('pages');
  var txt = document.getElementById('txt');
  var tip = document.getElementById('tip');
  var previewNote = document.getElementById('previewNote');
  var chkAns = document.getElementById('chkAns');
  var chkTwo = document.getElementById('chkTwo');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // ===== 解析单词表：每行「word,中文」或纯单词 =====
  function parseWords() {
    return String(state.text || '').split(/\r?\n/).map(function (line) {
      return line.trim();
    }).filter(function (line) {
      return line.length > 0;
    }).map(function (line) {
      var parts = line.split(/[,，\t]/);
      return {
        w: (parts[0] || '').trim(),
        c: (parts[1] || '').trim()
      };
    }).filter(function (it) {
      return it.w.length > 0;
    });
  }

  // ===== 单个题行 =====
  function rowHTML(item, mode, rh, promptW, maxLineW) {
    var prompt = '';
    if (mode === 'ec') {
      prompt = '<span class="prompt">' + esc(item.w) + '</span>';
    } else if (mode === 'ce') {
      prompt = '<span class="prompt cn">' + esc(item.c || '—') + '</span>';
    }

    var lineStyle = '';
    if (mode === 'ce') {
      // 中译英：横线长度按单词长度预留
      var lw = Math.max(20, Math.min(maxLineW, item.w.length * 4.2));
      lineStyle = 'width:' + lw + 'mm';
    }

    return '<div class="q-row" style="height:' + rh + 'mm;--pw:' + promptW + 'mm">' +
      '<span class="no">' + item.no + '.</span>' +
      prompt +
      '<span class="line' + (lineStyle ? ' fixed' : '') + '" style="' + lineStyle + '"></span>' +
    '</div>';
  }

  // ===== 默写纸页面 =====
  function sheetHTML(items, mode, twoCol, pageNo, pageTotal) {
    var left = items, right = [];
    if (twoCol) {
      var half = Math.ceil(items.length / 2);
      left = items.slice(0, half);
      right = items.slice(half);
    }
    var rowsPerCol = Math.max(1, Math.max(left.length, right.length));
    var rh = Math.min(14, 240 / rowsPerCol);
    var promptW = twoCol ? (mode === 'dict' ? 0 : 26) : (mode === 'dict' ? 0 : 36);
    var maxLineW = twoCol ? 44 : 130;

    function colHTML(list, isSplit) {
      return '<div class="q-col' + (isSplit ? ' split' : '') + '">' +
        list.map(function (it) { return rowHTML(it, mode, rh, promptW, maxLineW); }).join('') +
      '</div>';
    }

    var body = '<div class="q-body">' + colHTML(left, twoCol) +
      (twoCol ? colHTML(right, false) : '') + '</div>';

    return '<div class="page-shell"><div class="paper">' +
      '<div class="sheet-head">' +
        '<div class="hd-title">英语单词默写</div>' +
        '<div class="hd-fields">' +
          '<span>姓名<b></b></span>' +
          '<span>班级<b></b></span>' +
          '<span>日期<b></b></span>' +
          '<span class="shorter">得分<b></b></span>' +
        '</div>' +
      '</div>' +
      body +
      '<div class="page-foot">第 ' + pageNo + ' / ' + pageTotal + ' 页</div>' +
    '</div></div>';
  }

  // ===== 答案页 =====
  function answerHTML(items, pageNo, pageTotal) {
    var all = items;
    var rh = Math.min(9, 225 / Math.max(1, all.length));
    var rows = all.map(function (it) {
      return '<div class="ans-row" style="height:' + rh + 'mm">' +
        '<span>' + it.no + '</span>' +
        '<span>' + esc(it.w) + '</span>' +
        '<span class="cn">' + esc(it.c || '—') + '</span>' +
      '</div>';
    }).join('');

    return '<div class="page-shell"><div class="paper">' +
      '<div class="ans-head"><span class="t">英语单词默写 · 答案页</span><span class="s">教师核对用</span></div>' +
      '<div class="ans-row th" style="height:8mm"><span>序号</span><span>英文</span><span>中文</span></div>' +
      rows +
      '<div class="page-foot" style="margin-top:auto">答案 ' + pageNo + ' / ' + pageTotal + ' 页</div>' +
    '</div></div>';
  }

  // ===== 渲染全部页面 =====
  function render() {
    var words = parseWords();
    var perPage = state.perPage;
    var mode = state.mode;
    var qTotal = Math.max(1, Math.ceil(words.length / perPage));
    var html = '';

    for (var p = 0; p < qTotal; p++) {
      var start = p * perPage;
      var slice = words.slice(start, start + perPage).map(function (it, k) {
        return { no: start + k + 1, w: it.w, c: it.c };
      });
      html += sheetHTML(slice, mode, state.twoCol, p + 1, qTotal);
    }

    var ansTotal = 0;
    if (state.answers && words.length) {
      var ANS_PER_PAGE = 25;
      ansTotal = Math.ceil(words.length / ANS_PER_PAGE);
      for (var a = 0; a < ansTotal; a++) {
        var chunk = words.slice(a * ANS_PER_PAGE, (a + 1) * ANS_PER_PAGE).map(function (it, k) {
          return { no: a * ANS_PER_PAGE + k + 1, w: it.w, c: it.c };
        });
        html += answerHTML(chunk, a + 1, ansTotal);
      }
    }

    pagesEl.innerHTML = html;

    var modeName = { ec: '英译中', ce: '中译英', dict: '纯听写' }[mode] || '';
    tip.className = words.length ? 'tip' : 'tip warn';
    tip.textContent = words.length
      ? '共 ' + words.length + ' 词 · ' + modeName + ' · 每页 ' + perPage + ' 词 · 默写纸 ' + qTotal + ' 页' +
        (ansTotal ? ' + 答案 ' + ansTotal + ' 页' : '') + (state.twoCol ? ' · 两栏排版' : '')
      : '还没有单词，请在上方输入，每行一条。';
    previewNote.textContent = 'A4 纸面预览 · 共 ' + (qTotal + ansTotal) + ' 页 · 模式：' + modeName;

    fitScale();
  }

  // ===== 预览等比缩放 =====
  function fitScale() {
    var wrapW = document.querySelector('.preview').clientWidth - 8;
    var s = Math.min(1, wrapW / (210 * 96 / 25.4));
    document.documentElement.style.setProperty('--s', s > 0 ? s : 1);
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) { /* 忽略 */ }
  }

  function bindActive(id, val) {
    Array.prototype.forEach.call(document.querySelectorAll('#' + id + ' button'), function (b) {
      b.classList.toggle('on', (isNaN(Number(val)) ? b.dataset.v === val : Number(b.dataset.v) === Number(val)));
    });
  }

  function syncUI() {
    txt.value = state.text;
    chkAns.checked = state.answers;
    chkTwo.checked = state.twoCol;
    bindActive('segMode', state.mode);
    bindActive('segPer', state.perPage);
  }

  // ===== 事件绑定 =====
  var timer = null;
  txt.addEventListener('input', function () {
    clearTimeout(timer);
    timer = setTimeout(function () {
      state.text = txt.value;
      save();
      render();
    }, 200);
  });

  function bindSeg(id, key, isNum) {
    document.getElementById(id).addEventListener('click', function (e) {
      var b = e.target.closest('button');
      if (!b) return;
      state[key] = isNum ? Number(b.dataset.v) : b.dataset.v;
      bindActive(id, state[key]);
      save();
      render();
    });
  }
  bindSeg('segMode', 'mode', false);
  bindSeg('segPer', 'perPage', true);

  chkAns.addEventListener('change', function () {
    state.answers = chkAns.checked;
    save();
    render();
  });

  chkTwo.addEventListener('change', function () {
    state.twoCol = chkTwo.checked;
    save();
    render();
  });

  document.getElementById('btnPrint').addEventListener('click', function () {
    window.print();
  });

  document.getElementById('btnReset').addEventListener('click', function () {
    state = Object.assign({}, DEF);
    save();
    syncUI();
    render();
  });

  window.addEventListener('resize', fitScale);

  syncUI();
  save();
  render();
})();
</script>
</body>
</html>
