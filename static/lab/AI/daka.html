<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>课堂打卡单 · 动物头像点名打卡 投屏互动 | 当以读书通世事</title>
<link rel="canonical" href="https://www.sakaay.com/lab/AI/daka.html">
<meta name="description" content="课堂打卡单：给学生分配动物头像，点一下卡片就飞到已完成区，配进度条与完成礼花，支持重置与多轮打卡。支持按小组切换与批量导入名单，完成进度实时显示，适合课堂任务、阅读打卡与习惯养成，可一键重置开始新一轮，也能导出结果用于班级记录。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#23343a;--muted:#6f8388;--line:#e0ecEE;
  --brand:#1f9d7a;--brand2:#f2a33c;--bg:#eef8f6;--card:#fff;
}
body{font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;background:linear-gradient(160deg,#e9f7f2,#e6f0fb 60%,#fdf2e3);color:var(--ink);-webkit-font-smoothing:antialiased;min-height:100vh}
.app{padding:18px;max-width:1400px;margin:0 auto}
/* ===== 顶部 ===== */
.topbar{background:#fff;border-radius:16px;padding:16px 20px;box-shadow:0 6px 22px rgba(31,157,122,.1);margin-bottom:16px}
.top-line{display:flex;align-items:center;justify-content:space-between;gap:14px;flex-wrap:wrap}
.title{font-size:20px;font-weight:800;letter-spacing:.5px}
.title span{color:var(--brand)}
.progress-wrap{flex:1;min-width:180px;display:flex;align-items:center;gap:12px}
.progress{flex:1;height:12px;background:#e7f1ef;border-radius:8px;overflow:hidden}
.progress i{display:block;height:100%;width:0;background:linear-gradient(90deg,#3ecfa4,#1f9d7a);border-radius:8px;transition:width .35s}
.pnum{font-size:15px;font-weight:700;color:#3f5952;white-space:nowrap}
.pnum b{color:var(--brand);font-size:18px}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.btn{padding:9px 16px;border:none;border-radius:10px;font-size:13.5px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .18s}
.btn.main{background:var(--brand);color:#fff}
.btn.main:hover{background:#178567}
.btn.lite{background:#eef4f3;color:#4d635d}
.btn.lite:hover{background:#e2ecea}
.btn.warn{background:#fff3e5;color:#a2610f}
.btn.warn:hover{background:#ffe9d2}
/* ===== 名单输入 ===== */
.roster-box{background:#fff;border-radius:14px;padding:16px;box-shadow:0 4px 16px rgba(31,157,122,.07);margin-bottom:16px;display:none}
.roster-box.show{display:block}
.roster-box textarea{width:100%;min-height:110px;resize:vertical;border:1px solid #dcebe7;border-radius:10px;padding:10px;font-size:14px;line-height:1.8;font-family:inherit;outline:none;color:var(--ink);background:#fbfefd}
.roster-box textarea:focus{border-color:var(--brand)}
.roster-box .hint{font-size:12px;color:var(--muted);margin-top:8px}
/* ===== 两个区 ===== */
.zone{background:#fff;border-radius:16px;padding:16px;box-shadow:0 6px 22px rgba(31,157,122,.08);margin-bottom:16px}
.zone.done-zone{background:linear-gradient(160deg,#f0fbf6,#e9f8f1);border:2px dashed #b8e3d2}
.zone-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}
.zone-head .zt{font-size:15px;font-weight:800;color:#2f4d45;display:flex;align-items:center;gap:8px}
.zone-head .zt em{font-style:normal;font-size:12px;font-weight:600;color:#7b928c;background:#f0f6f4;border-radius:10px;padding:3px 9px}
.grid{display:flex;flex-wrap:wrap;gap:10px;min-height:60px}
.empty-tip{width:100%;text-align:center;color:#9db3ae;font-size:13px;padding:22px 0}
/* ===== 学生卡 ===== */
.stu{width:112px;background:linear-gradient(160deg,#ffffff,#f5fbf9);border:2px solid #e3f0ec;border-radius:14px;padding:12px 8px 10px;text-align:center;cursor:pointer;transition:transform .18s,box-shadow .18s,border-color .18s;position:relative;user-select:none}
.stu:hover{transform:translateY(-3px);box-shadow:0 8px 18px rgba(31,157,122,.16);border-color:#bfe6da}
.stu .av{font-size:34px;line-height:1.1;display:block}
.stu .nm{font-size:14px;font-weight:700;margin-top:5px;color:#2f4d45;word-break:break-all}
.stu .ck{position:absolute;top:6px;right:8px;font-size:15px;opacity:0;transition:opacity .2s}
.stu.done{background:linear-gradient(160deg,#d9f7e8,#c6f0dc);border-color:#7ed3ae}
.stu.done .ck{opacity:1}
.stu.done .nm{color:#1d6f52}
.stu.pop{animation:popIn .42s ease}
@keyframes popIn{0%{transform:scale(1)}40%{transform:scale(1.12)}100%{transform:scale(1)}}
/* ===== 庆祝层 ===== */
.celebrate{position:fixed;inset:0;display:none;align-items:center;justify-content:center;z-index:600;background:rgba(16,60,50,.35);backdrop-filter:blur(3px)}
.celebrate.show{display:flex}
.cel-box{background:#fff;border-radius:22px;padding:38px 52px;text-align:center;box-shadow:0 18px 60px rgba(20,80,60,.28);animation:popIn .45s}
.cel-box .big{font-size:26px;font-weight:900;color:#1f9d7a;letter-spacing:3px}
.cel-box .sm{font-size:14px;color:#7b928c;margin-top:8px}
.particle{position:fixed;width:10px;height:10px;border-radius:50%;pointer-events:none;z-index:700;animation:fly 1s ease-out forwards}
@keyframes fly{0%{transform:translate(0,0);opacity:1}100%{transform:translate(var(--dx),var(--dy)) rotate(300deg);opacity:0}}
@media (max-width:640px){
  .stu{width:calc(33.33% - 7px)}
  .title{font-size:17px}
}
</style>
</head>
<body>
<h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">课堂打卡单 · 动物头像点名打卡</h1>
<div class="app">
  <div class="topbar">
    <div class="top-line">
      <div class="title">课堂<span>打卡单</span></div>
      <div class="progress-wrap">
        <div class="progress"><i id="barFill"></i></div>
        <div class="pnum">已完成 <b id="pDone">0</b> / 共 <b id="pTotal">0</b></div>
      </div>
    </div>
    <div class="tools">
      <button class="btn main" id="btnToggleRoster">编辑名单</button>
      <button class="btn lite" id="btnShuffle">打乱顺序</button>
      <button class="btn lite" id="btnAllDone">全部完成</button>
      <button class="btn warn" id="btnReset">重置打卡</button>
    </div>
  </div>

  <div class="roster-box" id="rosterBox">
    <textarea id="txtRoster" placeholder="每行一个名字，或用逗号分隔"></textarea>
    <div class="hint">修改后会自动保存，点「编辑名单」可收起。头像按名字自动分配，同一名字头像固定。</div>
  </div>

  <div class="zone">
    <div class="zone-head">
      <div class="zt">待完成 <em id="emPending">0 人</em></div>
    </div>
    <div class="grid" id="gridPending"></div>
  </div>

  <div class="zone done-zone">
    <div class="zone-head">
      <div class="zt">已打卡 <em id="emDone">0 人</em></div>
    </div>
    <div class="grid" id="gridDone"></div>
  </div>
</div>

<div class="celebrate" id="celebrate">
  <div class="cel-box">
    <div class="big">全员打卡完成！</div>
    <div class="sm">可以进入下一环节啦</div>
  </div>
</div>

<script>
(function(){
  'use strict';

  var KEY = 'dk_state_v1';
  var DEF = {
    roster: '张一\n王二\n李三\n赵四\n钱五\n孙六\n周七\n吴八\n郑九\n冯十\n陈十一\n褚十二\n卫十三\n蒋十四\n沈十五\n韩十六\n杨十七\n朱十八\n秦十九\n尤二十\n许二一\n何二二\n吕二三\n施二四',
    done: [],
    order: []
  };
  var state = Object.assign({}, DEF);
  var animals = ['🐶','🐱','🐭','🐹','🐰','🦊','🐻','🐼','🐨','🐯','🦁','🐮','🐷','🐸','🐵','🦄'];
  try {
    var s = localStorage.getItem(KEY);
    if (s) state = Object.assign(state, JSON.parse(s));
  } catch (e) {}

  var elRoster = document.getElementById('txtRoster');
  var rosterBox = document.getElementById('rosterBox');
  var gridPending = document.getElementById('gridPending');
  var gridDone = document.getElementById('gridDone');
  var pDone = document.getElementById('pDone');
  var pTotal = document.getElementById('pTotal');
  var barFill = document.getElementById('barFill');
  var emPending = document.getElementById('emPending');
  var emDone = document.getElementById('emDone');
  var celebrate = document.getElementById('celebrate');

  function esc(s){
    return String(s).replace(/[&<>"']/g, function(c){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];
    });
  }

  // 按名字取固定头像，保证刷新后不变
  function avatarOf(name){
    var h = 0;
    for (var i = 0; i < name.length; i++) h = (h * 31 + name.charCodeAt(i)) & 0xffff;
    return animals[h % animals.length];
  }

  function names(){
    var raw = (state.roster || '').split(/[\n,，、]+/);
    var out = [];
    raw.forEach(function(n){
      n = n.trim();
      if (n) out.push(n);
    });
    // 去重，保持顺序
    var seen = {}, uniq = [];
    out.forEach(function(n){ if (!seen[n]){ seen[n] = 1; uniq.push(n); } });
    return uniq;
  }

  function save(){
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function sound(){
    try {
      var AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      var ctx = new AC();
      var t = ctx.currentTime;
      var o = ctx.createOscillator();
      var g = ctx.createGain();
      o.type = 'sine';
      o.frequency.setValueAtTime(880, t);
      o.frequency.exponentialRampToValueAtTime(1320, t + 0.08);
      g.gain.setValueAtTime(0.001, t);
      g.gain.exponentialRampToValueAtTime(0.22, t + 0.02);
      g.gain.exponentialRampToValueAtTime(0.001, t + 0.3);
      o.connect(g); g.connect(ctx.destination);
      o.start(t); o.stop(t + 0.32);
      setTimeout(function(){ ctx.close(); }, 500);
    } catch (e) {}
  }

  function confetti(){
    var colors = ['#3ecfa4','#ffd166','#4dabf7','#ff8fab','#b197fc','#ffa94d'];
    for (var i = 0; i < 40; i++){
      var p = document.createElement('div');
      p.className = 'particle';
      p.style.left = '50%';
      p.style.top = '45%';
      p.style.background = colors[i % colors.length];
      var ang = Math.random() * Math.PI * 2;
      var dist = 80 + Math.random() * 260;
      p.style.setProperty('--dx', Math.cos(ang) * dist + 'px');
      p.style.setProperty('--dy', Math.sin(ang) * dist + 'px');
      document.body.appendChild(p);
      setTimeout(function(el){ return function(){ el.remove(); }; }(p), 1050);
    }
  }

  function render(popName){
    var list = names();
    var doneSet = {};
    (state.done || []).forEach(function(n){ doneSet[n] = 1; });

    // 按 order 排序（若 order 与名单不一致则重建）
    var ordered = list;
    if (state.order && state.order.length === list.length){
      ordered = state.order.map(function(n){ return n; }).filter(function(n){ return list.indexOf(n) > -1; });
      if (ordered.length !== list.length) ordered = list;
    }

    var pending = ordered.filter(function(n){ return !doneSet[n]; });
    var done = ordered.filter(function(n){ return doneSet[n]; });

    function card(n){
      var isDone = !!doneSet[n];
      var pop = (popName === n) ? ' pop' : '';
      return '<div class="stu' + (isDone ? ' done' : '') + pop + '" data-n="' + esc(n) + '">' +
               '<span class="ck">✅</span>' +
               '<span class="av">' + avatarOf(n) + '</span>' +
               '<div class="nm">' + esc(n) + '</div>' +
             '</div>';
    }

    gridPending.innerHTML = pending.length
      ? pending.map(card).join('')
      : '<div class="empty-tip">全部完成啦 🎉</div>';
    gridDone.innerHTML = done.length
      ? done.map(card).join('')
      : '<div class="empty-tip">还没有人打卡</div>';

    var total = list.length;
    pDone.textContent = done.length;
    pTotal.textContent = total;
    barFill.style.width = (total ? Math.round(done.length / total * 100) : 0) + '%';
    emDone.textContent = done.length + ' 人';
    emPending.textContent = pending.length + ' 人';

    // 全员完成提示
    if (total > 0 && done.length === total){
      celebrate.classList.add('show');
      confetti();
      setTimeout(function(){ celebrate.classList.remove('show'); }, 2000);
    }
  }

  function toggle(name){
    var idx = (state.done || []).indexOf(name);
    if (idx > -1) state.done.splice(idx, 1);
    else {
      state.done.push(name);
      sound();
    }
    save();
    render(name);
  }

  // ===== 事件 =====
  document.addEventListener('click', function(e){
    var card = e.target.closest('.stu');
    if (card) toggle(card.dataset.n);
  });

  document.getElementById('btnToggleRoster').addEventListener('click', function(){
    rosterBox.classList.toggle('show');
    if (rosterBox.classList.contains('show')) elRoster.focus();
  });

  var timer = null;
  elRoster.addEventListener('input', function(){
    clearTimeout(timer);
    timer = setTimeout(function(){
      state.roster = elRoster.value;
      state.done = (state.done || []).filter(function(n){ return names().indexOf(n) > -1; });
      state.order = names();
      save();
      render();
    }, 300);
  });

  document.getElementById('btnShuffle').addEventListener('click', function(){
    var list = names();
    for (var i = list.length - 1; i > 0; i--){
      var j = Math.floor(Math.random() * (i + 1));
      var t = list[i]; list[i] = list[j]; list[j] = t;
    }
    state.order = list;
    save();
    render();
  });

  document.getElementById('btnAllDone').addEventListener('click', function(){
    state.done = names();
    save();
    render();
  });

  document.getElementById('btnReset').addEventListener('click', function(){
    state.done = [];
    save();
    render();
  });

  // 初始化
  elRoster.value = state.roster;
  if (!state.order || state.order.length !== names().length) state.order = names();
  render();
})();
</script>
</body>
</html>
