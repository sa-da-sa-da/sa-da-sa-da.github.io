<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>英文字母描红纸 · A-Z / a-z 四线三格 A4 打印 | 当以读书通世事</title>
<link rel="canonical" href="https://www.sakaay.com/lab/AI/zimu.html">
<meta name="description" content="英文字母描红纸生成器：标准四线三格、字母按占格规则自动归位，一键生成 A-Z 大写、a-z 小写与 Aa-Zz 大小写组合描红，支持首字母示范、全描红与空白练习，A4 直接打印，适合小学英语字母书写练习，免注册、数据只存本机。">
<style>
*{margin:0;padding:0;box-sizing:border-box}
:root{
  --ink:#1f2d2b;--muted:#6b7a78;--line:#e2e9e7;
  --brand:#2f7d6e;--brand-d:#276a5d;--brand-l:#e9f4f1;--bg:#f3f6f5;--card:#fff;
}
body{font-family:-apple-system,"Microsoft YaHei","PingFang SC",sans-serif;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased}
.app{display:flex;gap:18px;padding:18px;max-width:1360px;margin:0 auto;align-items:flex-start}

/* ===== 左侧控制面板 ===== */
.panel{width:326px;flex:0 0 326px;background:var(--card);border-radius:14px;padding:18px;box-shadow:0 4px 20px rgba(20,50,45,.07);position:sticky;top:18px;max-height:calc(100vh - 36px);overflow:auto}
.panel h2{font-size:16px;font-weight:700;margin-bottom:4px}
.panel .sub{font-size:12px;color:var(--muted);margin-bottom:16px;line-height:1.65}
.field{margin-bottom:15px}
.field .lbl{display:block;font-size:13px;font-weight:600;color:#40514e;margin-bottom:7px}
.seg{display:flex;gap:6px;flex-wrap:wrap}
.seg button{flex:1;min-width:62px;padding:8px 6px;border:1px solid var(--line);background:#fbfdfc;border-radius:9px;font-size:13px;color:#5a6b68;cursor:pointer;transition:all .18s;font-family:inherit}
.seg button:hover{border-color:#bcd6d0}
.seg button.on{background:var(--brand);border-color:var(--brand);color:#fff;font-weight:600}
.chip{display:flex;gap:6px;flex-wrap:wrap}
.chip button{padding:7px 11px;border:1px solid #cfe3de;background:var(--brand-l);border-radius:8px;font-size:12.5px;color:var(--brand-d);cursor:pointer;font-family:inherit;transition:all .18s}
.chip button:hover{background:#dcf0ea}
.chip button.on{background:var(--brand);border-color:var(--brand);color:#fff}
.actions{display:flex;gap:8px;margin-top:4px}
.btn{flex:1;padding:11px;border:none;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;font-family:inherit;transition:all .18s}
.btn.primary{background:var(--brand);color:#fff}
.btn.primary:hover{background:var(--brand-d)}
.btn.ghost{flex:0 0 100px;background:#eff3f2;color:#5a6b68}
.btn.ghost:hover{background:#e5ecea}
.panel .meta{margin-top:12px;font-size:12px;color:var(--muted);line-height:1.7}
.tip{margin-top:10px;font-size:12px;color:#7d6a3a;line-height:1.7;background:#fff7e6;border-radius:9px;padding:9px 11px}

/* ===== 右侧预览 ===== */
.preview{flex:1;min-width:0;display:flex;flex-direction:column;align-items:center;overflow:auto;padding-bottom:36px}
.stage{width:210mm;height:297mm;transform-origin:top center;margin-bottom:18px}
/* ===== A4 纸面 ===== */
.paper{width:210mm;height:297mm;background:#fff;padding:12mm 15mm 10mm;box-shadow:0 8px 30px rgba(20,50,45,.16);border-radius:1mm;display:flex;flex-direction:column;overflow:hidden}
.sheet-head{flex:0 0 auto;display:flex;align-items:flex-end;justify-content:space-between;height:13mm;border-bottom:.35mm solid #c9d2cf;margin-bottom:4mm;padding-bottom:2mm}
.sheet-head .t{font-size:5mm;font-weight:700;letter-spacing:.6mm;color:#1a1a1a}
.sheet-head .meta{font-size:3.5mm;color:#3a4744;letter-spacing:.2mm}
.foot{flex:0 0 auto;text-align:center;font-size:3.2mm;color:#95a5a1;padding-top:2mm;border-top:.25mm solid #e3eae8}

/* ===== 字母行 ===== */
.rows{flex:1;overflow:hidden;display:flex;flex-direction:column}
.row{display:flex;align-items:center;height:var(--rh);flex:0 0 var(--rh)}
.rlabel{width:9mm;flex:0 0 9mm;font-size:3.6mm;color:#8b9a97;text-align:center;line-height:1}
.units{display:flex;align-items:center;gap:calc(var(--cw) * .7)}
.unit{display:flex}

/* 四线三格：只有四条横线，无竖线 */
.pcell{width:var(--cw);height:calc(var(--cw) * 1.35);position:relative;border-top:.3mm solid #96a3b5;border-bottom:.3mm solid #96a3b5}
.pcell::before,.pcell::after{content:'';position:absolute;left:0;right:0;height:0;border-top:.25mm dashed #c2cbd9}
.pcell::before{top:33.333%}
.pcell::after{top:66.666%}

.lt{position:absolute;left:0;width:100%;text-align:center;line-height:1;font-family:"Comic Sans MS","Arial Rounded MT Bold",Arial,Helvetica,sans-serif;color:#161c28}
/* 上两格：大写字母与 b d f h k l t，基线落在第三条线 */
.lt.up{font-size:calc(var(--cw) * 1.05);top:calc(var(--cw) * -.05)}
/* 中格：a c e i m n o r s u v w x z，字身落在中格内 */
.lt.mid{font-size:calc(var(--cw) * .87);top:calc(var(--cw) * .09)}
/* 中下格：g j p q y，尾部伸入下格 */
.lt.dn{font-size:calc(var(--cw) * .87);top:calc(var(--cw) * .09)}
.lt.trace{color:#bcc5d2}

/* ===== 打印 ===== */
@media print{
  @page{size:A4;margin:0}
  body{background:#fff}
  .panel{display:none !important}
  .app{display:block;padding:0;margin:0;max-width:none}
  .preview{display:block;padding:0;overflow:visible}
  .stage{width:auto;height:auto;transform:none !important;margin:0 !important}
  .paper{box-shadow:none;border-radius:0;margin:0;height:296mm;page-break-after:always;break-after:page}
  .stage:last-child .paper{page-break-after:auto;break-after:auto}
}
@media (max-width:900px){
  .app{flex-direction:column;padding:12px}
  .panel{width:100%;flex:none;position:static;max-height:none}
  .preview{width:100%}
}
</style>
</head>
<body>
<h1 style="position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0">英文字母描红纸生成器</h1>

<div class="app">
  <aside class="panel">
    <h2>英文字母描红纸</h2>
    <p class="sub">标准四线三格，字母按占格规则自动归位；每行一个字母重复练习，A4 直接打印。</p>

    <div class="field">
      <label class="lbl">一键填充</label>
      <div class="chip" id="fillChips">
        <button data-fill="upper" type="button">A-Z 大写</button>
        <button data-fill="lower" type="button">a-z 小写</button>
        <button data-fill="both" type="button">Aa-Zz 大小写</button>
      </div>
    </div>

    <div class="field">
      <label class="lbl">格子大小</label>
      <div class="seg" id="segSize">
        <button data-v="12" type="button">小 12mm</button>
        <button data-v="15" type="button">中 15mm</button>
        <button data-v="18" type="button">大 18mm</button>
      </div>
    </div>

    <div class="field">
      <label class="lbl">描红模式</label>
      <div class="seg" id="segMode">
        <button data-v="sample" type="button">首字母示范</button>
        <button data-v="trace" type="button">全部描红</button>
        <button data-v="blank" type="button">空白练习</button>
      </div>
    </div>

    <div class="actions">
      <button class="btn primary" id="btnPrint" type="button">打印描红纸</button>
      <button class="btn ghost" id="btnReset" type="button">恢复默认</button>
    </div>

    <div class="meta" id="meta">正在生成…</div>
    <div class="tip" id="tip">占格规则：大写字母与 b d f h k l t 占上两格；g j p q y 占中下格；其余小写字母占中格。</div>
  </aside>

  <main class="preview" id="preview">
    <div id="pages"></div>
  </main>
</div>

<script>
(function () {
  'use strict';

  var KEY = 'zimu_state_v1';
  var DEF = { fill: 'upper', size: 15, mode: 'sample' };
  var state = Object.assign({}, DEF);
  try {
    var raw = localStorage.getItem(KEY);
    if (raw) state = Object.assign(state, JSON.parse(raw));
  } catch (e) { /* 隐私模式下忽略读写异常 */ }

  var UP = 'ABCDEFGHIJKLMNOPQRSTUVWXYZ';
  var UP_SET = 'bdfhkltj';   // 占上两格的小写字母
  var DN_SET = 'gpqy';       // 占中下格的小写字母
  var MM = 96 / 25.4;
  var BODY_W = 180;          // 纸面可用宽度（mm）
  var BODY_H = 252;          // 去掉页头页脚后的可用高度（mm）
  var LABEL_W = 9;           // 行首字母标签宽度（mm）

  var pagesBox = document.getElementById('pages');
  var preview = document.getElementById('preview');
  var elMeta = document.getElementById('meta');
  var btnPrint = document.getElementById('btnPrint');
  var btnReset = document.getElementById('btnReset');

  function esc(s) {
    return String(s).replace(/[&<>"']/g, function (c) {
      return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c];
    });
  }

  // 字母占格分类：up 上两格 / mid 中格 / dn 中下格
  function letterClass(ch) {
    if (ch >= 'A' && ch <= 'Z') return 'up';
    var c = ch.toLowerCase();
    if (UP_SET.indexOf(c) > -1) return 'up';
    if (DN_SET.indexOf(c) > -1) return 'dn';
    return 'mid';
  }

  // 生成每一行的练习对象（单字母或 Aa 组合）
  function buildUnits() {
    var out = [];
    var low = UP.toLowerCase();
    for (var i = 0; i < UP.length; i++) {
      if (state.fill === 'lower') out.push(low.charAt(i));
      else if (state.fill === 'both') out.push(UP.charAt(i) + low.charAt(i));
      else out.push(UP.charAt(i));
    }
    return out;
  }

  // 每行高度（含行间留白）
  function rowHeight() {
    return state.size * 1.35 + 3.2;
  }

  function rowsPerPage() {
    return Math.max(3, Math.floor(BODY_H / rowHeight()));
  }

  // 一行内重复的字母格数
  function repeatCount(cellsInUnit) {
    var gap = state.size * 0.7;
    var usable = BODY_W - LABEL_W;
    return Math.max(2, Math.floor((usable + gap) / (cellsInUnit * state.size + gap)));
  }

  // 单个字母格
  function cellHTML(ch, show, dark) {
    var cls = 'lt ' + letterClass(ch) + (dark ? '' : ' trace');
    return '<div class="pcell">' +
      (show ? '<span class="' + cls + '">' + esc(ch) + '</span>' : '') +
      '</div>';
  }

  // 一个练习单元（1 格或 Aa 两格）
  function unitHTML(unit, idx) {
    var show = state.mode !== 'blank';
    var dark = (state.mode === 'sample' && idx === 0);
    var chars = Array.from(unit);
    return '<div class="unit">' + chars.map(function (ch) {
      return cellHTML(ch, show, dark);
    }).join('') + '</div>';
  }

  // 一整行：行首标签 + 重复单元
  function rowHTML(unit) {
    var repeat = repeatCount(Array.from(unit).length);
    var cells = '';
    for (var i = 0; i < repeat; i++) cells += unitHTML(unit, i);
    return '<div class="row">' +
      '<span class="rlabel">' + esc(unit) + '</span>' +
      '<div class="units">' + cells + '</div>' +
      '</div>';
  }

  function paperHTML(body, pageNo, total) {
    return '<div class="stage"><div class="paper" style="--cw:' + state.size + 'mm;--rh:' + rowHeight().toFixed(2) + 'mm">' +
      '<div class="sheet-head">' +
        '<span class="t">英文字母描红</span>' +
        '<span class="meta">姓名：____________　　班级：____________</span>' +
      '</div>' +
      '<div class="rows">' + body + '</div>' +
      '<div class="foot">第 ' + pageNo + ' 页 / 共 ' + total + ' 页</div>' +
      '</div></div>';
  }

  // 分页：每页行数尽量均衡，避免最后一页只剩一两行
  function paginate(items, per) {
    var pages = Math.ceil(items.length / per) || 1;
    var size = Math.ceil(items.length / pages) || 1;
    var out = [];
    for (var i = 0; i < items.length; i += size) out.push(items.slice(i, i + size));
    return out.length ? out : [[]];
  }

  function build() {
    var units = buildUnits();
    var per = rowsPerPage();
    var chunks = paginate(units, per);
    var html = '';
    chunks.forEach(function (chunk, i) {
      html += paperHTML(chunk.map(rowHTML).join(''), i + 1, chunks.length);
    });
    return {
      html: html,
      pages: chunks.length,
      count: units.length,
      per: per,
      repeat: repeatCount(state.fill === 'both' ? 2 : 1)
    };
  }

  function render() {
    var built = build();
    pagesBox.innerHTML = built.html;
    elMeta.textContent = '共 ' + built.count + ' 行 · 每行重复 ' + built.repeat +
      ' 格 · 每页 ' + built.per + ' 行 · 共 ' + built.pages + ' 页';
    fitScale();
  }

  // 预览等比缩放，打印时还原 1:1
  function fitScale() {
    var wrapW = preview.clientWidth - 12;
    var s = Math.min(1, wrapW / (210 * MM));
    Array.prototype.forEach.call(pagesBox.querySelectorAll('.stage'), function (st) {
      st.style.transform = 'scale(' + s + ')';
      st.style.marginBottom = (297 * MM * (s - 1) + 18) + 'px';
    });
  }

  function save() {
    try { localStorage.setItem(KEY, JSON.stringify(state)); } catch (e) {}
  }

  function bindActive(id, val) {
    Array.prototype.forEach.call(document.getElementById(id).querySelectorAll('button'), function (b) {
      b.classList.toggle('on', b.dataset.v === String(val));
    });
  }

  function syncUI() {
    bindActive('segSize', state.size);
    bindActive('segMode', state.mode);
    Array.prototype.forEach.call(document.getElementById('fillChips').querySelectorAll('button'), function (b) {
      b.classList.toggle('on', b.dataset.fill === state.fill);
    });
  }

  // ===== 事件绑定 =====
  document.getElementById('fillChips').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    state.fill = b.dataset.fill;
    save();
    syncUI();
    render();
  });

  document.getElementById('segSize').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    state.size = Number(b.dataset.v);
    save();
    syncUI();
    render();
  });

  document.getElementById('segMode').addEventListener('click', function (e) {
    var b = e.target.closest('button');
    if (!b) return;
    state.mode = b.dataset.v;
    save();
    syncUI();
    render();
  });

  btnPrint.addEventListener('click', function () { window.print(); });

  btnReset.addEventListener('click', function () {
    state = Object.assign({}, DEF);
    save();
    syncUI();
    render();
  });

  window.addEventListener('resize', fitScale);

  syncUI();
  render();
})();
</script>
</body>
</html>
