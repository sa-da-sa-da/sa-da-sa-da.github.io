main:
  push:
    "volume-cache":
      name: 云原生构建
      runner:
        cpus: 64
      imports:
        - https://cnb.cool/onedayxyy/secret/-/blob/main/envs.yml
      docker:
        image: node:22
      stages:
        - name: set env
          script: echo -n $(date +%s)
          exports:
            info: CUSTOM_ENV_START_TIME
        - name: 🏠️ 设置淘宝源
          script: |
            npm config set registry https://registry.npmmirror.com
        - name: 🖨️ 打印环境
          script: |
            npm install -g pnpm && node -v && npm -v && pnpm -v
        - name: 🔧 安装 Hugo Extended
          script: |
            HUGO_VERSION=0.166.0
            wget -q -O hugo.tar.gz "https://github.com/gohugoio/hugo/releases/download/v${HUGO_VERSION}/hugo_extended_${HUGO_VERSION}_linux-amd64.tar.gz"
            tar -xzf hugo.tar.gz -C /usr/local/bin hugo
            hugo version
        - name: ⚗️ 编译 Hugo 站点
          script: |
            hugo --minify --cleanDestinationDir
            node scripts/prepare-deploy.mjs
        - name: 🚚 部署到Pages
          image: node:22
          script: >-
            npx edgeone pages deploy ./public --name
            sakaayhugo --token $EDGEONE_PAGES_API_TOKEN

        - name: build knowledge base
          image: cnbcool/knowledge-base
          settings:
            embedding_model: bge-m3
            include: "content/**/*.md"
            exclude: ""

        - name: ⏱️ 计算耗时
          script: |
            # 计算耗时
            end_time=$(date +%s)
            duration=$((end_time - CUSTOM_ENV_START_TIME))
            minutes=$((duration / 60))
            seconds=$((duration % 60))
            time_str="${minutes}分${seconds}秒"
            echo -n ${time_str}
          exports:
            info: CUSTOM_ENV_BUILD_TIME
