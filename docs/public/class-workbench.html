<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#4f46e5">
<title>班主任工作台 · 一站式班级管理</title>
<link rel="stylesheet" href="class-workbench.css">
</head>
<body>
<div class="app">
  <aside class="sidebar" id="sidebar"></aside>
  <main class="main" id="main">
    <header class="topbar">
      <button class="btn-icon menu-toggle" id="btn-menu" aria-label="打开菜单">☰</button>
      <div class="crumb" id="crumb">加载中…</div>
      <div class="top-actions">
        <button class="btn btn-ghost" id="btn-backup">💾 备份</button>
        <button class="btn btn-ghost" id="btn-restore">♻ 恢复</button>
      </div>
    </header>
    <section class="content" id="content"></section>
  </main>
</div>
<div class="modal-mask" id="modal-mask"></div>
<div class="toast" id="toast"></div>
<input type="file" id="file-restore" accept=".json" style="display:none">
<input type="file" id="file-import" accept=".xlsx,.xls,.csv" style="display:none">
<!-- 加载顺序：config（数据配置） → main（主逻辑，暴露 window.WB） → views（特殊视图，依赖 WB） -->
<script src="class-workbench-config.js"></script>
<script src="class-workbench.js"></script>
<script src="class-workbench-views.js"></script>
<!-- SheetJS：Excel 导入/导出。CDN 加载失败时回退到本地 vendor/sheetjs.min.js -->
<script src="https://cdn.sheetjs.com/xlsx-0.20.2/package/dist/xlsx.full.min.js"></script>
<script>
  if (typeof XLSX === 'undefined') {
    var s = document.createElement('script');
    s.src = 'vendor/sheetjs.min.js';
    document.head.appendChild(s);
  }
</script>
</body>
</html>
