<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, minimum-scale=1.0">
<title>化学方程式配平 · 双人对战 · 微观粒子</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;700;900&display=swap');
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --blue: #3b82f6; --blue-dark: #1d4ed8; --blue-glow: #60a5fa;
  --red: #ef4444; --red-dark: #b91c1c; --red-glow: #f87171;
  --gold: #f59e0b; --bg-dark: #0f172a; --bg-card: #1e293b;
  --text: #f1f5f9; --text-dim: #94a3b8;
}
body {
  font-family: 'Noto Sans SC', sans-serif;
  background: var(--bg-dark); color: var(--text);
  overflow-y: auto; overflow-x: hidden; height: 100vh; width: 100vw;
  user-select: none; -webkit-touch-callout: none;
}

/* ====== 首页 ====== */
#mainPage {
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  min-height: 100vh; padding: 12px;
  background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
}
.main-title {
  font-size: 32px; font-weight: 900;
  background: linear-gradient(135deg, var(--blue-glow), var(--red-glow), var(--gold));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; margin-bottom: 4px; letter-spacing: 3px;
  animation: titlePulse 3s ease-in-out infinite;
}
@keyframes titlePulse { 0%,100%{ filter: brightness(1); transform: scale(1); } 50%{ filter: brightness(1.2); transform: scale(1.02); } }
.main-subtitle { font-size: 13px; color: var(--text-dim); margin-bottom: 12px; text-align: center; }

.method-grid {
  display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr));
  gap: 8px; max-width: 680px; width: 100%; margin-bottom: 12px;
}
.method-card {
  background: var(--bg-card); border-radius: 10px; padding: 12px 8px; text-align: center;
  cursor: pointer; border: 2px solid rgba(255,255,255,0.08); transition: all 0.2s;
  position: relative; overflow: hidden;
}
.method-card:hover { border-color: var(--gold); transform: translateY(-2px); box-shadow: 0 4px 16px rgba(245,158,11,0.2); }
.method-card:active { transform: scale(0.96); }
.method-card .method-icon { font-size: 28px; margin-bottom: 3px; }
.method-card .method-name { font-size: 14px; font-weight: 900; color: var(--text); margin-bottom: 2px; }
.method-card .method-desc { font-size: 10px; color: var(--text-dim); line-height: 1.3; }
.method-card .method-count { display: inline-block; background: rgba(245,158,11,0.2); color: var(--gold); font-size: 9px; padding: 2px 6px; border-radius: 6px; margin-top: 4px; }
.method-card:nth-child(1) { border-top: 3px solid #3b82f6; }
.method-card:nth-child(2) { border-top: 3px solid #22c55e; }
.method-card:nth-child(3) { border-top: 3px solid #ef4444; }
.method-card:nth-child(4) { border-top: 3px solid #a855f7; }
.method-card:nth-child(5) { border-top: 3px solid var(--gold); }

.leaderboard-section {
  background: var(--bg-card); border-radius: 10px; padding: 10px 14px;
  max-width: 680px; width: 100%; border: 1px solid rgba(255,255,255,0.06);
}
.leaderboard-section h3 { font-size: 14px; color: var(--gold); text-align: center; margin-bottom: 6px; }
.leaderboard-table { width: 100%; border-collapse: collapse; }
.leaderboard-table th { font-size: 10px; color: var(--text-dim); padding: 3px 6px; text-align: left; border-bottom: 1px solid rgba(255,255,255,0.06); }
.leaderboard-table td { font-size: 11px; padding: 3px 6px; border-bottom: 1px solid rgba(255,255,255,0.03); }
.leaderboard-table .rank { color: var(--gold); font-weight: 900; }
.leaderboard-empty { text-align: center; color: var(--text-dim); font-size: 11px; padding: 8px; }

.btn { padding: 8px 20px; border: none; border-radius: 8px; font-size: 14px; font-weight: 700; cursor: pointer; transition: all 0.2s; font-family: inherit; }
.btn:active { transform: scale(0.95); }
.btn-primary { background: linear-gradient(135deg, var(--blue), var(--blue-dark)); color: white; box-shadow: 0 3px 14px rgba(59,130,246,0.4); }
.btn-gold { background: linear-gradient(135deg, var(--gold), #d97706); color: white; box-shadow: 0 3px 14px rgba(245,158,11,0.4); }
.btn-danger { background: linear-gradient(135deg, var(--red), var(--red-dark)); color: white; box-shadow: 0 3px 14px rgba(239,68,68,0.4); }
.btn-small { padding: 5px 12px; font-size: 12px; border-radius: 6px; }

/* ====== 游戏页 ====== */
#gamePage {
  display: none; height: 100vh; width: 100vw; flex-direction: column;
  background: linear-gradient(180deg, #0f172a 0%, #1a1a3e 40%, #2d1b4e 100%);
  position: relative; overflow: hidden;
}
.game-title-bar {
  text-align: center; font-size: 18px; font-weight: 900;
  background: linear-gradient(90deg, var(--blue-glow), var(--gold), var(--red-glow));
  -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  background-clip: text; letter-spacing: 3px; padding: 2px 0 0; z-index: 10;
}
.health-bar-container {
  display: flex; justify-content: space-between; align-items: center;
  padding: 2px 60px; z-index: 10;
}
.health-section { display: flex; align-items: center; gap: 5px; }
.health-section.right { flex-direction: row-reverse; }
.player-name { font-size: 14px; font-weight: 900; white-space: nowrap; }
.player-name.blue { color: var(--blue-glow); text-shadow: 0 0 8px rgba(59,130,246,0.5); }
.player-name.red { color: var(--red-glow); text-shadow: 0 0 8px rgba(239,68,68,0.5); }
.score-display { font-size: 20px; font-weight: 900; min-width: 18px; text-align: center; }
.score-display.blue { color: var(--blue-glow); }
.score-display.red { color: var(--red-glow); }
.hp-bar-wrapper {
  width: 120px; height: 14px; background: rgba(0,0,0,0.5);
  border-radius: 7px; overflow: hidden; border: 2px solid rgba(255,255,255,0.15); position: relative;
}
.hp-bar { height: 100%; border-radius: 5px; transition: width 0.8s ease-out; }
.hp-bar.blue { background: linear-gradient(90deg, var(--blue), var(--blue-glow)); }
.hp-bar.red { background: linear-gradient(90deg, var(--red-glow), var(--red)); }
.hp-bar.low { background: linear-gradient(90deg, #ef4444, #f87171) !important; }
.hp-text { position: absolute; top: 50%; left: 50%; transform: translate(-50%,-50%); font-size: 9px; font-weight: 700; text-shadow: 0 1px 2px rgba(0,0,0,0.8); z-index: 1; }
.vs-badge { background: linear-gradient(135deg, var(--gold), #d97706); color: white; font-weight: 900; font-size: 11px; padding: 2px 8px; border-radius: 12px; text-shadow: 0 1px 3px rgba(0,0,0,0.3); box-shadow: 0 2px 6px rgba(245,158,11,0.4); }

.characters-area {
  display: flex; justify-content: space-between; align-items: flex-end;
  padding: 0 80px; height: 75px; z-index: 10;
}
.character { width: 44px; height: 72px; transition: transform 0.3s; }
.character.attack-left { animation: attackLeft 0.6s ease-in-out; }
.character.attack-right { animation: attackRight 0.6s ease-in-out; }
.character.hit { animation: hitShake 0.5s ease-in-out; }
.character.victory { animation: victoryBounce 0.8s ease-in-out infinite; }
.character.defeat { animation: defeatFall 0.8s ease-in forwards; }
@keyframes attackLeft { 0%{transform:translateX(0)} 30%{transform:translateX(30px) scale(1.08)} 60%{transform:translateX(30px) scale(1.08)} 100%{transform:translateX(0)} }
@keyframes attackRight { 0%{transform:translateX(0)} 30%{transform:translateX(-30px) scale(1.08)} 60%{transform:translateX(-30px) scale(1.08)} 100%{transform:translateX(0)} }
@keyframes hitShake { 0%,100%{transform:translateX(0);filter:brightness(1)} 15%{transform:translateX(-5px);filter:brightness(2.5)} 30%{transform:translateX(5px);filter:brightness(1.8)} 45%{transform:translateX(-3px)} 60%{transform:translateX(3px)} 75%{transform:translateX(-1px)} }
@keyframes victoryBounce { 0%,100%{transform:translateY(0) scale(1)} 50%{transform:translateY(-8px) scale(1.05)} }
@keyframes defeatFall { 0%{transform:rotate(0) translateY(0);opacity:1} 60%{transform:rotate(15deg) translateY(6px);opacity:0.6} 100%{transform:rotate(25deg) translateY(16px);opacity:0.3} }
.char-svg { width: 44px; height: 72px; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.4)); }

/* 粒子区 */
.particle-stage {
  display: flex; align-items: center; justify-content: center; gap: 0;
  padding: 2px 10px; z-index: 10; height: 100px; min-height: 100px;
}
.particle-stage svg { width: 50%; height: 100%; max-width: 340px; }
.particle-stage svg.blue-svg { border-right: 1px solid rgba(255,255,255,0.06); }
.particle-stage svg.red-svg { border-left: 1px solid rgba(255,255,255,0.06); }

/* 题目区和双人配平区 */
.question-area {
  display: flex; flex-direction: column; align-items: center;
  padding: 0 30px; z-index: 10; flex: 1; min-height: 0;
}
.round-info { font-size: 13px; color: var(--text-dim); margin-bottom: 4px; }
.question-text {
  font-size: 15px; font-weight: 700; text-align: center; margin-bottom: 4px;
  line-height: 1.3; max-width: 720px; text-shadow: 0 2px 4px rgba(0,0,0,0.3);
}
.particle-hint { text-align: center; font-size: 10px; color: var(--text-dim); padding: 0; z-index: 10; opacity: 0.7; }

/* 双人配平区域 */
.dual-balancing {
  display: flex; gap: 16px; justify-content: center; align-items: flex-start;
  width: 100%; max-width: 750px;
}
.balancing-zone {
  flex: 1; background: rgba(0,0,0,0.25); border-radius: 10px; padding: 8px;
  border: 2px solid rgba(255,255,255,0.08); transition: border-color 0.3s;
}
.balancing-zone.blue-zone { border-color: rgba(59,130,246,0.3); }
.balancing-zone.red-zone { border-color: rgba(239,68,68,0.3); }
.balancing-zone.blue-zone.active { border-color: var(--blue-glow); box-shadow: 0 0 12px rgba(59,130,246,0.3); }
.balancing-zone.red-zone.active { border-color: var(--red-glow); box-shadow: 0 0 12px rgba(239,68,68,0.3); }
.balancing-zone.winner { border-color: var(--gold) !important; box-shadow: 0 0 16px rgba(245,158,11,0.5) !important; }
.zone-header {
  font-size: 12px; font-weight: 900; text-align: center; margin-bottom: 4px;
}
.zone-header.blue { color: var(--blue-glow); }
.zone-header.red { color: var(--red-glow); }
.zone-formulas {
  display: flex; flex-wrap: wrap; align-items: center; justify-content: center;
  gap: 2px; min-height: 48px;
}
.formula-item {
  display: flex; flex-direction: column; align-items: center; gap: 2px;
}
.formula-text {
  font-size: 15px; font-weight: 700; color: white; padding: 2px 4px;
  text-shadow: 0 1px 2px rgba(0,0,0,0.3); white-space: nowrap;
}
.coeff-control { display: flex; align-items: center; gap: 2px; }
.coeff-btn {
  width: 22px; height: 22px; border-radius: 5px; border: none;
  font-size: 14px; font-weight: 900; cursor: pointer; font-family: inherit;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.1s; color: white;
}
.coeff-btn:active:not(:disabled) { transform: scale(0.88); }
.coeff-btn.minus { background: var(--red); }
.coeff-btn.plus { background: #22c55e; }
.coeff-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.coeff-display {
  width: 28px; height: 28px; border-radius: 6px;
  background: rgba(255,255,255,0.12); border: 2px solid rgba(255,255,255,0.25);
  color: white; font-size: 16px; font-weight: 900; text-align: center;
  display: flex; align-items: center; justify-content: center;
  transition: all 0.15s; font-family: inherit;
}
.coeff-display.correct { background: rgba(34,197,94,0.3); border-color: #22c55e; box-shadow: 0 0 8px rgba(34,197,94,0.4); }
.coeff-display.wrong { background: rgba(239,68,68,0.3); border-color: #ef4444; box-shadow: 0 0 8px rgba(239,68,68,0.4); }
.equals-sep { font-size: 18px; font-weight: 900; color: var(--gold); margin: 0 1px; }
.plus-sep { font-size: 14px; font-weight: 700; color: var(--text-dim); margin: 0 1px; }
.zone-submit-btn {
  display: block; margin: 6px auto 0; padding: 5px 18px; border: none;
  border-radius: 6px; font-size: 12px; font-weight: 700; cursor: pointer;
  font-family: inherit; transition: all 0.15s;
}
.zone-submit-btn.blue-submit { background: linear-gradient(135deg, var(--blue), var(--blue-dark)); color: white; }
.zone-submit-btn.red-submit { background: linear-gradient(135deg, var(--red), var(--red-dark)); color: white; }
.zone-submit-btn:disabled { opacity: 0.3; cursor: not-allowed; }
.zone-submit-btn.flash { animation: submitFlash 0.5s ease-out; }
@keyframes submitFlash { 0% { transform: scale(1.3); } 100% { transform: scale(1); } }

/* 底部 */
.bottom-area {
  display: flex; justify-content: center; align-items: center; gap: 10px;
  padding: 4px 60px 6px; z-index: 10;
}
.exit-btn {
  padding: 4px 10px; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px;
  background: rgba(255,255,255,0.08); color: var(--text-dim); font-size: 11px;
  font-weight: 700; cursor: pointer; font-family: inherit; transition: all 0.2s;
}
.exit-btn:hover { background: rgba(239,68,68,0.2); border-color: var(--red); color: var(--red-glow); }
.recover-btn {
  padding: 4px 10px; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px;
  background: rgba(245,158,11,0.15); color: var(--gold); font-size: 11px;
  font-weight: 700; cursor: pointer; font-family: inherit; transition: all 0.2s; display: none;
}
.recover-btn:hover { background: rgba(245,158,11,0.3); border-color: var(--gold); }

/* 倒计时 */
.countdown-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.8); display: none; align-items: center; justify-content: center; z-index: 100;
}
.countdown-number { font-size: 80px; font-weight: 900; animation: countdownPop 0.6s ease-out; text-shadow: 0 0 40px currentColor; }
.countdown-number.c3 { color: var(--red); }
.countdown-number.c2 { color: var(--gold); }
.countdown-number.c1 { color: #22c55e; }
.countdown-number.go { color: var(--blue-glow); font-size: 60px; }
@keyframes countdownPop { 0%{transform:scale(2);opacity:0} 50%{transform:scale(0.9);opacity:1} 70%{transform:scale(1.1)} 100%{transform:scale(1);opacity:1} }

/* 结果弹窗 */
.result-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.85); display: none; align-items: center;
  justify-content: center; flex-direction: column; z-index: 200;
}
.result-text { font-size: 44px; font-weight: 900; margin-bottom: 12px; animation: resultPop 0.6s ease-out; }
.result-text.win { color: var(--gold); text-shadow: 0 0 30px rgba(245,158,11,0.6); }
@keyframes resultPop { 0%{transform:scale(0);opacity:0} 60%{transform:scale(1.2)} 100%{transform:scale(1);opacity:1} }
.result-sub { font-size: 18px; color: var(--text-dim); margin-bottom: 18px; }

/* 答案指示器 */
.answer-indicator {
  position: fixed; top: 45%; left: 50%; transform: translate(-50%,-50%);
  font-size: 40px; font-weight: 900; z-index: 150; display: none;
  animation: indicatorPop 0.5s ease-out; text-shadow: 0 4px 10px rgba(0,0,0,0.5);
}
.answer-indicator.correct { color: #22c55e; }
.answer-indicator.wrong { color: var(--red); }
@keyframes indicatorPop { 0%{transform:translate(-50%,-50%) scale(0)} 50%{transform:translate(-50%,-50%) scale(1.3)} 100%{transform:translate(-50%,-50%) scale(1)} }

/* 获胜者弹窗 */
.winner-toast {
  position: fixed; top: 50%; left: 50%; transform: translate(-50%,-50%);
  background: rgba(0,0,0,0.9); border: 2px solid var(--gold); border-radius: 14px;
  padding: 16px 24px; z-index: 160; display: none; text-align: center;
  animation: toastPop 0.4s ease-out;
}
.winner-toast .toast-name { font-size: 22px; font-weight: 900; color: var(--gold); }
.winner-toast .toast-text { font-size: 14px; color: var(--text-dim); margin-top: 4px; }
@keyframes toastPop { 0%{transform:translate(-50%,-50%) scale(0);opacity:0} 60%{transform:translate(-50%,-50%) scale(1.15)} 100%{transform:translate(-50%,-50%) scale(1);opacity:1} }

/* 名字弹窗 */
.name-overlay {
  position: fixed; top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0,0,0,0.85); display: none; align-items: center; justify-content: center; z-index: 500;
}
.name-container {
  background: var(--bg-card); border-radius: 16px; padding: 28px; text-align: center;
  border: 1px solid rgba(255,255,255,0.1); max-width: 360px; width: 90%;
}
.name-container h2 { font-size: 20px; margin-bottom: 16px; color: var(--gold); }
.name-inputs { display: flex; gap: 14px; margin-bottom: 16px; justify-content: center; }
.name-field { display: flex; flex-direction: column; gap: 4px; }
.name-field label { font-size: 13px; font-weight: 700; }
.name-field label.blue { color: var(--blue-glow); }
.name-field label.red { color: var(--red-glow); }
.name-field input {
  background: rgba(0,0,0,0.3); border: 2px solid rgba(255,255,255,0.15);
  border-radius: 8px; padding: 6px 10px; color: white; font-size: 14px;
  font-family: inherit; width: 130px; text-align: center;
}
.name-field input:focus { outline: none; border-color: var(--gold); }

/* 背景粒子 */
.bg-particle { position: fixed; border-radius: 50%; pointer-events: none; opacity: 0.1; z-index: 1; }
@keyframes floatParticle {
  0%,100%{transform:translateY(0) translateX(0)} 25%{transform:translateY(-18px) translateX(8px)}
  50%{transform:translateY(-8px) translateX(-8px)} 75%{transform:translateY(-25px) translateX(4px)}
}

/* 粒子重排动画 */
.atom-circle { transition: all 0.5s ease-in-out; }
.atom-circle.rearranging { animation: atomRearrange 0.8s ease-in-out; }
@keyframes atomRearrange { 0%{opacity:1;transform:scale(1)} 30%{opacity:0.6;transform:scale(1.4)} 70%{opacity:0.8;transform:scale(0.8)} 100%{opacity:1;transform:scale(1)} }
.atom-flash { animation: atomFlash 0.3s ease-out; }
@keyframes atomFlash { 0%{opacity:0;transform:scale(0.2)} 60%{opacity:1;transform:scale(1.3)} 100%{opacity:1;transform:scale(1)} }
</style>
</head>
<body>

<!-- 首页 -->
<div id="mainPage">
  <div class="main-title">化学方程式配平</div>
  <div class="main-subtitle">双人对战 · 单人练习 · 手动配平 · 微观粒子可视化</div>
  <div style="display:flex;gap:10px;justify-content:center;margin-bottom:10px;flex-wrap:wrap;">
    <button class="btn btn-primary" id="modeDuelBtn" onclick="setMode('duel')" style="font-size:14px;padding:8px 18px;">⚔️ 双人对战</button>
    <button class="btn" id="modeSoloBtn" onclick="setMode('solo')" style="font-size:14px;padding:8px 18px;background:rgba(255,255,255,0.1);color:var(--text-dim);border:1px solid rgba(255,255,255,0.15);">🧑‍🔬 单人练习</button>
  </div>
  <div class="method-grid">
    <div class="method-card" onclick="startGame('observe')">
      <div class="method-icon">🔍</div>
      <div class="method-name">观察法</div>
      <div class="method-desc">从复杂物质入手<br>逐一调整系数</div>
      <div class="method-count">12题</div>
    </div>
    <div class="method-card" onclick="startGame('lcm')">
      <div class="method-icon">🔢</div>
      <div class="method-name">最小公倍数法</div>
      <div class="method-desc">找原子数最小公倍数<br>确定关键系数</div>
      <div class="method-count">12题</div>
    </div>
    <div class="method-card" onclick="startGame('odd')">
      <div class="method-icon">⚖️</div>
      <div class="method-name">奇数配偶法</div>
      <div class="method-desc">出现奇偶原子时<br>用偶数配奇数</div>
      <div class="method-count">12题</div>
    </div>
    <div class="method-card" onclick="startGame('undetermined')">
      <div class="method-icon">📐</div>
      <div class="method-name">待定系数法</div>
      <div class="method-desc">设未知数解方程<br>适合复杂反应</div>
      <div class="method-count">12题</div>
    </div>
    <div class="method-card" onclick="startGame('mixed')">
      <div class="method-icon">⚔️</div>
      <div class="method-name">综合对战</div>
      <div class="method-desc">所有方法混合<br>随机出题挑战</div>
      <div class="method-count">32题</div>
    </div>
  </div>
  <div class="leaderboard-section">
    <h3>🏆 对战排名榜</h3>
    <div id="leaderboardContent"></div>
  </div>
</div>

<!-- 名字弹窗 -->
<div class="name-overlay" id="nameOverlay">
  <div class="name-container">
    <h2>选手入场</h2>
    <div class="name-inputs">
      <div class="name-field"><label class="blue">蓝方选手</label><input type="text" id="blueName" value="蓝方" maxlength="6"></div>
      <div class="name-field"><label class="red">红方选手</label><input type="text" id="redName" value="红方" maxlength="6"></div>
    </div>

<script>
document.addEventListener('contextmenu', e => e.preventDefault());
let _audioCtx = null;
function _initAudio(){ try { if(!_audioCtx) _audioCtx = new (window.AudioContext||window.webkitAudioContext)(); if(_audioCtx.state==='suspended') _audioCtx.resume(); } catch(e) {} }
document.addEventListener('click',_initAudio,{once:true});
document.addEventListener('touchstart',_initAudio,{once:true});
function playSound(type){
  if(!_audioCtx||_audioCtx.state==='suspended') return;
  const now=_audioCtx.currentTime;
  const play=(f,d,t='sine',v=0.12,f2)=>{const o=_audioCtx.createOscillator(),g=_audioCtx.createGain();o.connect(g);g.connect(_audioCtx.destination);o.type=t;o.frequency.setValueAtTime(f,now);if(f2) o.frequency.exponentialRampToValueAtTime(f2,now+d);g.gain.setValueAtTime(v,now);g.gain.exponentialRampToValueAtTime(0.001,now+d);o.start(now);o.stop(now+d);};
  switch(type){
    case 'click': play(700,0.07,'sine',0.08); break;
    case 'start': play(523,0.12,'sine',0.12); setTimeout(()=>play(784,0.18,'sine',0.12),110); break;
    case 'correct': play(784,0.1,'sine',0.14); setTimeout(()=>play(988,0.1,'sine',0.14),90); setTimeout(()=>play(1319,0.26,'sine',0.16),180); break;
    case 'wrong': play(415,0.16,'triangle',0.12); setTimeout(()=>play(311,0.26,'triangle',0.12),140); break;
    case 'skip': play(440,0.12,'triangle',0.1); break;
    case 'hit': play(180,0.18,'square',0.14,70); break;
    case 'tick': play(1000,0.05,'square',0.08); break;
    case 'go': play(659,0.15,'sine',0.14); setTimeout(()=>play(988,0.28,'sine',0.14),120); break;
    case 'win': [523,659,784,1047].forEach((f,i)=>setTimeout(()=>play(f,0.25,'sine',0.11),i*120)); break;
    case 'cheer': {
      const sr=_audioCtx.sampleRate,dur=1.8,buf=_audioCtx.createBuffer(1,Math.floor(sr*dur),sr),data=buf.getChannelData(0);
      for(let i=0;i<data.length;i++){const t=i/sr;data[i]=(Math.random()*2-1)*Math.exp(-((t)%0.18)*24)*Math.exp(-t*0.7)*0.5;}
      const ns=_audioCtx.createBufferSource();ns.buffer=buf;const fl=_audioCtx.createBiquadFilter();fl.type='bandpass';fl.frequency.value=2400;fl.Q.value=0.7;const ng=_audioCtx.createGain();ng.gain.value=0.5;ns.connect(fl);fl.connect(ng);ng.connect(_audioCtx.destination);ns.start(now);
      [523,659,784,1047,1319].forEach((f,i)=>setTimeout(()=>play(f,0.32,'triangle',0.08),i*90));
      setTimeout(()=>play(1568,0.55,'sine',0.1),620);
      break;
    }
  }
}
document.addEventListener('click',function(e){const b=e.target.closest('button,[onclick]');if(!b)return;if(b.classList.contains('zone-submit-btn'))return;playSound('click');},true);

// ====== 排名榜 (localStorage) ======
function getLeaderboard() {
  try { return JSON.parse(localStorage.getItem('chemBalLeaderboard') || '[]'); } catch(e) { return []; }
}
function saveLeaderboard(data) {
  try { localStorage.setItem('chemBalLeaderboard', JSON.stringify(data)); } catch(e) {}
}
function recordGameResult(winner, loser, winnerScore, loserScore) {
  const lb = getLeaderboard();
  const updatePlayer = (name) => {
    let found = lb.find(p => p.name === name);
    if (!found) { found = { name, wins: 0, losses: 0, totalGames: 0, totalScore: 0 }; lb.push(found); }
    found.totalGames++;
    found.totalScore += (name === winner ? winnerScore : loserScore);
    if (name === winner) found.wins++; else found.losses++;
  };
  updatePlayer(winner); updatePlayer(loser);
  lb.sort((a,b) => b.wins - a.wins || b.totalScore - a.totalScore);
  saveLeaderboard(lb);
  renderLeaderboard();
}
function renderLeaderboard() {
  const lb = getLeaderboard();
  const el = document.getElementById('leaderboardContent');
  if (lb.length === 0) { el.innerHTML = '<div class="leaderboard-empty">暂无对战记录，快来对战吧！</div>'; return; }
  let html = '<table class="leaderboard-table"><thead><tr><th>排名</th><th>选手</th><th>胜场</th><th>败场</th><th>总局数</th><th>总分</th></tr></thead><tbody>';
  lb.forEach((p, i) => {
    html += `<tr><td class="rank">${i+1}</td><td>${p.name}</td><td>${p.wins}</td><td>${p.losses}</td><td>${p.totalGames}</td><td>${p.totalScore}</td></tr>`;
  });
  html += '</tbody></table>';
  el.innerHTML = html;
}

// ====== 游戏流程 ======
function loadQuestions(mode) {
  switch(mode) {
    case 'observe': questions = OBSERVE_QUESTIONS.slice(); break;
    case 'lcm': questions = LCM_QUESTIONS.slice(); break;
    case 'odd': questions = ODD_QUESTIONS.slice(); break;
    case 'undetermined': questions = UNDETERMINED_QUESTIONS.slice(); break;
    case 'mixed': questions = [...OBSERVE_QUESTIONS, ...LCM_QUESTIONS, ...ODD_QUESTIONS, ...UNDETERMINED_QUESTIONS]; break;
    default: questions = OBSERVE_QUESTIONS.slice();
  }
}

function startGame(mode) {
  currentMode = mode;

  if (gameMode === 'solo') {

}

function resetGameState() {

  for (let i = pool.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [pool[i], pool[j]] = [pool[j], pool[i]];
  }

function startCountdown() {

      numberEl.textContent = count;
      playSound('tick');
      numberEl.style.animation = 'none'; numberEl.offsetHeight; numberEl.style.animation = 'countdownPop 0.6s ease-out';

}

// ====== 粒子渲染 ======
function getAtomCounts(moleculeList) {
  const counts = {};
  moleculeList.forEach(({m, n}) => {
    const shape = MOLECULE_SHAPES[m];
    if (!shape) return;
    shape.atoms.forEach(atom => { counts[atom.e] = (counts[atom.e] || 0) + n; });
  });
  return counts;
}

function renderParticles(side) {
  const rGroup = document.getElementById(side === 'blue' ? 'blueReactantParticles' : 'redReactantParticles');
  const pGroup = document.getElementById(side === 'blue' ? 'blueProductParticles' : 'redProductParticles');
  if (!rGroup || !pGroup) return;
  rGroup.innerHTML = '';
  pGroup.innerHTML = '';

  const q = window.currentGameQuestions[currentQuestion];
  if (!q) return;
  const coeffs = side === 'blue' ? blueCoeffs : redCoeffs;
  if (!coeffs || coeffs.length === 0) return;

  const formulaParts = q.formulas;
  let coeffIdx = 0, reactants = [], products = [], sideFlag = 'left';
  for (let i = 0; i < formulaParts.length; i++) {
    const part = formulaParts[i];
    if (part === '+') continue;
    if (part === '══') { sideFlag = 'right'; continue; }
    if (typeof part === 'number') continue;
    const coeff = coeffs[coeffIdx] || 1;
    	    let moleculeKey = part.replace(/[₀₁₂₃₄₅₆₇₈₉]/g, function(c) { return '0123456789'['₀₁₂₃₄₅₆₇₈₉'.indexOf(c)]; });
    	    // 去掉箭头符号 ↑ ↓
    	    moleculeKey = moleculeKey.replace(/[↑↓]/g, '');
    	    // 去掉括号：Al2(SO4)3 → Al2SO43, Ca(OH)2 → CaOH2, Cu2(OH)2CO3 → Cu2OH2CO3
    	    moleculeKey = moleculeKey.replace(/\(/g, '').replace(/\)/g, '');
    	    if (sideFlag === 'left') reactants.push({m: moleculeKey, n: coeff});
    else products.push({m: moleculeKey, n: coeff});
    coeffIdx++;
  }

  const scale = gameMode === 'solo' ? 0.5 : 0.4;
  	  const stepY = gameMode === 'solo' ? 35 : 35;
  	  const maxX = gameMode === 'solo' ? 180 : 180;
  	  const gapBetweenMolecules = 14;
  
  	  function drawMolecules(list, group, startX, startY, layoutMaxX) {
  	    let x = startX, y = startY;
  	    // 先计算该组所有分子需要的总宽度
  	    let totalWidth = 0;
  	    list.forEach(function(item) {
  	      const shape = MOLECULE_SHAPES[item.m];
  	      if (!shape) return;
  	      let molMinX = Infinity, molMaxX = -Infinity;
  	      shape.atoms.forEach(function(atom) {
  	        const r = ATOM_RADIUS[atom.e] || 9;
  	        if (atom.x - r < molMinX) molMinX = atom.x - r;
  	        if (atom.x + r > molMaxX) molMaxX = atom.x + r;
  	      });
  	      const molWidth = (molMaxX - molMinX + 12) * scale; // pad=6*2
  	      for (let j = 0; j < item.n; j++) {
  	        totalWidth += molWidth + gapBetweenMolecules;
  	      }
  	    });
  	    totalWidth -= gapBetweenMolecules; // 去掉最后一个的间隔
  	    	    // 居中偏移：基于框内可用宽度
  	    	    const availableWidth = layoutMaxX - startX;
  	    	    const centerOffset = Math.max(0, (availableWidth - totalWidth) / 2);
  
  	    list.forEach(function(item) {
  	      const shape = MOLECULE_SHAPES[item.m];
  	      if (!shape) return;
  	      let molMinX = Infinity, molMaxX = -Infinity, molMinY = Infinity, molMaxY = -Infinity;
  	      shape.atoms.forEach(function(atom) {
  	        const r = ATOM_RADIUS[atom.e] || 9;
  	        if (atom.x - r < molMinX) molMinX = atom.x - r;
  	        if (atom.y - r < molMinY) molMinY = atom.y - r;
  	        if (atom.x + r > molMaxX) molMaxX = atom.x + r;
  	        if (atom.y + r > molMaxY) molMaxY = atom.y + r;
  	      });
  	      const pad = 6;
  	      const molWidth = (molMaxX - molMinX + pad * 2) * scale;
  
  	      for (let j = 0; j < item.n; j++) {
  	        if (x + molWidth > layoutMaxX && x > startX) { x = startX; y += stepY; }
  
  	        const g = document.createElementNS('http://www.w3.org/2000/svg', 'g');
  	        g.setAttribute('transform', 'translate(' + (x + centerOffset) + ',' + y + ') scale(' + scale + ')');
  
  	        // 分子半透明背景框
  	        const bg = document.createElementNS('http://www.w3.org/2000/svg', 'rect');
  	        bg.setAttribute('x', molMinX - pad);
  	        bg.setAttribute('y', molMinY - pad);
  	        bg.setAttribute('width', molMaxX - molMinX + pad * 2);
  	        bg.setAttribute('height', molMaxY - molMinY + pad * 2);
  	        var rx = (molMaxX - molMinX + pad * 2) * 0.25;
  	        var ry = (molMaxY - molMinY + pad * 2) * 0.25;
  	        bg.setAttribute('rx', rx);
  	        bg.setAttribute('ry', ry);
  	        bg.setAttribute('fill', 'rgba(255,255,255,0.06)');
  	        bg.setAttribute('stroke', 'rgba(255,255,255,0.15)');
  	        bg.setAttribute('stroke-width', '1.5');
  	        bg.setAttribute('stroke-dasharray', '4 3');
  	        g.appendChild(bg);
  
  	        // 分子名标签
  	        const mLabel = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  	        mLabel.setAttribute('x', (molMinX + molMaxX) / 2);
  	        mLabel.setAttribute('y', molMinY - pad - 3);
  	        mLabel.setAttribute('text-anchor', 'middle');
  	        mLabel.setAttribute('fill', 'rgba(255,255,255,0.5)');
  	        mLabel.setAttribute('font-size', '6');
  	        mLabel.setAttribute('font-weight', '700');
  	        mLabel.textContent = item.m;
  	        g.appendChild(mLabel);
  
  	        shape.atoms.forEach(function(atom) {
  	          const circle = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  	          circle.setAttribute('cx', atom.x); circle.setAttribute('cy', atom.y);
  	          circle.setAttribute('r', ATOM_RADIUS[atom.e] || 9);
  	          circle.setAttribute('fill', ATOM_COLORS[atom.e] || '#888');
  	          circle.setAttribute('stroke', 'rgba(255,255,255,0.4)'); circle.setAttribute('stroke-width', '1.5');
  	          circle.classList.add('atom-circle');
  	          g.appendChild(circle);
  	          const label = document.createElementNS('http://www.w3.org/2000/svg', 'text');
  	          label.setAttribute('x', atom.x); label.setAttribute('y', atom.y + 3.5);
  	          label.setAttribute('text-anchor', 'middle');
  	          label.setAttribute('fill', (atom.e === 'H' || atom.e === 'S' || atom.e === 'C') ? '#000' : '#fff');
  	          label.setAttribute('font-size', '7'); label.setAttribute('font-weight', '700');
  	          label.textContent = atom.e;
  	          g.appendChild(label);
  	        });
  	        group.appendChild(g);
  	        x += molWidth + gapBetweenMolecules;
  	      }
  	    });
  	  }

  const rxStart = gameMode === 'solo' ? 24 : 20;
  	  const pxStart = gameMode === 'solo' ? 382 : 208;
  	  // 框的右边界（绝对坐标）—— 反应物框 x:2~150, 生成物框 x:190~338
  	  const rxEnd = gameMode === 'solo' ? 150 : 150;
  	  const pxEnd = gameMode === 'solo' ? 510 : 338;
  
  	  // 直接画反应物和生成物粒子
  	  drawMolecules(reactants, rGroup, rxStart, 30, rxEnd);
  	  drawMolecules(products, pGroup, pxStart, 30, pxEnd);
  	}

function animateParticleRearrangement() {
  const allCircles = document.querySelectorAll('#blueParticleSvg .atom-circle, #redParticleSvg .atom-circle');
  allCircles.forEach((c, i) => {
    setTimeout(() => {
      c.classList.add('rearranging');
      setTimeout(() => c.classList.remove('rearranging'), 800);
    }, i * 30);
  });
}

// ====== 题目渲染 ======
function showQuestionWithParticles() {
  const total = window.currentGameQuestions.length;
  if (gameMode === 'solo') {
    if (currentQuestion >= total) { endGame(); return; }
  } else {
    if (blueScore >= 5 || redScore >= 5 || blueHp <= 0 || redHp <= 0 || currentQuestion >= total) { endGame(); return; }
  }
  const q = window.currentGameQuestions[currentQuestion];
  if (!q) { endGame(); return; }
  roundResolved = false;
  blueCoeffs = []; redCoeffs = [];
  // 初始化系数为全1，让粒子在初始状态下就能显示
  for (let i = 0; i < q.answer.length; i++) { blueCoeffs.push(1); redCoeffs.push(1); }

  document.getElementById('roundInfo').textContent = '第 ' + (currentQuestion + 1) + ' / ' + total + ' 题';
  document.getElementById('questionText').textContent = gameMode === 'solo' ? '请配平化学方程式' : '请双方配平化学方程式，谁先提交正确答案谁得分！';
  document.getElementById('dualBalancing').style.display = 'flex';
  document.getElementById('particleHint').textContent = '点击 +/− 按钮调整化学计量数，点击提交按钮确认';

  // 清除粒子
  document.getElementById('blueReactantParticles').innerHTML = '';
  document.getElementById('blueProductParticles').innerHTML = '';
  document.getElementById('redReactantParticles').innerHTML = '';
  document.getElementById('redProductParticles').innerHTML = '';

  // 渲染蓝方区域
  renderFormulaZone('blue', q);
  document.getElementById('blueZone').classList.add('active');
  document.getElementById('blueZone').classList.remove('winner');
  document.getElementById('blueSubmitBtn').disabled = false;

  if (gameMode === 'duel') {
    renderFormulaZone('red', q);
    document.getElementById('redZone').classList.add('active');
    document.getElementById('redZone').classList.remove('winner');
    document.getElementById('redSubmitBtn').disabled = false;
  }

  document.getElementById('blueChar').className = 'character';
  document.getElementById('redChar').className = 'character';
  document.getElementById('answerIndicator').style.display = 'none';
  document.getElementById('winnerToast').style.display = 'none';

  // 用初始系数(全1)渲染粒子，学生调整系数时粒子会实时跟随
  renderParticles('blue');
  if (gameMode === 'duel') renderParticles('red');
}

function renderFormulaZone(side, q) {
  const container = document.getElementById(side === 'blue' ? 'blueFormulas' : 'redFormulas');
  let html = '';
  let coeffIdx = 0;
  q.formulas.forEach((item) => {
    if (item === '+') { html += '<span class="plus-sep">+</span>'; return; }
    if (item === '══') { html += '<span class="arrow-sep">══</span>'; return; }
    if (typeof item === 'number') return; // 跳过占位数字，不递增 coeffIdx
    html += '<div class="formula-item">';
    html += '<div class="coeff-control">';
    html += `<button class="coeff-btn minus" onclick="changeCoeff('${side}',${coeffIdx},-1)" ${roundResolved?'disabled':''}>−</button>`;
    html += `<div class="coeff-display" id="coeff_${side}_${coeffIdx}">1</div>`;
    html += `<button class="coeff-btn plus" onclick="changeCoeff('${side}',${coeffIdx},1)" ${roundResolved?'disabled':''}>+</button>`;
    html += '</div>';
    html += '<div class="formula-text">' + item + '</div>';
    html += '</div>';
    coeffIdx++;
  });
  container.innerHTML = html;
}

function changeCoeff(side, idx, delta) {
  if (roundResolved) return;
  const coeffs = side === 'blue' ? blueCoeffs : redCoeffs;
  if (coeffs.length === 0) {
    const q = window.currentGameQuestions[currentQuestion];
    const total = q.answer.length;
    for (let i = 0; i < total; i++) coeffs.push(1);
  }
  coeffs[idx] = Math.max(1, Math.min(9, coeffs[idx] + delta));
  document.getElementById('coeff_' + side + '_' + idx).textContent = coeffs[idx];
  // 实时更新粒子
  renderParticles(side);
}

function submitAnswer(side) {
  if (roundResolved) return;
  const q = window.currentGameQuestions[currentQuestion];
  const coeffs = side === 'blue' ? blueCoeffs : redCoeffs;
  if (coeffs.length === 0) {
    // 还没调过系数，全部按 1
    for (let i = 0; i < q.answer.length; i++) coeffs.push(1);
  }
  const isCorrect = coeffs.length === q.answer.length && coeffs.every((v, i) => v === q.answer[i]);

  // 显示该方的结果
  coeffs.forEach((v, i) => {
    const el = document.getElementById('coeff_' + side + '_' + i);
    if (v === q.answer[i]) el.classList.add('correct');
    else el.classList.add('wrong');
  });

  if (isCorrect) {
    roundResolved = true;
    // 禁用所有按钮
    document.querySelectorAll('.coeff-btn').forEach(b => b.disabled = true);
    document.getElementById('blueSubmitBtn').disabled = true;
    if (gameMode === 'duel') document.getElementById('redSubmitBtn').disabled = true;
    document.getElementById('blueZone').classList.remove('active');
    if (gameMode === 'duel') document.getElementById('redZone').classList.remove('active');

    if (gameMode === 'solo') {
      // 单人模式：正确计数 +1，无 HP 扣减
      window.soloCorrect = (window.soloCorrect || 0) + 1;
      document.getElementById('blueZone').classList.add('winner');
      document.getElementById('blueSubmitBtn').classList.add('flash');
      renderParticles('blue');
      setTimeout(() => animateParticleRearrangement(), 300);
      showAnswerIndicator(true, '');
      playSound('correct');
      document.getElementById('particleHint').textContent = '回答正确！已答对 ' + window.soloCorrect + ' / ' + (currentQuestion + 1) + ' 题';
      updateUI();
      setTimeout(() => { currentQuestion++; const total = window.currentGameQuestions.length; if (currentQuestion >= total) endGame(); else nextRoundCountdown(); }, 1800);
      return;
    }

    const winnerName = side === 'blue' ? blueName : redName;
    const loserName = side === 'blue' ? redName : blueName;

    // 高亮获胜方
    document.getElementById(side + 'Zone').classList.add('winner');
    document.getElementById(side + 'SubmitBtn').classList.add('flash');

    // 显示粒子
    renderParticles(side);
    setTimeout(() => animateParticleRearrangement(), 300);

    // 得分
    if (side === 'blue') { blueScore++; redHp = Math.max(0, redHp - 20); playAttackAnimation('blue'); }
    else { redScore++; blueHp = Math.max(0, blueHp - 20); playAttackAnimation('red'); }

    showAnswerIndicator(true, winnerName);
    showWinnerToast(winnerName);
    playSound('correct');
    document.getElementById('particleHint').textContent = winnerName + ' 回答正确！得分 +1';

    updateUI();
    if (blueHp <= 0 || redHp <= 0) { setTimeout(() => endGame(), 2000); return; }
    setTimeout(() => { currentQuestion++; const total = window.currentGameQuestions.length; if (blueScore >= 5 || redScore >= 5 || currentQuestion >= total) endGame(); else nextRoundCountdown(); }, 2200);
  } else {
    // 提交但错误
    const name = side === 'blue' ? blueName : redName;
    showAnswerIndicator(false, name);
    playSound('wrong');
    document.getElementById('particleHint').textContent = name + ' 回答错误，请重试！';
    // 重置错误显示
    setTimeout(() => {
      coeffs.forEach((v, i) => {
        const el = document.getElementById('coeff_' + side + '_' + i);
        el.classList.remove('wrong');
      });
      document.getElementById('answerIndicator').style.display = 'none';
    }, 1500);
  }
}

function showAnswerIndicator(isCorrect, name) {
  const indicator = document.getElementById('answerIndicator');
  indicator.textContent = isCorrect ? name + ' 回答正确！' : name + ' 回答错误！';
  indicator.className = 'answer-indicator ' + (isCorrect ? 'correct' : 'wrong');
  indicator.style.display = 'block';

function playAttackAnimation(attacker) {
  const defender = attacker === 'blue' ? 'red' : 'blue';
  const attackerChar = document.getElementById(attacker === 'blue' ? 'blueChar' : 'redChar');
  const defenderChar = document.getElementById(defender === 'blue' ? 'blueChar' : 'redChar');
  attackerChar.classList.add(attacker === 'blue' ? 'attack-left' : 'attack-right');
  setTimeout(() => {
    const rectA = attackerChar.getBoundingClientRect();
    const rectD = defenderChar.getBoundingClientRect();
    const sx = rectA.left + rectA.width * 0.7, sy = rectA.top + rectA.height * 0.3;
    const ex = rectD.left + rectD.width * 0.3, ey = rectD.top + rectD.height * 0.3;
    const projectile = document.createElement('div');
    projectile.style.cssText = 'position:fixed;width:16px;height:16px;border-radius:50%;z-index:100;pointer-events:none;left:'+(sx-8)+'px;top:'+(sy-8)+'px;background:radial-gradient(circle,'+(attacker==='blue'?'#93c5fd':'#fca5a5')+','+(attacker==='blue'?'#3b82f6':'#ef4444')+');box-shadow:0 0 10px '+(attacker==='blue'?'#3b82f6':'#ef4444')+';';
    document.body.appendChild(projectile);
    const startTime = performance.now();
    function anim(now){ const p = Math.min((now - startTime) / 350, 1); const e = 1 - Math.pow(1 - p, 2); projectile.style.left = sx + (ex - sx) * e - 8 + 'px'; projectile.style.top = sy + (ey - sy) * e - Math.sin(p * Math.PI) * 25 - 8 + 'px'; if (p < 1) requestAnimationFrame(anim); else { projectile.remove(); defenderChar.classList.add('hit'); setTimeout(() => defenderChar.classList.remove('hit'), 500); } }
    requestAnimationFrame(anim);
  }, 200);
  setTimeout(() => { attackerChar.classList.remove('attack-left', 'attack-right'); }, 1300);
}

// ====== 雷达图 ======
function renderRadarChart(correct, total, mode) {
  const methodNames = ['观察法', '最小公倍数法', '奇数配偶法', '待定系数法', '综合'];
  // 使用存储的所有模式成绩
  var allScores = JSON.parse(localStorage.getItem('chemBalSoloScores') || '{}');
  var labels = methodNames;
  var values = methodNames.map(function(m) { return allScores[m] ? Math.round(allScores[m].rate) : 0; });
  
  var canvas = document.getElementById('radarCanvas');
  if (!canvas) return;
  var ctx = canvas.getContext('2d');
  var w = canvas.width, h = canvas.height;
  var cx = w / 2, cy = h / 2;
  var maxR = Math.min(cx, cy) - 30;
  var n = labels.length;
  
  ctx.clearRect(0, 0, w, h);
  
  // 背景网格
  for (var level = 1; level <= 5; level++) {
    ctx.beginPath();
    for (var i = 0; i <= n; i++) {
      var angle = (Math.PI * 2 / n) * i - Math.PI / 2;
      var r = maxR * level / 5;
      var x = cx + Math.cos(angle) * r;
      var y = cy + Math.sin(angle) * r;
      if (i === 0) ctx.moveTo(x, y);
      else ctx.lineTo(x, y);
    }
    ctx.closePath();
    ctx.strokeStyle = 'rgba(255,255,255,0.08)';
    ctx.stroke();
  }
  
  // 轴线
  for (var i = 0; i < n; i++) {
    var angle = (Math.PI * 2 / n) * i - Math.PI / 2;
    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.lineTo(cx + Math.cos(angle) * maxR, cy + Math.sin(angle) * maxR);
    ctx.strokeStyle = 'rgba(255,255,255,0.12)';
    ctx.stroke();
  }
  
  // 数据区域
  ctx.beginPath();
  for (var i = 0; i < n; i++) {
    var angle = (Math.PI * 2 / n) * i - Math.PI / 2;
    var val = Math.max(values[i], 5);
    var r = maxR * val / 100;
    var x = cx + Math.cos(angle) * r;
    var y = cy + Math.sin(angle) * r;
    if (i === 0) ctx.moveTo(x, y);
    else ctx.lineTo(x, y);
  }
  ctx.closePath();
  var grad = ctx.createRadialGradient(cx, cy, 0, cx, cy, maxR);
  grad.addColorStop(0, 'rgba(59,130,246,0.5)');
  grad.addColorStop(1, 'rgba(239,68,68,0.3)');
  ctx.fillStyle = grad;
  ctx.fill();
  ctx.strokeStyle = '#60a5fa';
  ctx.lineWidth = 2;
  ctx.stroke();
  
  // 数据点
  for (var i = 0; i < n; i++) {
    var angle = (Math.PI * 2 / n) * i - Math.PI / 2;
    var val = Math.max(values[i], 5);
    var r = maxR * val / 100;
    var x = cx + Math.cos(angle) * r;
    var y = cy + Math.sin(angle) * r;
    ctx.beginPath();
    ctx.arc(x, y, 4, 0, Math.PI * 2);
    ctx.fillStyle = '#f59e0b';
    ctx.fill();
    ctx.strokeStyle = '#fff';
    ctx.lineWidth = 1.5;
    ctx.stroke();
  }
  
  // 标签
  ctx.fillStyle = '#e2e8f0';
  ctx.font = 'bold 11px "Noto Sans SC", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  for (var i = 0; i < n; i++) {
    var angle = (Math.PI * 2 / n) * i - Math.PI / 2;
    var r = maxR + 18;
    var x = cx + Math.cos(angle) * r;
    var y = cy + Math.sin(angle) * r;
    ctx.fillText(labels[i] + ' ' + values[i] + '%', x, y);
  }
}

function endGame() {
  gameActive = false;
  if (gameMode === 'solo') {
    // 单人模式结算
    const total = window.currentGameQuestions.length;
    const correct = window.soloCorrect || 0;
    const rate = total > 0 ? Math.round(correct / total * 100) : 0;
    // 存储成绩
    var allScores = JSON.parse(localStorage.getItem('chemBalSoloScores') || '{}');
    var modeName = '';
    switch(currentMode) {
      case 'observe': modeName = '观察法'; break;
      case 'lcm': modeName = '最小公倍数法'; break;
      case 'odd': modeName = '奇数配偶法'; break;
      case 'undetermined': modeName = '待定系数法'; break;
      case 'mixed': modeName = '综合'; break;
    }
    allScores[modeName] = { correct: correct, total: total, rate: rate };
    localStorage.setItem('chemBalSoloScores', JSON.stringify(allScores));
    setTimeout(() => {
      document.getElementById('resultOverlay').style.display = 'flex';
      document.getElementById('radarContainer').style.display = 'block';
      document.getElementById('resultText').textContent = '练习完成！';
      document.getElementById('resultText').className = 'result-text win';
      document.getElementById('resultSub').textContent = '答对 ' + correct + ' / ' + total + ' 题（正确率 ' + rate + '%）';
      renderRadarChart(correct, total, currentMode);
    }, 800);
    return;
  }

  let blueWin = blueScore >= 5 || redHp <= 0;
  let redWin = redScore >= 5 || blueHp <= 0;
  if (blueWin && redWin) { blueWin = blueScore >= redScore; redWin = redScore > blueScore; }
  const draw = !blueWin && !redWin;
  if (blueWin) { document.getElementById('blueChar').classList.add('victory'); document.getElementById('redChar').classList.add('defeat'); }
  else if (redWin) { document.getElementById('redChar').classList.add('victory'); document.getElementById('blueChar').classList.add('defeat'); }
  if (!draw) { playSound('win'); setTimeout(() => playSound('cheer'), 500); }

  // 记录排行榜
  if (!draw) {
    const winner = blueWin ? blueName : redName;
    const loser = blueWin ? redName : blueName;
    const wScore = blueWin ? blueScore : redScore;
    const lScore = blueWin ? redScore : blueScore;
    recordGameResult(winner, loser, wScore, lScore);
  }

  setTimeout(() => {
    document.getElementById('resultOverlay').style.display = 'flex';
    const text = document.getElementById('resultText'), sub = document.getElementById('resultSub');
    if (draw) { text.textContent = '平局！'; text.className = 'result-text'; sub.textContent = blueName + ' ' + blueScore + ' : ' + redScore + ' ' + redName; }
    else if (blueWin) { text.textContent = blueName + ' 获胜！'; text.className = 'result-text win'; sub.textContent = blueScore + ' : ' + redScore; }
    else { text.textContent = redName + ' 获胜！'; text.className = 'result-text win'; sub.textContent = blueScore + ' : ' + redScore; }
  }, 1200);
}
