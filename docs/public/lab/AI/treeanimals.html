            async handleFileUpload(event) {
                const file = event.target.files[0];
                if (!file) return;

                const fileName = file.name.toLowerCase();
                const textarea = document.getElementById('studentNames');

                if (fileName.endsWith('.xlsx') || fileName.endsWith('.xls')) {
                    // 处理 Excel 文件
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        try {
                            const data = new Uint8Array(e.target.result);
                            const workbook = XLSX.read(data, { type: 'array' });
                            const firstSheetName = workbook.SheetNames[0];
                            const worksheet = workbook.Sheets[firstSheetName];
                            
                            // 获取第一列数据
                            const jsonData = XLSX.utils.sheet_to_json(worksheet, { header: 1 });
                            const names = jsonData
                                .map(row => row[0]) // 取第一列
                                .filter(name => name && typeof name === 'string' && name.trim().length > 0);
                            
                            textarea.value = names.join('\n');
                            this.showNotification(`已读取 ${names.length} 个名字`, 'success');
                        } catch (error) {
                            console.error(error);
                            this.showNotification('Excel 解析失败，请检查文件格式', 'error');
                        }
                    };
                    reader.readAsArrayBuffer(file);
                } else {
                    // 处理文本文件
                    const reader = new FileReader();
                    reader.onload = (e) => {
                        textarea.value = e.target.result;
                        this.showNotification('文件读取成功', 'success');
                    };
                    reader.readAsText(file);
                }
            }

            async startDetection() {
                try {
                    this.audioContext = new (window.AudioContext || window.webkitAudioContext)();
                    this.stream = await navigator.mediaDevices.getUserMedia({ audio: true });
                    
                    this.microphone = this.audioContext.createMediaStreamSource(this.stream);
                    this.analyser = this.audioContext.createAnalyser();
                    this.analyser.fftSize = 256;
                    
                    this.microphone.connect(this.analyser);
                    this.dataArray = new Uint8Array(this.analyser.frequencyBinCount);
                    
                    this.isDetecting = true;
                    this.lastFrameTime = Date.now();
                    document.getElementById('startDetection').style.display = 'none';
                    document.getElementById('stopDetection').style.display = 'inline-block';
                    
                    this.detectVolume();
                    this.showNotification('开始音量检测', 'success');
                } catch (error) {
                    this.showNotification('无法访问麦克风，请检查权限设置', 'warning');
                }
            }
            
            stopDetection() {
                this.isDetecting = false;
                
                if (this.audioContext) {
                    this.audioContext.close();
                    this.audioContext = null;
                }
                
                if (this.stream) {
                    this.stream.getTracks().forEach(track => track.stop());
                    this.stream = null;
                }
                
                document.getElementById('startDetection').style.display = 'inline-block';
                document.getElementById('stopDetection').style.display = 'none';
                
                this.quietTimer = 0;
                this.noisyTimer = 0;
                this.quietStartTime = null;
                this.noisyStartTime = null;
                
                this.updateDisplay();
                this.showNotification('停止音量检测', 'success');
            }
            
            detectVolume() {
                if (!this.isDetecting) return;
                
                const now = Date.now();
                const deltaTime = (now - this.lastFrameTime) / 1000;
                this.lastFrameTime = now;

                this.analyser.getByteFrequencyData(this.dataArray);
                
                // 计算 RMS (均方根) 以获得更真实的能量值
                let sum = 0;
                for (let i = 0; i < this.dataArray.length; i++) {
                    sum += this.dataArray[i] * this.dataArray[i];
                }
                const rms = Math.sqrt(sum / this.dataArray.length);
                
                // 转换为近似分贝值 (dB)
                // 假设基准为 0dB (静音), 最大约为 100dB
                // 这里的计算是近似值，用于模拟真实听感
                let db = 0;
                if (rms > 0) {
                    db = Math.round(20 * Math.log10(rms) + 10); // +10 为校准偏移
                }
                
                // 限制范围并应用灵敏度微调
                this.currentVolume = Math.max(0, Math.min(120, Math.round(db * this.settings.micSensitivity)));
                
                this.processVolumeLogic(deltaTime);
                this.updateDisplay();
                
                requestAnimationFrame(() => this.detectVolume());
            }
            
            // 新增：倒计时与音量同步逻辑
            initCountdown() {
                const widget = document.getElementById('countdownWidget');
                const btnStart = document.getElementById('btnStartTimer');
                const btnSet = document.getElementById('btnSetTimer');
                const btnReset = document.getElementById('btnResetTimer');
                const btnMaximize = document.getElementById('btnMaximizeTimer');

                // 设置时间
                btnSet.addEventListener('click', (e) => {
                    e.stopPropagation();
                    const input = prompt('请输入倒计时分钟数:', '40');
                    if (input) {
                        const minutes = parseFloat(input);
                        if (!isNaN(minutes) && minutes > 0) {
                            this.initialCountdownTime = Math.floor(minutes * 60);
                            this.countdownTime = this.initialCountdownTime;
                            this.updateCountdownDisplay();
                            this.pauseCountdown();
                            this.showNotification(`倒计时已设置为 ${minutes} 分钟`, 'success');
                        }
                    }
                });

                // 开始/暂停
                btnStart.addEventListener('click', (e) => {
                    e.stopPropagation();
                    if (this.isCountdownRunning) {
                        this.pauseCountdown();
                    } else {
                        if (this.countdownTime <= 0) {
                            this.initialCountdownTime = 2400; // 默认40分钟
                            this.countdownTime = 2400;
                        }
                        this.startCountdown();
                    }
                });

                // 重置
                btnReset.addEventListener('click', (e) => {
                    e.stopPropagation();
                    this.pauseCountdown();
                    this.countdownTime = this.initialCountdownTime;
                    this.updateCountdownDisplay();
                });

                // 最大化/还原
                btnMaximize.addEventListener('click', (e) => {
                    e.stopPropagation();
                    widget.classList.toggle('maximized');
                    const isMax = widget.classList.contains('maximized');
                    btnMaximize.textContent = isMax ? '↙️' : '⛶';
                });

                // 双击数字区域也可以切换全屏
                document.getElementById('countdownDisplay').addEventListener('dblclick', () => {
                    widget.classList.toggle('maximized');
                    const isMax = widget.classList.contains('maximized');
                    btnMaximize.textContent = isMax ? '↙️' : '⛶';
                });
                
                // 绑定班级树界面的阈值滑块同步
                const treeSlider = document.getElementById('treeVolumeThresholdSlider');
                const mainSlider = document.getElementById('volumeThresholdSlider');
                
                if (treeSlider && mainSlider) {
                    // 初始化位置
                    treeSlider.value = this.settings.volumeThreshold;
                    this.updateThresholdLine();

                    // 班级树滑块 -> 主滑块
                    treeSlider.addEventListener('input', (e) => {
                        const val = e.target.value;
                        this.settings.volumeThreshold = parseInt(val);
                        mainSlider.value = val; // 同步主滑块
                        document.getElementById('thresholdValue').textContent = `${val} dB`;
                        document.getElementById('treeThresholdValue').textContent = val;
                        this.updateThresholdLine();
                        this.saveData();
                    });

                    // 主滑块 -> 班级树滑块 (补充监听)
                    mainSlider.addEventListener('input', (e) => {
                        const val = e.target.value;
                        treeSlider.value = val;
                        document.getElementById('treeThresholdValue').textContent = val;
                        this.updateThresholdLine();
                    });
                }
            }

            updateThresholdLine() {
                const line = document.getElementById('treeThresholdLine');
                if (line) {
                    line.style.left = `${this.settings.volumeThreshold}%`;
                }
            }

            startCountdown() {
                if (this.isCountdownRunning) return;
                this.isCountdownRunning = true;
                document.getElementById('btnStartTimer').textContent = 'II';
                
                this.countdownTimer = setInterval(() => {
                    if (this.countdownTime > 0) {
                        this.countdownTime--;
                        this.updateCountdownDisplay();
                        if (this.countdownTime <= 10) {
                            document.getElementById('countdownDisplay').classList.add('urgent');
                        }
                    } else {
                        this.finishCountdown();
                    }
                }, 1000);
            }

            pauseCountdown() {
                this.isCountdownRunning = false;
                document.getElementById('btnStartTimer').textContent = '▶️';
                clearInterval(this.countdownTimer);
                document.getElementById('countdownDisplay').classList.remove('urgent');
            }

            finishCountdown() {
                this.pauseCountdown();
                this.showAlert('green', '⏰ 时间到！');
                setTimeout(() => this.hideAlert(), 3000);
            }

            updateCountdownDisplay() {
                const minutes = Math.floor(this.countdownTime / 60);
                const seconds = this.countdownTime % 60;
                const text = `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
                document.getElementById('countdownDisplay').textContent = text;
            }
            
            processVolumeLogic(deltaTime) {
                const threshold = this.settings.volumeThreshold;
                const mode = this.settings.mode || 'study';
                
                // 动态计算进度增长速度
                // 自习模式：越安静(音量越小)越快
                // 朗读模式：越响亮(音量越大)越快
                
                if (mode === 'study') {
                    this.processStudyMode(threshold, deltaTime);
                } else {
                    this.processReadMode(threshold, deltaTime);
                }
            }

            processStudyMode(threshold, deltaTime) {
                const requiredDuration = this.settings.timerDuration || 30;
                const punishDuration = this.settings.punishDuration || 30;

                if (this.currentVolume < threshold) {
                    // 安静状态
                    if (this.quietStartTime === null) {
                        this.quietStartTime = Date.now();
                        this.noisyStartTime = null;
                        this.noisyTimer = 0;
                        this.hideAlert();
                    }
                    
                    // 实时更新监控数据
                    this.quietTimer = Math.floor((Date.now() - this.quietStartTime) / 1000);
                    if (deltaTime && deltaTime > 0 && deltaTime < 1) this.totalQuietTime += deltaTime;

                    // 越安静，时间流逝越快 (奖励系数)
                    // 假设阈值50，当前20，差值30。当前40，差值10。
                    // 基础速度 1x，最大速度 2.5x
                    const diff = Math.max(0, threshold - this.currentVolume);
                    const speedFactor = 1 + (diff / threshold) * 1.5;
                    
                    // 使用虚拟计时器累加
                    if (!this.virtualQuietTime) this.virtualQuietTime = 0;
                    this.virtualQuietTime += 0.1 * speedFactor; // 假设每100ms调用一次
                    
                    // 更新显示用的计时器 (为了UI显示平滑，这里还是用真实时间差，但在判断时用虚拟时间)
                    // 修正：为了简单展示，我们直接用虚拟时间判断
                    if (this.virtualQuietTime >= requiredDuration) {
                        this.rewardStudents();
                        // 安静加分不再全屏显示，避免打扰
                        // this.showAlert('green', '🎉 极度专注！全班加分！');
                        // setTimeout(() => this.hideAlert(), 2000);
                        this.quietStartTime = Date.now();
                        this.virtualQuietTime = 0;
                    }
                } else {
                    // 吵闹状态
                    this.virtualQuietTime = 0;
                    this.quietTimer = 0;
                    if (this.noisyStartTime === null) {
                        this.noisyStartTime = Date.now();
                        this.quietStartTime = null;
                        this.showAlert('red', '⚠️ 保持安静！');
                    }
                    
                    this.noisyTimer = Math.floor((Date.now() - this.noisyStartTime) / 1000);
                    
                    if (this.noisyTimer >= punishDuration) {
                        this.punishStudents();
                        this.showAlert('red', '🚫 持续吵闹！全班扣分！');
                        setTimeout(() => this.hideAlert(), 2000);
                        this.noisyStartTime = Date.now();
                        this.noisyTimer = 0;
                    }
                }
            }

            processReadMode(threshold, deltaTime) {
                const requiredDuration = 20; // 朗读模式周期稍短
                
                if (this.currentVolume > threshold) {
                    // 朗读状态 (声音够大)
                    if (this.quietStartTime === null) {
                        this.quietStartTime = Date.now(); // 复用变量名作为“达标开始时间”
                        this.hideAlert();
                    }

                    // 实时更新监控数据
                    this.quietTimer = Math.floor((Date.now() - this.quietStartTime) / 1000);
                    if (deltaTime && deltaTime > 0 && deltaTime < 1) this.totalQuietTime += deltaTime;

                    // 声音越响，越快
                    // 假设阈值50，当前80，差值30
                    const diff = Math.max(0, this.currentVolume - threshold);
                    const speedFactor = 1 + (diff / 50) * 2; // 最大3x速度

                    if (!this.virtualQuietTime) this.virtualQuietTime = 0;
                    this.virtualQuietTime += 0.1 * speedFactor;

                    if (this.virtualQuietTime >= requiredDuration) {
                        this.rewardStudents();
                        this.showAlert('green', '🗣️ 书声琅琅！全班加分！');
                        setTimeout(() => this.hideAlert(), 2000);
                        this.quietStartTime = Date.now();
                        this.virtualQuietTime = 0;
                    }
                } else {
                    // 声音太小
                    // 朗读模式下，声音小不惩罚，只是不加分，或者提示大声点
                    this.virtualQuietTime = Math.max(0, (this.virtualQuietTime || 0) - 0.05); // 缓慢衰减
                    this.quietStartTime = null;
                    this.quietTimer = 0;
                    
                    // 如果长时间没声音，可以提示
                    // 这里简化处理，只在界面显示状态
                }
            }

            showAlert(type, text) {
                const alert = document.getElementById('alertOverlay');
                alert.className = `fullscreen-alert ${type}`;
                alert.textContent = text;
            }

            hideAlert() {
                const alert = document.getElementById('alertOverlay');
                alert.className = 'fullscreen-alert';
            }
            
            // 计算升级所需经验：等级 * 系数
            getExpForNextLevel(level) {
                return level * (this.settings.levelDifficulty || 100);
            }

            // 获取当前等级对应的图片
            getTreeImage(level) {
                const stage = this.treeStages.find(s => level >= s.min && level <= s.max) || this.treeStages[0];
                return stage.url;
            }

            switchView(viewName) {
                document.querySelectorAll('.view-btn').forEach(btn => btn.classList.remove('active'));
                document.querySelector(`[data-view="${viewName}"]`).classList.add('active');

                if (viewName === 'class') {
                    document.getElementById('classTreeView').classList.add('active');
                    document.getElementById('studentsView').style.display = 'none';
                    this.updateClassTree();
                } else {
                    document.getElementById('classTreeView').classList.remove('active');
                    document.getElementById('studentsView').style.display = 'grid';
                }
            }

            getClassExpForNextLevel(level) {
                return level * 500; // 班级升级需要更多经验
            }

            addClassExp(amount) {
                this.classTree.exp += amount;
                this.classTree.totalExp += amount;
                
                const maxExp = this.getClassExpForNextLevel(this.classTree.level);
                if (this.classTree.exp >= maxExp) {
                    this.classTree.exp -= maxExp;
                    this.classTree.level++;
                    this.showNotification('🎉 班级神树升级啦！', 'success');
                }
                
                this.updateClassTree();
                
                // 如果在班级视图，显示能量球
                if (document.getElementById('classTreeView').classList.contains('active')) {
                    this.showEnergyBubble(amount);
                }
            }

            updateClassTree() {
                const img = document.getElementById('classTreeImg');
                img.src = this.getTreeImage(this.classTree.level);
                
                document.getElementById('classTreeLevel').textContent = this.classTree.level;
                document.getElementById('classTotalExp').textContent = this.classTree.totalExp;
                
                const maxExp = this.getClassExpForNextLevel(this.classTree.level);
                const percent = Math.min((this.classTree.exp / maxExp) * 100, 100);
                document.getElementById('classExpFill').style.width = `${percent}%`;
                document.getElementById('classNextExp').textContent = maxExp - this.classTree.exp;
            }

            showEnergyBubble(amount) {
                const container = document.getElementById('classTreeView');
                const bubble = document.createElement('div');
                bubble.className = 'energy-bubble';
                bubble.textContent = `+${amount}`;
                
                // 随机位置
                const left = 20 + Math.random() * 60; // 20% - 80%
                const bottom = 20 + Math.random() * 30; // 20% - 50%
                
                bubble.style.left = `${left}%`;
                bubble.style.bottom = `${bottom}%`;
                
                container.appendChild(bubble);
                
                setTimeout(() => {
                    bubble.remove();
                }, 2000);
            }

            rewardStudents() {
                const expGain = this.settings.expPerReward;
                let levelUpCount = 0;
                let evolvedCount = 0;

                this.students.forEach(student => {
                    if (student.level >= 100) return;

                    student.exp += expGain;
                    const maxExp = this.getExpForNextLevel(student.level);
                    
                    if (student.exp >= maxExp) {
                        student.exp -= maxExp;
                        student.level++;
                        levelUpCount++;
                        
                        // 检查是否进化 (每20级)
                        if (student.petId && (student.level - 1) % 20 === 0) {
                            evolvedCount++;
                            // 播放进化动画 (只播放第一个，避免刷屏)
                            if (evolvedCount === 1) {
                                this.showLevelUpAnimation(student);
                            }
                        }
                    }
                });

                // 班级树加分
                const classGain = Math.floor(this.students.length * expGain * 0.5);
                this.addClassExp(classGain);

                if (levelUpCount > 0) {
                    this.showNotification(`全班获得经验！${levelUpCount}位同学升级了！`, 'success');
                } else {
                    this.showNotification(`全班安静，经验值 +${expGain}`, 'success');
                }
                
                this.renderStudents();
                this.updateProgress();
                this.saveData();
            }
            
            punishStudents() {
                const expLoss = this.settings.expPerPunish;
                
                this.students.forEach(student => {
                    if (student.level === 1 && student.exp === 0) return; // 最低等级不扣

                    student.exp -= expLoss;
                    if (student.exp < 0) {
                        if (student.level > 1) {
                            student.level--;
                            student.exp = this.getExpForNextLevel(student.level) + student.exp; // 加上负数
                        } else {
                            student.exp = 0;
                        }
                    }

                    // 视觉反馈：震动 + 飘字
                    const card = document.querySelector(`[data-student-id="${student.id}"]`);
                    if (card) {
                        // 重置动画
                        card.classList.remove('shake-red');
                        void card.offsetWidth; // 触发重绘
                        card.classList.add('shake-red');
                        
                        // 创建飘字元素
                        const floatEl = document.createElement('div');
                        floatEl.className = 'exp-float-minus';
                        floatEl.textContent = `-${expLoss}`;
                        card.appendChild(floatEl);
                        
                        // 清理元素
                        setTimeout(() => floatEl.remove(), 1000);
                    }
                });
                
                this.showNotification(`环境嘈杂，全班经验值 -${expLoss}`, 'warning');
                
                // 延迟刷新列表，以免打断动画
                setTimeout(() => {
                    this.renderStudents();
                    this.updateProgress();
                }, 1000);
                
                this.saveData();
            }
            
            updateDisplay() {
                document.getElementById('volumeValue').textContent = `${this.currentVolume} dB`;
                document.getElementById('volumeFill').style.width = `${Math.min(this.currentVolume, 100)}%`;
                
                // 同步更新班级树视图的音量面板
                const treeFill = document.getElementById('treeVolumeFill');
                const treeValue = document.getElementById('treeVolumeValue');
                if (treeFill && treeValue) {
                    treeFill.style.width = `${Math.min(this.currentVolume, 100)}%`;
                    treeValue.textContent = `${this.currentVolume} dB`;
                    if (this.currentVolume > this.settings.volumeThreshold) {
                        treeValue.style.color = '#FF4444';
                    } else {
                        treeValue.style.color = '#004737';
                    }
                }
            }
            
            updateProgressLabels() {
                // 简化为只更新进度，不再切换标签
                this.updateProgress();
            }
            
            updateProgress() {
                // 功能已移除
            }
            
            feedAll() {
                const expGain = 30;
                let levelUpCount = 0;
                this.students.forEach(student => {
                    if (student.level >= 100) return;
                    
                    // 喂养消除饥饿状态
                    student.isHungry = false;
                    
                    student.exp += expGain;
                    const maxExp = this.getExpForNextLevel(student.level);
                    if (student.exp >= maxExp) {
                        student.exp -= maxExp;
                        student.level++;
                        levelUpCount++;
                        
                        if (student.petId && (student.level - 1) % 20 === 0) {
                            this.showLevelUpAnimation(student);
                        }
                    }
                });
                
                const classGain = Math.floor(this.students.length * expGain * 0.5);
                this.addClassExp(classGain);

                this.showNotification(`全班喂养成功！宠物们很开心，经验 +${expGain}`, 'success');
                this.renderStudents();
                this.saveData();
            }

            updateLeaderboard() {
                const list = document.getElementById('leaderboard');
                if(!list) return;
                list.innerHTML = '';
                
                // 按等级降序，然后按经验降序
                const topStudents = [...this.students]
                    .sort((a, b) => {
                        if (b.level !== a.level) return b.level - a.level;
                        return b.exp - a.exp;
                    })
                    .slice(0, 5);
                
                topStudents.forEach((s, index) => {
                    const item = document.createElement('div');
                    item.className = 'leaderboard-item';
                    item.innerHTML = `
                        <div class="rank rank-${index+1}">${index+1}</div>
                        <div class="rank-info">
                            <div class="rank-name">${s.name}</div>
                            <div class="rank-level">Lv.${s.level}</div>
                        </div>
                    `;
                    list.appendChild(item);
                });
            }

            // 获取宠物图片
            getPetImage(petId, level) {
                const pet = this.PET_TYPES.find(p => p.id === petId);
                if (!pet) return null;
                // 每20级进化一次，最多6个阶段 (0-5)
                const stage = Math.min(Math.floor((level - 1) / 20), 5);
                return pet.stages[stage];
            }

            // 获取宠物阶段名称
            getPetStageName(level) {
                const stages = ['萌宠蛋', '幼年期', '成长期', '成熟期', '完全体', '究极体'];
                const stage = Math.min(Math.floor((level - 1) / 20), 5);
                return stages[stage];
            }

            // 打开宠物选择模态框
            openPetSelection(studentId) {
                this.currentActionStudentId = studentId;
                const grid = document.getElementById('petGridContainer');
                grid.innerHTML = this.PET_TYPES.map(pet => `
                    <div class="pet-option" onclick="game.selectPet('${pet.id}', '${pet.name}')">
                        <img src="${pet.stages[1]}" alt="${pet.name}">
                        <div class="pet-name">${pet.name}</div>
                    </div>
                `).join('');
                this.showModal('petSelectionModal');
            }

            // 选择宠物
            selectPet(petId, petName) {
                const student = this.students.find(s => s.id === this.currentActionStudentId);
                if (student) {
                    student.petId = petId;
                    student.petName = petName;
                    student.petStage = 0;
                    this.renderStudents();
                    this.saveData();
                    this.showNotification(`成功领养了 ${petName}！`, 'success');
                    this.closeModal('petSelectionModal');
                    
                    // 播放特效
                    this.showLevelUpAnimation(student, true);
                }
            }

            // 升级动画
            showLevelUpAnimation(student, isNewPet = false) {
                const overlay = document.getElementById('levelUpOverlay');
                const content = document.getElementById('levelUpContent');
                const petImg = this.getPetImage(student.petId, student.level);
                const stageName = this.getPetStageName(student.level);
                
                content.innerHTML = `
                    <div style="font-size: 60px; margin-bottom: 10px;">${isNewPet ? '🥚' : '🎉'}</div>
                    <h2 style="color: #FFDE5E; font-size: 28px; margin-bottom: 10px;">${isNewPet ? '领养成功！' : '升级啦！'}</h2>
                    <div style="color: white; font-size: 20px; margin-bottom: 20px;">${student.name} 的伙伴</div>
                    <img src="${petImg}" style="width: 180px; height: 180px; object-fit: contain; filter: drop-shadow(0 0 20px rgba(255,255,255,0.5)); animation: pulse 1s infinite;">
                    <div style="color: #A7DB9A; font-size: 24px; font-weight: bold; margin-top: 15px;">Lv.${student.level} ${stageName}</div>
                `;
                
                overlay.style.display = 'flex';
                
                // 播放音效 (简单模拟)
                const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.type = 'sine';
                osc.frequency.setValueAtTime(440, audioCtx.currentTime);
                osc.frequency.exponentialRampToValueAtTime(880, audioCtx.currentTime + 0.5);
                gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
                osc.start();
                osc.stop(audioCtx.currentTime + 0.5);

                setTimeout(() => {
                    overlay.style.display = 'none';
                }, 3000);
            }

            renderStudents() {
                const container = document.getElementById('studentsContainer');
                container.innerHTML = '';
                container.style.gridTemplateColumns = `repeat(${this.columnCount}, 1fr)`;
                
                const sortedStudents = [...this.students].sort((a, b) => a.position - b.position);
                
                sortedStudents.forEach(student => {
                    // 兼容旧数据
                    if (!student.level) student.level = 1;
                    if (student.exp === undefined) student.exp = 0;

                    const card = document.createElement('div');
                    card.className = 'student-card';
                    card.dataset.studentId = student.id;
                    card.draggable = this.editMode;
                    
                    if (this.selectedStudent === student.id) {
                        card.classList.add('selected');
                    }
                    
                    const treeUrl = this.getTreeImage(student.level);
                    const maxExp = this.getExpForNextLevel(student.level);
                    const expPercent = Math.min((student.exp / maxExp) * 100, 100);
                    
                    // 宠物逻辑
                    let petDisplay = '';
                    let petBadge = '';
                    let statusBubble = '';
                    
                    if (student.petId) {
                        const petImg = this.getPetImage(student.petId, student.level);
                        const stageName = this.getPetStageName(student.level);
                        petDisplay = `<img src="${petImg}" alt="Pet">`;
                        petBadge = `<div class="pet-stage-badge">${stageName}</div>`;
                        
                        if (student.isHungry) {
                            statusBubble = `<div class="status-bubble" style="display:block">饿了...</div>`;
                        }
                    } else {
                        // 未领养显示蛋
                        petDisplay = `<img src="https://musk-online.fbcontent.cn/pub-musk-ai-studio/workflow/file/picture/iALmz67rzmGKEkozJvARMB.jpg" alt="Egg" style="opacity:0.7">`;
                        petBadge = `<div class="pet-stage-badge" style="background:#ccc">未领养</div>`;
                    }

                    card.innerHTML = `
                        <button class="side-btn btn-left-sub" data-action="sub-exp">-</button>
                        <button class="side-btn btn-right-add" data-action="add-exp">+</button>
                        
                        <div class="student-stats-box">
                            <div class="mini-level-badge">Lv.${student.level}</div>
                            <div class="mini-exp-track">
                                <div class="mini-exp-fill" style="width: ${expPercent}%"></div>
                            </div>
                        </div>
                        
                        <div class="student-pet-container">
                            ${petDisplay}
                            ${petBadge}
                            ${statusBubble}
                        </div>

                        <div class="student-name">${student.name}</div>
                    `;
                    
                    card.addEventListener('click', (e) => {
                        if (e.target.classList.contains('side-btn')) {
                            const action = e.target.dataset.action;
                            this.handleStudentAction(student.id, action);
                            e.stopPropagation();
                        } else if (!this.editMode) {
                            if (!student.petId) {
                                this.openPetSelection(student.id);
                            } else {
                                this.showStudentActionModal(student.id);
                            }
                        }
                    });
                    
                    if (this.editMode) {
                        this.addDragEvents(card);
                    }
                    
                    container.appendChild(card);
                });
                
                this.updateProgress();
                this.updateLeaderboard();
            }
            
            addDragEvents(card) {
                card.addEventListener('dragstart', (e) => {
                    this.draggedElement = card;
                    card.classList.add('dragging');
                    e.dataTransfer.effectAllowed = 'move';
                });
                
                card.addEventListener('dragend', () => {
                    card.classList.remove('dragging');
                    this.draggedElement = null;
                    document.querySelectorAll('.student-card').forEach(c => {
                        c.classList.remove('drag-over');
                    });
                });
                
                card.addEventListener('dragover', (e) => {
                    e.preventDefault();
                    if (this.draggedElement && this.draggedElement !== card) {
                        card.classList.add('drag-over');
                    }
                });
                
                card.addEventListener('dragleave', () => {
                    card.classList.remove('drag-over');
                });
                
                card.addEventListener('drop', (e) => {
                    e.preventDefault();
                    card.classList.remove('drag-over');
                    
                    if (this.draggedElement && this.draggedElement !== card) {
                        this.swapStudentPositions(
                            parseInt(this.draggedElement.dataset.studentId),
                            parseInt(card.dataset.studentId)
                        );
                    }
                });
            }
            
            swapStudentPositions(id1, id2) {
                const student1 = this.students.find(s => s.id === id1);
                const student2 = this.students.find(s => s.id === id2);
                
                if (student1 && student2) {
                    const tempPosition = student1.position;
                    student1.position = student2.position;
                    student2.position = tempPosition;
                    
                    this.renderStudents();
                    this.showNotification(`已交换 ${student1.name} 和 ${student2.name} 的座位`, 'success');
                    this.saveData();
                }
            }
            
            showStudentActionModal(studentId) {
                const student = this.students.find(s => s.id === studentId);
                if (!student) return;
                
                this.currentActionStudentId = studentId;
                document.getElementById('actionStudentName').textContent = student.name;
                this.showModal('studentActionModal');
            }

            applyScoreChange(studentId, score, reason) {
                const student = this.students.find(s => s.id === studentId);
                if (!student) return;

                // 兼容旧数据
                if (!student.level) student.level = 1;
                if (student.exp === undefined) student.exp = 0;

                if (score > 0) {
                    student.exp += score;
                    const maxExp = this.getExpForNextLevel(student.level);
                    if (student.exp >= maxExp) {
                        student.exp -= maxExp;
                        student.level++;
                    }
                    this.addClassExp(score); // 班级树同步加分
                    this.showNotification(`${student.name} ${reason}: +${score}分`, 'success');
                } else {
                    student.exp += score; // score is negative
                    if (student.exp < 0) {
                        if (student.level > 1) {
                            student.level--;
                            student.exp = this.getExpForNextLevel(student.level) + student.exp;
                        } else {
                            student.exp = 0;
                        }
                    }
                    this.showNotification(`${student.name} ${reason}: ${score}分`, 'warning');
                }
                
                this.renderStudents();
                this.saveData();
            }

            handleLevelChange(studentId, action) {
                const student = this.students.find(s => s.id === studentId);
                if (!student) return;

                if (action === 'level-up') {
                    if (student.level < 100) {
                        student.level++;
                        student.exp = 0;
                        // 检查进化 (每20级)
                        if (student.petId && (student.level - 1) % 20 === 0) {
                             this.showLevelUpAnimation(student);
                        }
                        this.showNotification(`${student.name} 升了一级！`, 'success');
                    }
                } else if (action === 'level-down') {
                    if (student.level > 1) {
                        student.level--;
                        student.exp = 0;
                        this.showNotification(`${student.name} 降了一级`, 'warning');
                    }
                }
                this.renderStudents();
                this.saveData();
            }

            handleStudentAction(studentId, action) {
                const student = this.students.find(s => s.id === studentId);
                if (!student) return;
                
                // 兼容旧数据
                if (!student.level) student.level = 1;
                if (student.exp === undefined) student.exp = 0;

                const expAmount = 50; // 手动操作每次50点

                switch (action) {
                    case 'add-exp':
                        student.exp += expAmount;
                        const maxExp = this.getExpForNextLevel(student.level);
                        if (student.exp >= maxExp) {
                            student.exp -= maxExp;
                            student.level++;
                        }
                        this.addClassExp(expAmount); // 班级树同步加分
                        this.showNotification(`已为 ${student.name} 增加经验`, 'success');
                        break;
                    case 'sub-exp':
                        student.exp -= expAmount;
                        if (student.exp < 0) {
                            if (student.level > 1) {
                                student.level--;
                                student.exp = this.getExpForNextLevel(student.level) + student.exp;
                            } else {
                                student.exp = 0;
                            }
                        }
                        this.showNotification(`已为 ${student.name} 扣除经验`, 'warning');
                        break;
                }
                
                this.renderStudents();
                this.saveData();
            }
            
            selectStudent(studentId) {
                this.selectedStudent = this.selectedStudent === studentId ? null : studentId;
                this.renderStudents();
                
                if (this.selectedStudent) {
                    const student = this.students.find(s => s.id === studentId);
                    this.showNotification(`已选中 ${student.name}`, 'success');
                }
            }
            
            deductAllStudents() {
                const expLoss = 50; // 手动全班扣除50点
                this.students.forEach(student => {
                    if (student.level === 1 && student.exp === 0) return;

                    student.exp -= expLoss;
                    if (student.exp < 0) {
                        if (student.level > 1) {
                            student.level--;
                            student.exp = this.getExpForNextLevel(student.level) + student.exp;
                        } else {
                            student.exp = 0;
                        }
                    }
                });
                this.showNotification('全班扣除经验值', 'warning');
                this.renderStudents();
                this.saveData();
            }
            
            randomCall() {
                if (this.students.length === 0) return;
                
                document.querySelectorAll('.student-card').forEach(card => {
                    card.classList.remove('highlighted');
                });
                
                const randomIndex = Math.floor(Math.random() * this.students.length);
                const randomStudent = this.students[randomIndex];
                
                setTimeout(() => {
                    const card = document.querySelector(`[data-student-id="${randomStudent.id}"]`);
                    if (card) {
                        card.classList.add('highlighted');
                        card.scrollIntoView({ behavior: 'smooth', block: 'center' });
                    }
                }, 100);
                
                this.showNotification(`随机点名：${randomStudent.name}`, 'success');
                
                setTimeout(() => {
                    const card = document.querySelector(`[data-student-id="${randomStudent.id}"]`);
                    if (card) {
                        card.classList.remove('highlighted');
                    }
                }, 3000);
            }
            
            resetProgress() {
                if (confirm('确定要重置所有学生的进度吗？此操作不可撤销。')) {
                    this.students.forEach(student => {
                        student.level = 1;
                        student.exp = 0;
                    });
                    
                    this.totalQuietTime = 0;
                    this.renderStudents();
                    this.updateDisplay();
                    this.showNotification('进度已重置', 'success');
                    this.saveData();
                }
            }
            
            importStudents() {
                const names = document.getElementById('studentNames').value
                    .split('\n')
                    .map(name => name.trim())
                    .filter(name => name.length > 0);
                
                if (names.length === 0) {
                    this.showNotification('请输入学生姓名', 'warning');
                    return;
                }
                
                this.students = names.map((name, index) => ({
                    id: index + 1,
                    name: name,
                    level: 1,
                    exp: 0,
                    position: index
                }));
                
                this.renderStudents();
                this.closeModal('importModal');
                this.showNotification(`成功导入 ${names.length} 名学生`, 'success');
                this.saveData();
                
                document.getElementById('studentNames').value = '';
            }
            
            updateRules() {
                const rulesList = document.getElementById('rulesList');
                rulesList.innerHTML = '';
                
                const rules = [
                    '点击"开始检测"允许使用麦克风',
                    `当音量 < ${this.settings.volumeThreshold} 分贝时计时启动`,
                    `坚持 ${this.settings.timerDuration} 秒全班同学获得经验值`,
                    '经验值满了会自动升级，树木形态会发生变化',
                    '最高等级为 100 级，努力培养出神树吧！',
                    `当音量 > ${this.settings.volumeThreshold} 分贝并持续 ${this.settings.punishDuration} 秒时，全班同学将扣除经验值`,
                    '点击学生卡片可以手动增加或扣除经验'
                ];
                
                rules.forEach(rule => {
                    const li = document.createElement('li');
                    li.textContent = rule;
                    rulesList.appendChild(li);
                });
            }
            
            saveDetailedSettings() {
                this.settings.volumeThreshold = parseInt(document.getElementById('detailedVolumeThreshold').value);
                this.settings.timerDuration = parseInt(document.getElementById('detailedTimerDuration').value);
                this.settings.micSensitivity = parseFloat(document.getElementById('detailedMicSensitivity').value);
                
                if (document.getElementById('resetProgressCheck').checked) {
                    this.resetProgress();
                }
                
                this.updateRules();
                this.closeModal('settingsModal');
                this.showNotification('设置已保存', 'success');
                this.saveData();
            }
            
            showModal(modalId) {
                document.getElementById(modalId).style.display = 'block';
                
                if (modalId === 'settingsModal') {
                    document.getElementById('detailedVolumeThreshold').value = this.settings.volumeThreshold;
                    document.getElementById('detailedTimerDuration').value = this.settings.timerDuration;
                    document.getElementById('detailedMicSensitivity').value = this.settings.micSensitivity;
                    document.getElementById('resetProgressCheck').checked = false;
                }
            }
            
            closeModal(modalId) {
                document.getElementById(modalId).style.display = 'none';
            }
            


            openSettings() {
                // 回显数据
                document.getElementById('setThreshold').value = this.settings.volumeThreshold;
                document.getElementById('setQuietDuration').value = this.settings.timerDuration;
                document.getElementById('setPunishDuration').value = this.settings.punishDuration;
                document.getElementById('setExpReward').value = this.settings.expPerReward;
                document.getElementById('setExpPunish').value = this.settings.expPerPunish;
                document.getElementById('setLevelDifficulty').value = this.settings.levelDifficulty || 100;
                document.getElementById('setColumnCount').value = this.columnCount;
                
                this.showModal('settingsModal');
            }

            saveSettings() {
                this.settings.volumeThreshold = parseInt(document.getElementById('setThreshold').value);
                this.settings.timerDuration = parseInt(document.getElementById('setQuietDuration').value);
                this.settings.punishDuration = parseInt(document.getElementById('setPunishDuration').value);
                this.settings.expPerReward = parseInt(document.getElementById('setExpReward').value);
                this.settings.expPerPunish = parseInt(document.getElementById('setExpPunish').value);
                this.settings.levelDifficulty = parseInt(document.getElementById('setLevelDifficulty').value);
                
                const newColCount = parseInt(document.getElementById('setColumnCount').value);
                if (newColCount !== this.columnCount) {
                    this.columnCount = newColCount;
                    document.getElementById('columnCount').value = newColCount; // 同步外部控件
                    this.renderStudents();
                }

                // 同步外部滑块
                document.getElementById('volumeThresholdSlider').value = this.settings.volumeThreshold;
                document.getElementById('thresholdValue').textContent = `${this.settings.volumeThreshold} dB`;

                this.saveData();
                this.closeModal('settingsModal');
                this.showNotification('⚙️ 工作台设置已保存', 'success');
            }

            showNotification(message, type = 'success') {
                const notification = document.getElementById('notification');
                notification.textContent = message;
                notification.className = `notification ${type}`;
                notification.classList.add('show');
                
                setTimeout(() => {
                    notification.classList.remove('show');
                }, 3000);
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            window.game = new QuietTreeGame();
        });
</script>
</body>
</html>
