# ============================================================
#  docs-xx Hugo 站点主配置
#  站点根目录：hugo/    主题：themes/hugo-sakaay（自建）
# ============================================================
baseURL = "https://www.sakaay.com/"
title = "当以读书通世事"
theme = "hugo-sakaay"

locale = "zh-CN"
languageName = "简体中文"
defaultContentLanguage = "zh"
hasCJKLanguage = true

# 目录型 URL（与 VitePress cleanUrls 行为一致）
uglyURLs = false
# 默认内容类型渲染
defaultContentLanguageInSubdir = false
enableRobotsTXT = true
enableGitInfo = true
# 摘要自动截取长度
summaryLength = 120

# 分页
[pagination]
  pagerSize = 39
  path = "page"

# 主分区（首页文章来源）
[params]
  mainSections = ["teach", "steam", "exammination", "network", "tools", "life", "love", "yule", "xingqu"]

# 分类法
[taxonomies]
  category = "categories"
  tag = "tags"

# 永久链接规则
[permalinks]
  page = "/:slugorfilename/"

# 输出格式
[outputs]
  home = ["HTML", "RSS", "SearchIndex"]
  page = ["HTML"]
  section = ["HTML", "RSS"]
  taxonomy = ["HTML"]
  term = ["HTML"]

# 媒体类型：搜索索引（FlexSearch）
[mediaTypes]
  [mediaTypes."application/search-index"]
    suffixes = ["json"]

[outputFormats]
  [outputFormats.SearchIndex]
    mediaType = "application/search-index"
    baseName = "search-index"
    isPlainText = true
    notAlternative = true

# 标记渲染（Hugo 0.116+ 的 goldmark 配置）
[markup]
  [markup.goldmark]
    [markup.goldmark.renderer]
      unsafe = true
    [markup.goldmark.parser]
      [markup.goldmark.parser.attribute]
        block = false
        title = false
    [markup.goldmark.extensions]
      definitionList = true
      footnote = true
      table = true
      typographer = false
  [markup.highlight]
    style = "github"
    lineNos = true
    lineNumbersInTable = false
    noClasses = false
    guessSyntax = true
    tabWidth = 2
  [markup.tableOfContents]
    startLevel = 2
    endLevel = 4
    ordered = false

# 站点地图
[sitemap]
  changefreq = "weekly"
  priority = 0.5
  filename = "sitemap.xml"

# 隐私与第三方服务
[privacy]
  [privacy.vimeo]
    disabled = false
  [privacy.twitter]
    disabled = false

# 构建
[build]
  writeStats = true
  [build.cache]
    target = "content"

[module]
  [[module.mounts]]
    source = 'content'
    target = 'content'
  [[module.mounts]]
    source = 'static'
    target = 'static'
  [[module.mounts]]
    source = 'layouts'
    target = 'layouts'
  [[module.mounts]]
    source = 'assets'
    target = 'assets'
  [[module.mounts]]
    source = 'data'
    target = 'data'
  [[module.mounts]]
    source = 'i18n'
    target = 'i18n'
  [[module.mounts]]
    source = '../docs/public'
    target = 'static'
    # 部署平台（EdgeOne Pages）单文件上限 25MiB，超限会在构建阶段直接失败。
    # 这里直接不挂载超限的本地视频；源文件仍保留在 ../docs/public，播放器加载失败时会给出降级提示。
    # 注：Hugo 0.153+ 起 excludeFiles 被标记为 deprecated（新写法 files 的 glob 语义在排除场景下不稳定），
    # 这里继续使用 excludeFiles；同时 scripts/prepare-deploy.mjs 会兜底清理任何超限文件。
    excludeFiles = ['music/video_《反乌托邦Pt.2》*']

