<div class="sidebar-card tk-time-progress-card">
  <div class="card-title"><span class="title-icon">⏳</span><span class="title-text">时间进度</span></div>
  <div class="time-progress-body">
    <div class="progress-item" data-progress="year">
      <div class="progress-info"><span>本年进度</span><span class="progress-percent" id="yearPercent">0%</span></div>
      <div class="progress-bar"><div class="progress-fill" id="yearFill" style="width:0%"></div></div>
      <div class="progress-info"><span class="progress-remain" id="yearRemain"></span></div>
    </div>
    <div class="progress-item" data-progress="month">
      <div class="progress-info"><span>本月进度</span><span class="progress-percent" id="monthPercent">0%</span></div>
      <div class="progress-bar"><div class="progress-fill" id="monthFill" style="width:0%"></div></div>
      <div class="progress-info"><span class="progress-remain" id="monthRemain"></span></div>
    </div>
    <div class="progress-item" data-progress="week">
      <div class="progress-info"><span>本周进度</span><span class="progress-percent" id="weekPercent">0%</span></div>
      <div class="progress-bar"><div class="progress-fill" id="weekFill" style="width:0%"></div></div>
      <div class="progress-info"><span class="progress-remain" id="weekRemain"></span></div>
    </div>
    <div class="spring-festival-countdown">
      <div class="progress-info">
        <span class="countdown-label">距离春节</span>
        <span class="countdown-days" id="springDays">--</span>
      </div>
      <div class="progress-info"><span class="countdown-date" id="springDate"></span></div>
    </div>
  </div>
</div>
